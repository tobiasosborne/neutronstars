[[entry]]
id = "gr.kerr-line-element-bl"
kind = "equation"
domain = "gr"
name = "Kerr line element, Boyer-Lindquist form (as printed)"
statement = "The Kerr line element in Boyer-Lindquist coordinates (t, r, theta, phi), as printed by Dexter & Agol (2009) in units G = c = M = 1: ds^2 = -rho^2 (Delta/Sigma^2) dt^2 + (Sigma^2/rho^2)(dphi - (2ar/Sigma^2) dt)^2 sin^2 theta + (rho^2/Delta) dr^2 + rho^2 dtheta^2, with Delta = r^2 - 2r + a^2, rho^2 = r^2 + a^2 cos^2 theta and Sigma^2 = (r^2 + a^2)^2 - a^2 Delta sin^2 theta, where the paper calls a 'the angular momentum of the black hole'. The signature is (-,+,+,+): as r -> infinity the metric tends to diag(-1, 1, r^2, r^2 sin^2 theta). Recorded only as the printed parent of the a = 0 (Schwarzschild) reduction; Kerr geometry is outside PRD scope."
latex = 'ds^2 = -\rho^2\frac{\Delta}{\Sigma^2}dt^2 + \frac{\Sigma^2}{\rho^2}\left(d\phi-\frac{2ar}{\Sigma^2}dt\right)^2\sin^2\theta + \frac{\rho^2}{\Delta}dr^2 + \rho^2d\theta^2,\quad \Delta = r^2-2r+a^2,\quad \rho^2 = r^2+a^2\cos^2\theta,\quad \Sigma^2 = (r^2+a^2)^2-a^2\Delta\sin^2\theta\quad (G=c=M=1)'
source = "dexter_agol_2009_kerr"
locator = "Sect. 2, eqs. 1-3, p. 2"
anchor = 'In Boyer-Lindquist coordinates ($t$,$r$,$\theta$,$\phi$), the Kerr line element can be written,'
anchor_tex = '\nonumber ds^2 &=& -\rho^2 \frac{\Delta}{\Sigma^2} dt^2 + \frac{\Sigma^2}{\rho^2}\left ( d\phi -\frac{2ar}{\Sigma^2}dt\right )^2\sin^2\theta+\\'
ocr = "good"
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "accept", note = "Both TeX anchors match. Signs, powers, definitions and \\(G=c=M=1\\) agree with [D&A text:89–103](/home/tobias/Projects/neutronstars/refs/dexter_agol_2009_kerr.txt:89). Retain as the Schwarzschild derivation’s parent." }]
validity = "vacuum spacetime; Boyer-Lindquist coordinates; units G = c = M = 1 as printed (all lengths in units of the geometric mass)"
provenance = "derivable"
ownership = "stub"
notes = '''Definitions anchored verbatim in the tex: '\Delta &=& r^2-2r+a^2, \hspace{8pt} \rho^2 = r^2+a^2\cos^2{\theta}, \\' (eq. 2) and '\Sigma^2 &=& (r^2+a^2)^2-a^2\Delta \sin^2{\theta},' (eq. 3); units sentence 'where $a$ is the angular momentum of the black hole and we use units with $G=c=M=1$.' Equation numbers 1-3 and every sign and exponent were read off the rendered PDF p. 2 and agree with the tex. Source identity: refs/INDEX.md line 15 still labels this key MISFILED, but the local tex header reads '% assembled from arXiv:0903.0620 source files' and the title is 'A Fast New Public Code for Computing Photon Orbits in a Kerr Spacetime'; the local pdf sha256 9787c0f0ed265f7dd0b4d8b2e2a06dcda976f07be4db57a07345025f25c6c886 equals refs/CHECKSUMS and the INDEX.md row 'dexter_agol_2009_kerr_CORRECT'. The INDEX row is stale. Symbols: the paper's rho^2, Delta, Sigma^2, a and M (= 1) map to the proposed \rho_K^2, \Delta_K, \Sigma_K^2, a_{spin} and the existing GM/c^2 (truth/harvest/notation_additions_geodesic.md). Bare \rho is mass density in this project. The paper does not say whether a is per unit mass; with M = 1 the distinction is invisible and the a = 0 use below does not depend on it. Signature claim checked by the harvester: rho^2 Delta/Sigma^2 -> 1 and rho^2/Delta -> 1 as r -> infinity. Notation bridge (gr_geodesic-r1 cross-entry): DA09 rho^2 is \rho_K^2, never bare \rho (mass density); DA09 theta, phi are \theta_{Sch}, \phi_{Sch}, not the RT ray angle \theta or the Bel02 surface azimuth \phi; DA09 M = 1 is the geometric mass M = G M_phys/c^2 (dictionary GM/c^2), a length.'''

[[entry]]
id = "gr.schwarzschild-line-element"
kind = "equation"
domain = "gr"
name = "Schwarzschild line element (a = 0 reduction), exterior metric"
statement = "Setting a = 0 in the Boyer-Lindquist Kerr line element gives the Schwarzschild line element ds^2 = -(1 - 2M/r) dt^2 + (1 - 2M/r)^(-1) dr^2 + r^2 (dtheta^2 + sin^2 theta dphi^2) in geometrized units G = c = 1 with the mass restored (M here is the length GM/c^2), signature (-,+,+,+). In the project's Gaussian CGS units (t in s, r in cm): ds^2 = -(1 - r_g/r) c^2 dt^2 + (1 - r_g/r)^(-1) dr^2 + r^2 (dtheta^2 + sin^2 theta dphi^2), with r_g = 2GM/c^2 (dictionary symbol r_g), so g_rr = (1 - r_g/r)^(-1). Applied to a star it describes the exterior r >= R with M the star's gravitational mass, which is the blessed assumption gr.approx-schwarzschild-exterior (Pechenick Sect. II). In the Phi/Lambda convention of gr.notation-potekhin (g_tt = -e^(2 Phi) c^2, g_rr = e^(2 Lambda)) the exterior has e^(2 Phi) = 1 - r_g/r and e^(-2 Lambda) = 1 - r_g/r; the latter corrects the PPP15 eq. 1 misprint e^(2 Lambda) = 1 - 2GM_r/(c^2 r) for r >= R."
latex = 'ds^2 = -\left(1-\frac{2M}{r}\right)dt^2 + \left(1-\frac{2M}{r}\right)^{-1}dr^2 + r^2\left(d\theta^2+\sin^2\theta\,d\phi^2\right)\ (G=c=1);\qquad ds^2 = -\left(1-\frac{r_g}{r}\right)c^2dt^2 + \left(1-\frac{r_g}{r}\right)^{-1}dr^2 + r^2\left(d\theta^2+\sin^2\theta\,d\phi^2\right),\quad r_g = \frac{2GM}{c^2}'
source = "dexter_agol_2009_kerr"
locator = "Sect. 2, eqs. 1-3 at a = 0, p. 2"
anchor = 'where $a$ is the angular momentum of the black hole and we use units with $G=c=M=1$.'
anchor_tex = '\Delta &=& r^2-2r+a^2, \hspace{8pt} \rho^2 = r^2+a^2\cos^2{\theta}, \\'
ocr = "good"
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "accept", note = "The \\(a=0\\) reduction and restored units are correct. [D&A:89–103](/home/tobias/Projects/neutronstars/refs/dexter_agol_2009_kerr.txt:89) supplies the parent; [Pechenick:58–59](/home/tobias/Projects/neutronstars/refs/pechenick_1983_gr_ray_tracing.txt:58) supplies the stellar-exterior assumption. The derived \\(e^{-2\\Lambda}=1-r_g/r\\) correctly repairs the printed relation at [PPP:201–202](/home/tobias/Projects/neutronstars/refs/potekhin_pons_page_2015_thermal.txt:201)." }]
validity = "vacuum, static, spherically symmetric; for a star only outside the surface, r >= R (gr.approx-schwarzschild-exterior); r > r_g"
depends_on = ["gr.kerr-line-element-bl", "gr.schwarzschild-radius"]
provenance = "derivable"
ownership = "stub"
notes = '''Derivation (redo in a few lines). (1) a = 0 in eqs. 2-3: Delta -> r^2 - 2r, rho^2 -> r^2, Sigma^2 -> (r^2)^2 - 0 = r^4. (2) Terms of eq. 1: -rho^2 (Delta/Sigma^2) dt^2 = -r^2 (r^2 - 2r)/r^4 dt^2 = -(1 - 2/r) dt^2; (Sigma^2/rho^2)(dphi - 2ar dt/Sigma^2)^2 sin^2 theta = r^2 sin^2 theta dphi^2 (the frame-dragging cross term is proportional to a); (rho^2/Delta) dr^2 = r^2/(r^2 - 2r) dr^2 = (1 - 2/r)^(-1) dr^2; rho^2 dtheta^2 = r^2 dtheta^2. (3) Restore M: the paper measures lengths in units of M, so substitute r -> r/M, t -> t/M, ds -> ds/M and multiply by M^2; 2/r becomes 2M/r. (4) Restore G and c: the geometric mass M becomes the length GM/c^2 and the time coordinate becomes ct with t in s, so 2M/r -> 2GM/(c^2 r) = r_g/r and dt^2 -> c^2 dt^2. Check: sympy 1.14 simplifies [a = 0 limit of eq. 1] - [Schwarzschild form, M = 1] to 0. Signature: the a = 0 metric tends to diag(-1, 1, r^2, r^2 sin^2 theta), (-,+,+,+), the same signature as the PPP15 eq. 1 form (g_tt = -e^{2 Phi} c^2, g_rr = e^{2 Lambda}; gr.metric-static-spherical). Exterior use: Pechenick Sect. II prints 'The metric outside the star is taken to be the' / 'Schwarzschild metric with mass M and radial coordinate' (two text-layer lines). This entry supplies the line element that gr.metric-static-spherical (rejected for the PPP15 e^{2 Lambda} misprint) was meant to supply. Cross-check (OCR poor, prose only): Wasserman & Shapiro 1983 Sect. II work 'In a Schwarzschild background, the field equations (1)' and 'where we have adopted geometrized units with G = c = \.' (the backslash is OCR debris for 1), with 'y = 2M/r'; they do not print the line element, so they confirm only the setting and the unit convention. Coordinates: theta is the Schwarzschild polar coordinate (canonical \theta_{Sch}); phi is the Schwarzschild azimuth (proposed \phi_{Sch}; canonical bare \phi is the surface azimuth about the line of sight). Notation bridge (gr_geodesic-r1 cross-entry): M is the geometric mass G M_phys/c^2 (dictionary GM/c^2, = r_g/2); theta, phi are \theta_{Sch}, \phi_{Sch}, distinct from the RT ray angle \theta (mu = cos theta) and from the Bel02 surface azimuth \phi.'''

[[entry]]
id = "gr.timelike-constants-schwarzschild"
kind = "result"
domain = "gr"
name = "Timelike Schwarzschild geodesic: E, L per unit rest mass; affine parameter is proper time"
statement = "For a timelike geodesic (delta_1 = 1) at a = 0, take the orbit plane as theta = pi/2, so the Carter constant Q = 0 and |L_z| is the magnitude of the total angular momentum; L_z is signed, and L below is a signed synonym of L_z only because the equatorial plane has been chosen. Dexter & Agol eqs. 5 and 8-10 at a = 0 give the tangent dx^mu/dlambda = (E (1 - 2M/r)^(-1), dr/dlambda, 0, L/r^2) with (dr/dlambda)^2 = E^2 - (1 - 2M/r)(1 + L^2/r^2). Its norm in the a = 0 metric is g_{mu nu} (dx^mu/dlambda)(dx^nu/dlambda) = -delta_1 = -1. So, after choosing the orientation (lambda increasing to the future, E > 0), lambda = tau + C with tau the proper time of the worldline (dtau^2 = -ds^2) and C an additive constant, and dx^mu/dtau = u^mu is the unit four-velocity. Mueller & Grave (2009) state the replacement of the affine parameter by proper time for timelike geodesics. The constants are its covariant components E = -u_t = (1 - 2M/r) dt/dtau and L = u_phi = r^2 dphi/dtau, i.e. energy and angular momentum per unit rest mass. These are the normalised constants of DA09 Sect. 2, whose equations carry no rest mass m; DA09 Sect. 3 instead defines gamma = E/m with an explicit m, and the two agree only when the Sect. 2 E is read per unit rest mass (m = 1). Geometric units G = c = 1. In CGS, with t and tau in s: E = (1 - r_g/r) dt/dtau is dimensionless, the conserved energy divided by the rest energy m c^2, and L = r^2 dphi/dtau (cm^2 s^-1) is the angular momentum per unit rest mass."
latex = 'E = -u_t = \left(1-\frac{2M}{r}\right)\frac{dt}{d\tau},\qquad L_z = u_\phi = r^2\frac{d\phi}{d\tau},\qquad g_{\mu\nu}\frac{dx^\mu}{d\lambda}\frac{dx^\nu}{d\lambda} = -\delta_1 = -1\ \Rightarrow\ \lambda = \tau + C\qquad (a=0,\ \theta=\pi/2,\ \mathcal{Q}=0,\ G=c=1)'
source = "dexter_agol_2009_kerr"
locator = "Sect. 2, eqs. 5-10 at a = 0, delta_1 = 1, p. 2"
anchor = '''and the constants of the motion are the angular momentum about the black hole spin axis, $L_z$, the energy, $E$, and Carter's constant $\mathcal{Q}$.'''
anchor_tex = '$\delta_1 = 0\hspace{2pt}(1)$ for null (timelike) geodesics.'
ocr = "good"
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "fix", note = "applied: added the Mueller-Grave proper-time quote (tex:700, txt:719, grep -F -c = 1 each) and its kappa constraint to notes (anchor_tex must stay in DA09); lambda = tau + C after choosing orientation (statement, latex, notes); Sect. 2 normalised constants distinguished from Sect. 3 gamma = E/m in the statement; CGS E stated as energy / rest energy; |L_z| stated as the total angular-momentum magnitude, L a signed synonym only for the chosen equatorial plane." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "accept", note = "TeX anchors match at DA09:78. The normalized tangent, specific constants, signed \\(L_z\\), and \\(\\lambda=\\tau+C\\) are consistent with [DA09:122–156](/home/tobias/Projects/neutronstars/refs/dexter_agol_2009_kerr.txt:122). The added proper-time quote and normalization constraint match [Müller–Grave:719–728](/home/tobias/Projects/neutronstars/refs/muller_grave_2009_spacetimes.txt:719). Round-1 corrections applied." }]
validity = "timelike geodesics of the Schwarzschild exterior (r > 2M); orbit plane chosen as theta = pi/2"
depends_on = ["gr.schwarzschild-line-element"]
provenance = "derivable"
ownership = "stub"
notes = '''Derivation. (1) eq. 7 at a = 0: Theta = Q - L_z^2 csc^2 theta cos^2 theta. Spherical symmetry lets the orbit plane be theta = pi/2, where Theta = Q; staying at theta = pi/2 needs Theta = 0 there, so Q = 0 and L_z = L. (2) eq. 10 at a = 0: dlambda = r^2 dr/sqrt(R), so (dr/dlambda)^2 = R/r^4. eq. 6 at a = 0, Q = 0: R = r^4 E^2 - (r^2 - 2r)(L^2 + delta_1 r^2), so R/r^4 = E^2 - (1 - 2/r)(delta_1 + L^2/r^2). (3) eq. 8 at a = 0: t = lambda E + 2 int r^3 E dr/(Delta sqrt R), so dt/dlambda = [r^2 E/sqrt R + 2 r^3 E/(Delta sqrt R)] sqrt(R)/r^2 = E (Delta + 2r)/Delta = E/(1 - 2/r). (4) eq. 9 at a = 0: phi = int L_z csc^2 theta dtheta/sqrt(Theta). eqs. 5 and 10 give dtheta/sqrt(Theta) = dr/sqrt(R) = dlambda/r^2, so dphi/dlambda = L/r^2 at theta = pi/2. (5) Norm with gr.schwarzschild-line-element: -(1 - 2/r) E^2 (1 - 2/r)^(-2) + (1 - 2/r)^(-1) [E^2 - (1 - 2/r)(delta_1 + L^2/r^2)] + r^2 L^2/r^4 = -delta_1. (6) Lowering: u_t = -(1 - 2/r) E/(1 - 2/r) = -E and u_phi = r^2 L/r^2 = L. Steps 2-6 checked with sympy 1.14: the norm simplifies to -delta_1, u_t = -E, u_phi = L_z. Restoring units: 2/r -> 2M/r -> r_g/r; lambda (a length) -> c tau; the geometric L -> L/c; E unchanged. NOT PRINTED by DA09: lambda = tau + C uses the proper-time definition dtau^2 = -ds^2 in this signature; the paper starts from the Hamilton-Jacobi form '-2 \hspace{2pt}\frac{\partial S}{\partial \lambda} = g^{\mu \nu} \frac{\partial S}{\partial x^\mu}\frac{\partial S}{\partial x^\nu},' and never names proper time. The per-unit-rest-mass reading follows from the norm -1 derived above. SOURCE TENSION: Sect. 3 defines '$\gamma \equiv E/m$' with an explicit rest mass m, while the Sect. 2 equations carry no m (delta_1 = 1 multiplies r^2 directly). The two agree only for m = 1, i.e. E per unit rest mass, which is the normalisation adopted here. Symbols: E, L_z and lambda (delta_1 = 1) map to the proposed \tilde E, \tilde L and \tau_{prop}. Bare E is photon energy; bare L is retired. Proper-time anchor (r1 fix): Mueller & Grave 2009, refs/muller_grave_2009_spacetimes.tex line 700, 'For timelike geodesics, however, we replace the affine parameter by the proper time $\tau$.' (grep -F -c = 1; the pdftotext copy refs/muller_grave_2009_spacetimes.txt line 719 breaks it after 'For timelike geodesics, however, we replace the affine parameter by the', grep -F -c = 1). The same section gives the constraint 'g_{\mu\nu}\frac{dx^{\mu}}{d\lambda}\frac{dx^{\nu}}{d\lambda} = \kappa c^2,' (tex line 705) with 'where $\kappa=0$ for lightlike and $\kappa=\mp 1$, $(\sign(\mathbf{g})=\pm 2)$, for timelike geodesics.' (tex line 707), i.e. kappa = -1 in our (-,+,+,+) signature (sign g = +2), matching the derived norm -delta_1 = -1 with c = 1. The quote is in notes because anchor_tex must come from this entry's source (DA09). The affine parameter is fixed only up to lambda -> lambda + C (and orientation), hence lambda = tau + C. Notation bridge (gr_geodesic-r1 cross-entry): E is \tilde E (bare E is photon energy); L_z is \tilde L, L_geom = L_CGS/c; lambda is DA09's affine parameter (\lambda_{aff}, lambda_geom = c tau + const), not wavelength \lambda; theta is \theta_{Sch}, not the RT ray angle; M is geometric G M_phys/c^2.'''

[[entry]]
id = "gr.timelike-radial-equation-schwarzschild"
kind = "equation"
domain = "gr"
name = "Radial equation of a timelike Schwarzschild geodesic"
statement = "For a timelike geodesic in Schwarzschild (a = 0, delta_1 = 1, equatorial, Q = 0), Dexter & Agol's radial function (eq. 6) reduces to R(r) = r^4 E^2 - (r^2 - 2Mr)(L^2 + r^2). With dr/dtau = ±sqrt(R)/r^2 (eq. 10 at a = 0, lambda = tau) this is (dr/dtau)^2 = E^2 - (1 - 2M/r)(1 + L^2/r^2). Units are geometric (G = c = 1), with E and L per unit rest mass (gr.timelike-constants-schwarzschild). In CGS: (dr/dtau)^2 = c^2 E^2 - (1 - r_g/r)(c^2 + L^2/r^2), with tau in s, E dimensionless and L in cm^2 s^-1. Motion is allowed only where R(r) >= 0. The sign of dr/dtau reverses at an accessible simple turning root; multiple roots need separate treatment. A root alone does not establish a sign reversal."
latex = 'R(r) = r^4E^2-(r^2-2Mr)(L_z^2+r^2),\qquad \left(\frac{dr}{d\tau}\right)^2 = \frac{R(r)}{r^4} = E^2-\left(1-\frac{2M}{r}\right)\left(1+\frac{L_z^2}{r^2}\right)'
source = "dexter_agol_2009_kerr"
locator = "Sect. 2, eq. 6 (with eq. 10) at a = 0, delta_1 = 1, Q = 0, p. 2"
anchor = '&\Delta&[\mathcal{Q}+(L_z-aE)^2+\delta_1 r^2]\\'
anchor_tex = '\lambda = \int^r \frac{r^2}{\sqrt{R}}\hspace{2pt} dr + a^2 \int^\theta \frac{\cos^2{\theta}}{\sqrt{\Theta}}\hspace{2pt} d\theta.'
ocr = "good"
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "fix", note = "applied: statement now says the sign of dr/dtau reverses at an accessible simple turning root, multiple roots need separate treatment, a root alone does not establish a sign reversal; notes restrict the Sect. 3 rule to accessible simple roots." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "accept", note = "TeX anchors match eqs. 6 and 10. Reduction, signs, powers and CGS factors follow from [DA09:122–156](/home/tobias/Projects/neutronstars/refs/dexter_agol_2009_kerr.txt:122). Sign reversal is now correctly restricted to accessible simple roots." }]
validity = "timelike geodesics, Schwarzschild exterior r > 2M; equatorial orbit plane; E, L per unit rest mass"
depends_on = ["gr.timelike-constants-schwarzschild", "gr.schwarzschild-line-element"]
provenance = "derivable"
ownership = "stub"
notes = '''Derivation. eq. 6 as printed: R = [(r^2 + a^2)E - aL_z]^2 - Delta[Q + (L_z - aE)^2 + delta_1 r^2]. Set a = 0, Q = 0, delta_1 = 1 and Delta = r^2 - 2r: R = r^4 E^2 - (r^2 - 2r)(L_z^2 + r^2). sympy factor gives r (E^2 r^3 - L^2 r + 2 L^2 - r^3 + 2 r^2), and R/r^4 - [E^2 - (1 - 2/r)(1 + L^2/r^2)] simplifies to 0. eq. 10 at a = 0: lambda = int r^2 dr/sqrt(R), so dr/dlambda = ±sqrt(R)/r^2. Restore 2 -> 2M, then 2M -> r_g, lambda -> c tau, L -> L/c, and multiply by c^2 for the CGS form. A numerical check with G = 6.67430e-8, c = 2.99792458e10 and test values M = 2.8e33 g, r = 1e7 cm, L = 3e17 cm^2 s^-1, E = 1.05 gives c^2 x (geometric form) - (CGS form) with relative difference -3.2e-31, i.e. rounding. Sign convention: the paper writes 'The signs of the integrals in $r$ and $\theta$ are independent and arbitrary, but are fixed for a given geodesic.' and in Sect. 3, for turning points, 'Upon encountering a turning point, the sign of $u$ is reversed, so that the total integral is the sum of the integral from $u_0$ to the turning point and that from $u_f$ to the turning point.' This entry follows the Sect. 3 rule only at an accessible simple root of R (dR/dr != 0 there); at a multiple root dr/dtau need not change sign (gr.timelike-periastron-cubic). Self-consistency check (not independent): integrating d^2r/dtau^2 = -(1/2) dV/dr, V = (1 - 2M/r)(1 + L^2/r^2), with scipy solve_ivp (rtol = atol = 1e-12) from r = 1e4 M inbound, for E = 1.05 and L = 19.2637937592781 M (r_peri = 50 M), keeps |(dr/dtau)^2 - [E^2 - V]| <= 3.5e-13 along the path. The minimum radius is 50.0000002 M (expected 50 M; relative error 3.9e-9, set by the output sampling). The paper's R is renamed \mathcal{R} in the proposed dictionary rows because bare R is the stellar radius. Notation bridge (gr_geodesic-r1 cross-entry): the paper's R(r) is \mathcal{R}(r), not the stellar radius R; E is \tilde E, not photon energy; L_z is \tilde L with L_geom = L_CGS/c; lambda_geom = c tau.'''

[[entry]]
id = "gr.timelike-dt-dtau-schwarzschild"
kind = "equation"
domain = "gr"
name = "dt/dtau on a timelike Schwarzschild geodesic"
statement = "On a timelike Schwarzschild geodesic with specific energy E (per unit rest mass), the coordinate time advances with proper time as dt/dtau = E (1 - 2M/r)^(-1) (geometric units). This follows from Dexter & Agol eq. 8 at a = 0 together with eq. 10. In CGS, with t and tau in s: dt/dtau = E (1 - r_g/r)^(-1)."
latex = '\frac{dt}{d\tau} = \frac{E}{1-2M/r}\qquad (a=0,\ \delta_1=1,\ G=c=1)'
source = "dexter_agol_2009_kerr"
locator = "Sect. 2, eq. 8 with eq. 10 at a = 0, delta_1 = 1, p. 2"
anchor = 'The equations of motion for the cyclic coordinates are'
anchor_tex = 't &=& \lambda E + 2 \int^r r[r^2E-a(L_z - aE)]\frac{dr}{\Delta \sqrt{R}} \\'
ocr = "good"
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "accept", note = "Differentiating eq. 8 and dividing by eq. 10 gives exactly \\(E/(1-2M/r)\\); restoring CGS introduces no extra \\(c\\). Anchors and equation numbers agree with [D&A:138–156](/home/tobias/Projects/neutronstars/refs/dexter_agol_2009_kerr.txt:138)." }]
validity = "timelike geodesics, Schwarzschild exterior r > 2M"
depends_on = ["gr.timelike-constants-schwarzschild", "gr.timelike-radial-equation-schwarzschild"]
provenance = "derivable"
ownership = "stub"
notes = '''Derivation. eq. 8 at a = 0: t = lambda E + 2 int r (r^2 E) dr/(Delta sqrt R). Differentiate along the orbit with dlambda/dr = r^2/sqrt(R) (eq. 10 at a = 0): dt/dr = r^2 E/sqrt(R) + 2 r^3 E/(Delta sqrt R). Multiply by dr/dlambda = sqrt(R)/r^2: dt/dlambda = E + 2 r E/Delta = E (r^2 - 2r + 2r)/(r^2 - 2r) = E/(1 - 2/r). Checked with sympy 1.14 (factor gives E r/(r - 2)). lambda = tau for delta_1 = 1 (gr.timelike-constants-schwarzschild). Restoring units turns 2/r into r_g/r; E is dimensionless and t, tau carry the same unit. Far from the star dt/dtau -> E, the Lorentz factor relative to static observers at infinity (gr.timelike-speed-at-infinity). Notation bridge (gr_geodesic-r1 cross-entry): E here is the specific energy \tilde E (per unit rest mass), not the photon energy E; lambda is the DA09 affine parameter, lambda_geom = c tau (+ const), not wavelength.'''

[[entry]]
id = "gr.timelike-dphi-dtau-schwarzschild"
kind = "equation"
domain = "gr"
name = "dphi/dtau on a timelike Schwarzschild geodesic"
statement = "On a timelike Schwarzschild geodesic in the plane theta = pi/2 with specific angular momentum L (per unit rest mass), the azimuth advances as dphi/dtau = L/r^2 (geometric units). This follows from Dexter & Agol eq. 9 at a = 0, with eqs. 5 and 10. In CGS: dphi/dtau = L/r^2, with L in cm^2 s^-1 and tau in s. The sign of L fixes the sense of rotation and is a free choice of orientation."
latex = '\frac{d\phi}{d\tau} = \frac{L_z}{r^2}\qquad (a=0,\ \theta=\pi/2,\ \delta_1=1)'
source = "dexter_agol_2009_kerr"
locator = "Sect. 2, eq. 9 with eqs. 5 and 10 at a = 0, p. 2"
anchor = '\int^r \frac{dr}{\sqrt{R}} = \int^\theta \frac{d\theta}{\sqrt{\Theta}},'
anchor_tex = '\int^\theta (L_z \csc^2 \theta - aE)\frac{d\theta}{\sqrt{\Theta}},'
ocr = "good"
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "accept", note = "Eqs. 5, 9 and 10 give \\(d\\phi/d\\lambda=L_z\\csc^2\\theta/r^2\\) before taking the equatorial limit, yielding the stated result. Both TeX anchors match [D&A:114–156](/home/tobias/Projects/neutronstars/refs/dexter_agol_2009_kerr.txt:114)." }]
validity = "timelike geodesics, Schwarzschild exterior r > 2M; orbit plane theta = pi/2"
depends_on = ["gr.timelike-constants-schwarzschild"]
provenance = "derivable"
ownership = "stub"
notes = '''Derivation. eq. 9 at a = 0: phi = int L_z csc^2 theta dtheta/sqrt(Theta) (the r-integral is multiplied by a). eq. 5 equates dtheta/sqrt(Theta) with dr/sqrt(R), and eq. 10 at a = 0 gives dr/sqrt(R) = dlambda/r^2. Hence dphi/dlambda = L_z csc^2 theta/r^2, which equals L_z/r^2 at theta = pi/2, with lambda = tau (gr.timelike-constants-schwarzschild). Restoring units: the geometric L_z is r^2 dphi/d(c tau) = L/c, so dphi/dtau = L/r^2 with L in cm^2 s^-1. phi here is the Schwarzschild azimuth in the orbit plane (proposed \phi_{Sch}; for the equatorial orbit it equals \phi_{orb} up to its origin). Notation bridge (gr_geodesic-r1 cross-entry): L_z is \tilde L; geometric L_geom = L_CGS/c; L and L_z are signed synonyms only after choosing the equatorial plane, |L_z| being the total angular-momentum magnitude.'''

[[entry]]
id = "gr.timelike-proper-time-quadrature"
kind = "equation"
domain = "gr"
name = "Proper-time quadrature along a timelike Schwarzschild geodesic"
statement = "Proper time along a timelike Schwarzschild geodesic (a = 0, delta_1 = 1, equatorial) follows from Dexter & Agol eq. 10 at a = 0, lambda = int r^2 dr/sqrt(R), with lambda = tau + C (gr.timelike-constants-schwarzschild). Elapsed proper time is the unsigned integral dtau = |dr|/sqrt(E^2 - (1 - 2M/r)(1 + L^2/r^2)) > 0, whichever way r moves, so it is positive on the inbound leg as well. For an orbit that comes in from r_1, passes its periastron r_p (an accessible simple root of R) and goes out to r_2, the elapsed proper time is the two-leg sum Delta tau = int_{r_p}^{r_1} dr/sqrt(...) + int_{r_p}^{r_2} dr/sqrt(...), each leg integrated with increasing r. The two-leg rule is derived here from eq. 10; DA09 print a turning-point sum only for null geodesics (Sect. 3), not as a timelike result. The integrand has an integrable 1/sqrt(r - r_p) singularity at r_p. The worldline x^mu(tau) then follows from t(tau) = int E (1 - 2M/r)^(-1) dtau and phi(tau) = int (L/r^2) dtau. In CGS: dtau = |dr|/sqrt(c^2 E^2 - (1 - r_g/r)(c^2 + L^2/r^2)), tau in s."
latex = 'd\tau = \frac{r^2\,\lvert dr\rvert}{\sqrt{R(r)}} = \frac{\lvert dr\rvert}{\sqrt{E^2-(1-2M/r)(1+L_z^2/r^2)}};\qquad \Delta\tau_{r_1\to r_p\to r_2} = \left(\int_{r_p}^{r_1}+\int_{r_p}^{r_2}\right)\frac{dr}{\sqrt{E^2-(1-2M/r)(1+L_z^2/r^2)}}'
source = "dexter_agol_2009_kerr"
locator = "Sect. 2, eq. 10 at a = 0, delta_1 = 1 (derivation, p. 2); Sect. 3 turning-point rule for null geodesics (text before eq. 20, p. 3), quoted as the structural analogue only"
anchor = 'Upon encountering a turning point, the sign of $u$ is reversed, so that the total integral is the sum of the integral from $u_0$ to the turning point and that from $u_f$ to the turning point.'
anchor_tex = '\lambda = \int^r \frac{r^2}{\sqrt{R}}\hspace{2pt} dr + a^2 \int^\theta \frac{\cos^2{\theta}}{\sqrt{\Theta}}\hspace{2pt} d\theta.'
ocr = "good"
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "fix", note = "applied: replaced the signed integral by dtau = |dr|/sqrt(E^2 - (1 - 2M/r)(1 + L_z^2/r^2)) (statement, CGS form, latex, validity); the two-leg sum is labelled Delta tau; derivation from eq. 10 made explicit and the quoted turning-point rule flagged as a null-geodesic statement, not a printed timelike result (statement, locator, notes); two-leg numeric check added to notes." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "accept", note = "Eq. 10 supports the derived unsigned quadrature; both legs now contribute positively. The quoted turning-point rule is correctly identified as a null-geodesic analogue, rather than a printed timelike result. See [DA09:153–156](/home/tobias/Projects/neutronstars/refs/dexter_agol_2009_kerr.txt:153), [226–233](/home/tobias/Projects/neutronstars/refs/dexter_agol_2009_kerr.txt:226)." }]
validity = "timelike Schwarzschild geodesics; dtau uses |dr| on every leg; the periastron must be an accessible simple root of R (dR/dr > 0 at r_p); near r_p remove the endpoint singularity analytically, e.g. r = r_p + x^2"
depends_on = ["gr.timelike-radial-equation-schwarzschild", "gr.timelike-dt-dtau-schwarzschild", "gr.timelike-dphi-dtau-schwarzschild", "gr.timelike-periastron-cubic"]
provenance = "derivable"
ownership = "stub"
notes = '''Derivation: eq. 10 at a = 0 is lambda = int r^2 dr/sqrt(R), and r^2/sqrt(R) = 1/sqrt(R/r^4) = 1/sqrt(E^2 - (1 - 2/r)(1 + L^2/r^2)) (gr.timelike-radial-equation-schwarzschild). lambda = tau for delta_1 = 1. Each leg: on the inbound leg dr < 0 and dtau = -r^2 dr/sqrt(R) = |dr| r^2/sqrt(R) > 0, so the signed form int_{r_0}^{r} dr/sqrt(...) would give a negative elapsed time; the unsigned |dr| form fixes this. The anchor quotes the paper's Sect. 3 piecewise rule, which is stated there for null geodesics in u = 1/r and is not a printed timelike result. The paper calls timelike geodesics 'only straightforward generalizations of the formulas given here' but does not write them out, so applying the rule to the timelike radial integral is the harvester's step. Verification (mpmath 30 digits, M = 1, E = 1.05, r_peri = 50 M, L = 19.2637937592781 M). The cubic of gr.timelike-periastron-cubic has roots -71.5365732354 M, 2.02437811347 M and 50 M, so R(r) = (E^2 - 1) r (r - r_1)(r - r_2)(r - r_peri). The substitution r = r_peri + x^2 makes the integrand regular. Proper time from r_0 = 1e4 M down to r_peri: the quadrature gives 31091.2873102063 M. A scipy solve_ivp integration of d^2r/dtau^2 = -(1/2) dV/dr (rtol = atol = 1e-12), with the time of minimum r located by Brent minimisation of the dense output, gives 31091.2873102884 M. Relative difference 2.6e-12, tolerance 1e-9. In CGS, divide the geometric proper time (a length) by c. r1 two-leg check (E = 1.1, M = 1, r_p = 10, L^2 = 205/4; regularised integrand 2/sqrt(F(r)/(r - r_p)) with r = r_p + x^2, F/(r - r_p) = (E^2 - 1)(r - r_a)(r - r_b)/r^3, r_a = -21.7662501580529, r_b = 2.24244063424336; mpmath 30 digits): Delta tau(100 M -> r_p -> 200 M) = 202.162417604925 + 414.722470675612 = 616.884888280537 M. Expected (independent scipy solve_ivp of d^2r/dtau^2 = F'(r)/2 from r = 100 M inbound, rtol = atol = 1e-12, event r = 200 M outbound): 616.884888279706 M. Relative error -1.35e-12, tolerance 1e-9. Both legs positive. Notation bridge (gr_geodesic-r1 cross-entry): lambda is DA09's affine parameter, lambda_geom = c tau + const, not wavelength; R(r) is \mathcal{R}(r), not stellar radius; E, L_z are \tilde E, \tilde L.'''

[[entry]]
id = "gr.timelike-periastron-cubic"
kind = "equation"
domain = "gr"
name = "Periastron condition R(r_p) = 0 as a cubic"
statement = "A radial turning point r_p of a timelike Schwarzschild geodesic (a = 0, delta_1 = 1, Q = 0) is a root of R(r_p) = 0, i.e. dr/dtau = 0. Dividing by r_p > 0 gives the cubic (E^2 - 1) r_p^3 + 2M r_p^2 - L^2 r_p + 2M L^2 = 0 (G = c = 1). In CGS: (E^2 - 1) r_p^3 + r_g r_p^2 - (L^2/c^2) r_p + r_g L^2/c^2 = 0. For an incoming orbit from infinity with E >= 1, the periastron is the largest real root; the rule is not claimed for E < 1. It is a true minimum of r only if it is a simple root with dR/dr(r_p) > 0, since d^2r/dtau^2 = (1/2) d(R/r^4)/dr. A double root can support a circular orbit or asymptotic approach to it; it is not a finite-time simple turning point."
latex = '(E^2-1)\,r_p^3 + 2M\,r_p^2 - L_z^2\,r_p + 2M\,L_z^2 = 0'
source = "dexter_agol_2009_kerr"
locator = "Sect. 2, eq. 6 at a = 0, delta_1 = 1, Q = 0, p. 2"
anchor = '&\Delta&[\mathcal{Q}+(L_z-aE)^2+\delta_1 r^2]\\'
anchor_tex = '$\delta_1 = 0\hspace{2pt}(1)$ for null (timelike) geodesics.'
ocr = "good"
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "fix", note = "applied: largest-root rule restricted to an incoming orbit from infinity with E >= 1 (statement, validity); double-root sentence replaced verbatim by the reviewer's wording; E = 1.1, r_p = 10 check (L^2 = 205/4, residual 0, dR/dr = 517.5) added to notes." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "accept", note = "The polynomial follows exactly from [DA09 eq. 6:122–137](/home/tobias/Projects/neutronstars/refs/dexter_agol_2009_kerr.txt:122). Largest-root selection now has the incoming-from-infinity restriction; double roots are correctly distinguished from finite-time turns. Python gives \\(L^2=51.25\\), cubic residual \\(0\\), and \\(R'(10)=517.5\\)." }]
validity = "timelike Schwarzschild geodesics; r_p > 2M; for an incoming orbit from infinity with E >= 1, periastron = largest real root, simple, with dR/dr(r_p) > 0"
depends_on = ["gr.timelike-radial-equation-schwarzschild"]
provenance = "derivable"
ownership = "stub"
notes = '''Derivation: R(r) = r^4 E^2 - (r^2 - 2Mr)(L^2 + r^2) (gr.timelike-radial-equation-schwarzschild). Expand: R/r = E^2 r^3 - (r - 2M)(L^2 + r^2) = (E^2 - 1) r^3 + 2M r^2 - L^2 r + 2M L^2 (sympy 1.14 collect, identical). Minimum test: differentiate (dr/dtau)^2 = F(r) = R/r^4 along the orbit, 2 (dr/dtau)(d^2r/dtau^2) = F'(r) dr/dtau, so d^2r/dtau^2 = F'/2, and at a root of R, F' = R'/r^4. The CGS form follows from 2M -> r_g and L -> L/c. Numbers (M = 1, E = 1.05): r_p = 50 gives roots {-71.536573, 2.0243781, 50.0}, dR/dr(r_p) = 29882.8 > 0, so this is a valid periastron. r_p = 4 gives {-26.995999, 3.4838044, 4.0}, dR/dr = 6.56 > 0, valid. r_p = 3.5 gives {-26.990946, 3.5, 3.9787507}, dR/dr(3.5) = -5.24 < 0: a geodesic arriving from infinity with this L turns at 3.9787507 M, not at 3.5 M. Feeding an r_p into gr.timelike-angular-momentum-from-periastron without this check fails silently. r1 check (sympy 1.14, exact rationals): E = 11/10, M = 1, r_p = 10 gives L^2 = r_p^2 [(E^2 - 1) r_p + 2M]/(r_p - 2M) = 205/4; expected 205/4 = 51.25 (truth/reviews/gr_geodesic-r1.md), error 0, tolerance 0. Cubic residual at r_p = 10: 0 exactly (expected 0, tolerance 0). dR/dr(10) = 1035/2 = 517.5 (review: 517.5), error 0, > 0. Roots of R/r: -21.7662501580529, 2.24244063424336, 10, so r_p = 10 is the largest real root and simple. At E = 1 the leading coefficient vanishes and the cubic becomes the quadratic 2M r^2 - L^2 r + 2M L^2 = 0; the largest-root rule is applied to its larger root.'''

[[entry]]
id = "gr.timelike-angular-momentum-from-periastron"
kind = "equation"
domain = "gr"
name = "Specific angular momentum from periastron and energy"
statement = "Given a chosen periastron r_p and specific energy E of a timelike Schwarzschild geodesic, R(r_p) = 0 fixes the specific angular momentum: L^2 = r_p^2 [E^2/(1 - 2M/r_p) - 1] = r_p^2 [(E^2 - 1) r_p + 2M]/(r_p - 2M) (G = c = 1). In CGS: L^2 = c^2 r_p^2 [E^2/(1 - r_g/r_p) - 1], with L in cm^2 s^-1. L is real for E >= 1 and r_p > 2M. The result is a valid periastron only if r_p is then the largest root of R and dR/dr(r_p) > 0 (gr.timelike-periastron-cubic); otherwise the orbit turns at a larger radius."
latex = 'L_z^2 = r_p^2\left[\frac{E^2}{1-2M/r_p}-1\right] = \frac{r_p^2\left[(E^2-1)\,r_p+2M\right]}{r_p-2M}'
source = "dexter_agol_2009_kerr"
locator = "Sect. 2, eq. 6 at a = 0, delta_1 = 1, Q = 0 (solved for L_z), p. 2"
anchor = '&\Delta&[\mathcal{Q}+(L_z-aE)^2+\delta_1 r^2]\\'
anchor_tex = '\lambda = \int^r \frac{r^2}{\sqrt{R}}\hspace{2pt} dr + a^2 \int^\theta \frac{\cos^2{\theta}}{\sqrt{\Theta}}\hspace{2pt} d\theta.'
ocr = "good"
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "accept", note = "Both expressions are algebraically equivalent solutions of [D&A eq. 6:122–137](/home/tobias/Projects/neutronstars/refs/dexter_agol_2009_kerr.txt:122). The stated reality condition, outer-root check and CGS \\(c^2\\) factor are correct." }]
validity = "r_p > 2M, E >= 1; the resulting (E, L) must make r_p the largest simple root of R with dR/dr(r_p) > 0"
depends_on = ["gr.timelike-periastron-cubic", "gr.timelike-radial-equation-schwarzschild"]
provenance = "derivable"
ownership = "stub"
notes = '''Derivation: (dr/dtau)^2 = 0 at r_p in gr.timelike-radial-equation-schwarzschild gives E^2 = (1 - 2M/r_p)(1 + L^2/r_p^2), so L^2 = r_p^2 [E^2/(1 - 2M/r_p) - 1]. Equivalently, solve the cubic of gr.timelike-periastron-cubic, linear in L^2: L^2 (r_p - 2M) = (E^2 - 1) r_p^3 + 2M r_p^2. sympy 1.14 solve gives -r_p^2 (E^2 r_p + 2M - r_p)/(2M - r_p), and its difference from the first form simplifies to 0. Numbers (M = 1, E = 1.05): r_p = 50 gives L = 19.2637937592781, and an independent orbit integration started at r = 1e4 M reaches r_min = 50.0000002 M. r_p = 10 gives L = 6.149186938; r_p = 5 gives L = 4.575751304; r_p = 3.5 gives L = 4.388977671, which FAILS the periastron check (see gr.timelike-periastron-cubic). Orientation: the sign of L (prograde/retrograde in phi) and the orbit plane are free choices. The PRD default periastron, 'Periastron distance is a parameter, default about 100 km', needs M in grams. That needs a solar-mass datum (GAPS row 1.1) and is not evaluated here. Notation bridge (gr_geodesic-r1 cross-entry): E, L_z are \tilde E (not photon energy) and \tilde L (L_geom = L_CGS/c); R is DA09's \mathcal{R}(r), not the stellar radius R; M is geometric G M_phys/c^2.'''

[[entry]]
id = "gr.timelike-unbound-condition"
kind = "result"
domain = "gr"
name = "Unbound (hyperbolic) timelike orbit: E > 1"
statement = "Restrict to future-directed exterior geodesics, E > 0 (dt/dtau = E/(1 - 2M/r) > 0 for r > 2M). From (dr/dtau)^2 = E^2 - (1 - 2M/r)(1 + L^2/r^2), the right side tends to E^2 - 1 as r -> infinity. Such a geodesic reaches arbitrarily large r only if E >= 1. E > 1 (hyperbolic) gives a non-zero asymptotic radial rate, (dr/dtau)^2 -> E^2 - 1 > 0. E = 1 is the marginal (parabolic) case, with dr/dtau -> 0. For 0 < E < 1 the right side is negative at large r, so r is bounded. Without E > 0 the label E < 1 would include E < -1, for which (dr/dtau)^2 -> E^2 - 1 > 0 and the bound claim is false. E > 1 is necessary for the PRD camera's hyperbolic geodesic. It is not sufficient: the orbit must also turn at a periastron r_p > 2M rather than be captured (gr.timelike-periastron-cubic). The condition is the same in CGS (E dimensionless)."
latex = '\lim_{r\to\infty}\left(\frac{dr}{d\tau}\right)^2 = E^2-1;\qquad E>1\ \text{(hyperbolic)},\quad E=1\ \text{(parabolic)},\quad 0<E<1\ \text{(bound in } r\text{)}\qquad (E>0,\ \text{future-directed, } r>2M)'
source = "dexter_agol_2009_kerr"
locator = "Sect. 2, eq. 6 at a = 0, delta_1 = 1, r -> infinity, p. 2"
anchor = '&\Delta&[\mathcal{Q}+(L_z-aE)^2+\delta_1 r^2]\\'
anchor_tex = '$\delta_1 = 0\hspace{2pt}(1)$ for null (timelike) geodesics.'
ocr = "good"
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "fix", note = "applied: added the condition 'future-directed exterior geodesics, E > 0' (statement, latex, validity); bound label replaced by 0 < E < 1; E < -1 counterexample recorded in statement and notes." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "accept", note = "The future-directed restriction \\(E>0\\) and corrected bound interval \\(0<E<1\\) are present. The asymptotic limit follows from [DA09:122–143](/home/tobias/Projects/neutronstars/refs/dexter_agol_2009_kerr.txt:122); the statement correctly retains the additional periastron requirement for scattering." }]
validity = "future-directed (E > 0) timelike Schwarzschild exterior geodesics, r > 2M; asymptotic statement (r -> infinity)"
depends_on = ["gr.timelike-radial-equation-schwarzschild"]
provenance = "derivable"
ownership = "stub"
notes = '''Derivation: (1 - 2M/r)(1 + L^2/r^2) -> 1 as r -> infinity, so (dr/dtau)^2 -> E^2 - 1, and a real dr/dtau at large r needs E^2 >= 1 (E > 0 for a future-directed worldline, since dt/dtau = E/(1 - 2M/r) > 0 outside 2M). The PRD wording is 'on a hyperbolic timelike geodesic of the Schwarzschild spacetime of' (PRD.md, The shot). The source of this entry is Dexter & Agol eq. 6, which the PRD does not cite. Check: for E = 1.05 the orbit integrated in gr.timelike-radial-equation-schwarzschild comes in from 1e4 M and goes back out, with (dr/dtau)^2 -> E^2 - 1 = 0.1025. r1 numbers (lim (dr/dtau)^2 = E^2 - 1): E = 1.1 gives 0.21 > 0 (unbound); E = 0.9 gives -0.19 < 0 (bound); E = -1.5 gives +1.25 > 0, the counterexample showing that E < 1 without E > 0 does not imply boundedness.'''

[[entry]]
id = "gr.timelike-speed-at-infinity"
kind = "equation"
domain = "gr"
name = "Asymptotic speed of a hyperbolic orbit, v^infinity = sqrt(1 - 1/E^2)"
statement = "For a hyperbolic timelike Schwarzschild geodesic (E > 1), the speed relative to static observers far from the star tends to v^infinity = sqrt(1 - 1/E^2) (c = 1); in CGS v^infinity = c sqrt(1 - E^(-2)). Equivalently, far from the star E = dt/dtau is the Lorentz factor (1 - v^2/c^2)^(-1/2). The asymptotic motion is radial: the transverse part r dphi/dt = (1 - 2M/r) L/(E r) -> 0 (from dphi/dtau = L/r^2 and dt/dtau = E/(1 - 2M/r))."
latex = 'v^\infty = \sqrt{1-\frac{1}{E^2}}\quad (c=1),\qquad E = \lim_{r\to\infty}\frac{dt}{d\tau} = \left[1-(v^{\infty})^2\right]^{-1/2}'
source = "dexter_agol_2009_kerr"
locator = "Sect. 2, eqs. 1-3 and 8 at a = 0, r -> infinity, p. 2"
anchor = 'The equations of motion for the cyclic coordinates are'
anchor_tex = 't &=& \lambda E + 2 \int^r r[r^2E-a(L_z - aE)]\frac{dr}{\Delta \sqrt{R}} \\'
ocr = "good"
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "fix", note = "applied: transverse speed corrected to r dphi/dt = (1 - 2M/r) L_z/(E r) -> 0 in statement and notes; sympy identity and numbers added to notes." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "accept", note = "The corrected transverse expression \\(r\\,d\\phi/dt=(1-2M/r)L_z/(Er)\\) follows from [DA09:142–156](/home/tobias/Projects/neutronstars/refs/dexter_agol_2009_kerr.txt:142). The stated asymptotic speed follows from that limit and the normalized metric; the missing factor is repaired throughout." }]
validity = "E > 1; asymptotic (r -> infinity) speed relative to the static frame at infinity"
depends_on = ["gr.timelike-dt-dtau-schwarzschild", "gr.timelike-unbound-condition", "gr.schwarzschild-line-element", "gr.timelike-constants-schwarzschild"]
provenance = "derivable"
ownership = "stub"
notes = '''Derivation, a few lines. (1) As r -> infinity the a = 0 line element tends to the flat form -dt^2 + dr^2 + r^2 dtheta^2 + r^2 sin^2 theta dphi^2 (gr.schwarzschild-line-element). (2) Proper time dtau^2 = -ds^2 gives dtau^2 = dt^2 (1 - v^2) with v^2 = (dr^2 + r^2 dphi^2)/dt^2, the speed measured in the asymptotically flat coordinates, i.e. relative to static observers at infinity. (3) dt/dtau -> E (gr.timelike-dt-dtau-schwarzschild). Hence E = (1 - v^2)^(-1/2) and v^2 = 1 - 1/E^2. Consistency: (dr/dtau)^2 -> E^2 - 1 (gr.timelike-unbound-condition), so (dr/dt)^2 -> (E^2 - 1)/E^2 = 1 - 1/E^2, and the radial part carries the whole asymptotic speed, consistent with r dphi/dt = r (dphi/dtau)/(dt/dtau) = (1 - 2M/r) L/(E r) -> 0. NOT PRINTED: the proper-time definition dtau^2 = -ds^2, the same caveat as gr.timelike-constants-schwarzschild. Numbers (M = 1, E = 1.05, L = 19.2637937592781): v^infinity = 0.304910677972993. The coordinate radial speed (dr/dtau)/(dt/dtau) at r = 1e4, 1e6, 1e8, 1e10 M is 0.305141453234713, 0.304913042317553, 0.304910701622105, 0.304910678209484. The differences 2.3e-4, 2.4e-6, 2.4e-8, 2.4e-10 fall off as 1/r, as expected from the 2M/r terms. The superscript-infinity spelling v^\infty follows the project observer-frame convention. r1 fix check: sympy 1.14 simplifies r (L/r^2)/(E/(1 - 2M/r)) - (1 - 2M/r) L/(E r) to 0 (expected 0, tolerance 0). Numbers (M = 1, E = 1.05, L = 19.2637937592781): r dphi/dt = 0.179795408419929 at r = 100 M (the old L/(E r) gave 0.183464702469315, a 2.0e-2 relative error = 2M/r), 1.83428009528821e-3 at 1e4 M, 1.8346433553991e-5 at 1e6 M.'''

[[entry]]
id = "gr.bending-integral-finite-radius"
kind = "equation"
domain = "gr"
name = "Bending integral from a finite camera radius r_cam"
statement = "Finite swept polar angle psi_cam of a photon with impact parameter b between the stellar surface r = R and a camera at a finite Schwarzschild radius r_cam > R. psi_cam is distinct from the existing infinity-referenced psi of gr.bending-integral (Bel02 eq. 9, psi = 0 at infinity), to which it tends as r_cam -> infinity. It is Beloborodov eq. 9 with the upper limit infinity replaced by r_cam, equivalently Pechenick eq. 2.12 with its lower limit u = 0 replaced by u = M/r_cam: psi_cam = int_R^{r_cam} K_b(r) dr with K_b(r) = b/[r^2 sqrt(1 - b^2 (1 - r_g/r)/r^2)], which equals the printed (1/r^2)[1/b^2 - (1/r^2)(1 - r_g/r)]^(-1/2) for b > 0 and includes the radial ray b = 0 (K_b = 0, psi_cam = 0) without division by zero. In u = M/r (geometric M): psi_cam = int_{M/r_cam}^{M/R} (b/M)[1 - (b/M)^2 (1 - 2u)u^2]^(-1/2) du, equal to Pechenick's [u_b^2 - (1 - 2u)u^2]^(-1/2), u_b = M/b, for b > 0. This holds when the ray has no radial turning point in (R, r_cam], i.e. it arrives at the camera outgoing with 0 <= b <= b_max = R (1 - r_g/R)^(-1/2) (for R > 3GM/c^2). The grazing hit b = b_max is included: its turning point is at r = R itself, where K_b has an integrable 1/sqrt(r - R) endpoint singularity. A ray that arrives outgoing with b > b_max came from the sky through a periastron r_tp < r_cam, the largest root of r^3 - b^2 r + b^2 r_g = 0, and psi_cam = int_{r_tp}^{r_cam} K_b dr + int_{r_tp}^{infinity} K_b dr. A ray that arrives ingoing came from the sky with psi_cam = int_{r_cam}^{infinity} K_b dr. psi_cam may exceed pi (multiple images). For r_cam -> infinity the hit case reduces to Beloborodov eq. 9 and Pechenick eq. 2.12. b is a constant of the geodesic, so these integrals are the same for any camera velocity; only the map from pixel to (b, arrival branch) depends on the camera frame."
latex = 'K_b(r) = \frac{b}{r^2\sqrt{1-b^2(1-r_g/r)/r^2}};\qquad \psi_{cam} = \int_R^{r_{cam}}K_b(r)\,dr = \int_{M/r_{cam}}^{M/R}\frac{b}{M}\left[1-\frac{b^2}{M^2}(1-2u)u^2\right]^{-1/2}du\ \ (0\le b\le b_{\max});\qquad \psi_{cam} = \left(\int_{r_{tp}}^{r_{cam}}+\int_{r_{tp}}^{\infty}\right)K_b(r)\,dr\ \ (b>b_{\max}),\ \ r_{tp}^3-b^2r_{tp}+b^2r_g=0'
source = "beloborodov_2002_ray_tracing"
locator = "Appendix, eq. 9 (upper limit replaced by r_cam), p. 4; cross-check Pechenick 1983 eqs. 2.11-2.12, p. 847"
anchor = "escape direction. Then at radius R the photon has"
anchor_tex = '\psi=\int_R^\infty\frac{-u^\psi}{u^r}\;\dd r'
ocr = "good"
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "fix", note = "applied: grazing hit included, 0 <= b <= b_max (statement, latex, validity, notes); integrand rewritten as K_b(r) = b/[r^2 sqrt(1 - b^2(1 - r_g/r)/r^2)] so b = 0 needs no division by zero (u-form likewise); the finite swept angle renamed psi_cam and distinguished from the infinity-referenced psi; numeric checks added to notes." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "accept", note = "Anchors match Beloborodov eq. 9. Finite limits and the rewritten kernel follow from [Beloborodov:228–252](/home/tobias/Projects/neutronstars/refs/beloborodov_2002_ray_tracing.txt:228). The radial and grazing cases are correctly included; the latter has an integrable endpoint, consistent with [Pechenick:101–131](/home/tobias/Projects/neutronstars/refs/pechenick_1983_gr_ray_tracing.txt:101). The finite angle is explicitly distinguished." }]
validity = "Schwarzschild exterior, transparent (gr.approx-opaque-surface); R > 3GM/c^2 for the 0 <= b <= b_max hit criterion, grazing b = b_max included (gr.photon-sphere); camera at r_cam > R; the arrival branch (outgoing or ingoing at the camera) must be supplied by the camera frame"
depends_on = ["gr.bending-integral", "gr.bending-integral-pechenick", "gr.orbit-equation-u", "gr.null-geodesic-radial", "gr.null-geodesic-constants", "gr.photon-sphere", "gr.impact-parameter-max"]
provenance = "derivable"
ownership = "stub"
notes = '''Derivation. Beloborodov eq. 9 is psi = int (-u^psi/u^r) dr between the emission point and the far end of the ray. Here u^psi = b/r^2 follows from u_psi = b, and u^r from gr.null-geodesic-radial. Moving the far end from r = infinity to r = r_cam changes only the limit. In u = M/r, Pech83 eq. 2.11 (gr.orbit-equation-u) gives dpsi/du = ±[u_b^2 - (1 - 2u)u^2]^(-1/2), and integrating from M/r_cam to M/R gives the second form. In u the camera radius is the LOWER limit. Turning points: u^r = 0 where 1/b^2 = (1 - r_g/r)/r^2; multiplying by b^2 r^3 gives r^3 - b^2 r + b^2 r_g = 0. psi grows monotonically along the ray (dphi/dlambda = b r^(-2) > 0, Pech83 eq. 2.2), so through a turning point the swept angle is the sum of the two monotonic pieces. This is the structure of Dexter & Agol eq. 20 ('Upon encountering a turning point...'), where for null geodesics 'There can be no more than one turning point'. Hit criterion: for R > 3M, B^-2(r) decreases for r > 3M (gr.photon-sphere), so there is no turning point in (R, r_cam] iff 0 <= b <= b_max (gr.impact-parameter-max); at b = b_max the turning point sits at r = R (grazing emission, alpha = 90 deg) and the hit is kept. Verification (mpmath 30 digits, M = 1). (a) Pech83 2.12 at R/2M = 1.6, b -> b_max: 227.18012 deg (source text: 227 deg; blessed note: 227.18). (b) R = 3.2 M, alpha = 60 deg, b = R sin(alpha)(1 - 2M/R)^(-1/2): psi = 81.530631910272 deg (r_cam = 10 M), 105.6812671819 (100 M), 108.24912162254 (1e4 M), 108.27504814041 (1e8 M). The r- and u-forms agree to all printed digits. The r_cam -> infinity value from Pech83 2.12 is 108.27505073333 deg; the residual at 1e8 M, 2.593e-6 deg, equals the flat tail b/r_cam = 4.525e-8 rad. (c) Independent ODE: Pech83 eq. 2.2 integrated in lambda (scipy, rtol 1e-12) from r_cam = 30 M inward to R = 3.2 M gives Delta phi = 99.6005702723 deg against the quadrature 99.6005702723 deg, difference 7.9e-11 deg. (d) Turning-point case b = 8 M, r_cam = 30 M: r_tp = 6.70052348227 M, quadrature psi = 213.745318637 deg. The second-order ODE d^2r/dlambda^2 = b^2 (r - 3M)/r^4 run to r = 1e7 M, plus the flat tail b/r, gives 213.74531864 deg. Finite-radius camera sky angle for a STATIC camera: gr.observer-sky-angle (Pech83 eq. 2.5). A moving camera needs the boost of GAPS row 1.4, which is not in this lane. r1 fix checks (mpmath 40 digits, M = 1, R = 3.2 M). K_b form vs printed form at alpha = 60 deg, r_cam = 10 M: both 81.5306319102723 deg; expected 81.530631910272 deg (value above), error 3.4e-13 deg, tolerance 1e-10. b = 0: int K_b dr = 0 exactly (expected 0, tolerance 0). Grazing b = b_max, regularised by r = R + x^2: r_cam -> infinity gives 227.180120805548 deg, expected 227.18012 deg (value above; Pech83 text 227 deg), error 8.1e-7 deg, tolerance 1e-5 (printed precision); r_cam = 10 M gives a finite 195.947071927145 deg. Notation bridge (gr_geodesic-r1 cross-entry): psi_cam (finite, camera-referenced) is not the dictionary \psi (infinity-referenced); R is the stellar radius, M is geometric G M_phys/c^2, lambda in the ODE check is the affine parameter \lambda_{aff}, not wavelength; mu does not appear here (Bel02 mu = cos psi is \cos\psi).'''

[[entry]]
id = "gr.observed-flux-element-abs-jacobian"
kind = "equation"
domain = "gr"
name = "Observed flux from a surface element, absolute Jacobian, every image"
statement = "This is the bolometric flux that a distant static observer (D >> R) receives from the surface element dS = R^2 dmu dphi (mu = cos psi) of a static Schwarzschild star with surface intensity I_0(alpha), for one image of that element: dF = I dOmega = (I b/R^2)|db/dmu| dS/D^2 = (1 - r_g/R) I_0(alpha) cos alpha |d cos alpha/d mu| dS/D^2, with I = (1 - r_g/R)^2 I_0 and sin alpha = (b/R) sqrt(1 - r_g/R). Here psi is the total swept angle of that image's ray and may exceed pi. Each image contributes separately, and the element's observed flux is the sum over its images. On the primary branch (psi < pi, psi increasing with alpha), d cos alpha/d mu > 0 and the absolute value may be dropped, which gives Beloborodov's printed second equality of eq. 11. On intervals (2n+1)pi < psi < (2n+2)pi (n = 0, 1, ...), d cos alpha/d mu < 0, and the printed signed form gives a negative flux; on 2n pi < psi < (2n+1)pi it is positive. The sign alternates with sin psi, since d cos alpha/d mu = sin alpha/(sin psi dpsi/dalpha) with sin alpha > 0 and dpsi/dalpha > 0. The caustic limits psi -> n pi (n >= 1, sin psi -> 0), where |d cos alpha/d mu| diverges, are not covered by this entry and must be specified separately."
latex = 'dF = \frac{Ib}{R^2}\left|\frac{db}{d\mu}\right|\frac{dS}{D^2} = \left(1-\frac{r_g}{R}\right)I_0(\alpha)\cos\alpha\left|\frac{d\cos\alpha}{d\mu}\right|\frac{dS}{D^2},\qquad \mu=\cos\psi,\qquad F_{dS} = \sum_{\rm images} dF'
source = "beloborodov_2002_ray_tracing"
locator = "Appendix, eq. 11 (first equality, with |db/dmu| as printed) and eq. 10, p. 4"
anchor = "dS = R2 dµ dφ is observed at impact parame"
anchor_tex = '\dd F=\frac{Ib}{R^2}|\frac{\dd b}{\dd\mu}|\frac{\dd S}{D^2}'
ocr = "good"
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "fix", note = "applied: 'on branches with psi > pi' replaced by 'on intervals (2n+1)pi < psi < (2n+2)pi'; the sign stated to alternate with sin psi; caustic limits psi -> n pi excluded and flagged for separate specification (statement, validity); reviewer's psi, d cos alpha/d mu and flux reproduced in notes." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "accept", note = "Anchors match eq. 11. Its first equality supports the absolute Jacobian; differentiating eq. 10 gives the stated alternating sign. Caustics are explicitly excluded. See [Beloborodov:248–276](/home/tobias/Projects/neutronstars/refs/beloborodov_2002_ray_tracing.txt:248). Image summation is explicit at [Pechenick:76–78](/home/tobias/Projects/neutronstars/refs/pechenick_1983_gr_ray_tracing.txt:76)." }]
validity = "bolometric (frequency-integrated) intensities; static emitting surface; static observer at distance D >> R (far-field verification, not the finite moving camera); any image branch, summed over images; emergent rays, cos alpha >= 0; caustics psi = n pi (n >= 1) excluded and to be specified separately"
depends_on = ["gr.image-plane-solid-angle", "gr.intensity-transformation", "gr.emission-angle-impact-parameter", "gr.bending-integral"]
provenance = "derivable"
ownership = "stub"
notes = '''Derivation. eq. 10 gives b^2 = R^2 sin^2 alpha/(1 - r_g/R). Then b db = R^2 sin alpha cos alpha dalpha/(1 - r_g/R) = -R^2 cos alpha d(cos alpha)/(1 - r_g/R). So (b/R^2)|db/dmu| = |b db/dmu|/R^2 = cos alpha |d cos alpha/dmu|/(1 - r_g/R) for cos alpha >= 0. Multiplying by I = (1 - r_g/R)^2 I_0 (gr.intensity-transformation) gives the result. The first printed equality already carries the absolute value: '\dd F=\frac{Ib}{R^2}|\frac{\dd b}{\dd\mu}|\frac{\dd S}{D^2}'. The printed second equality '=\left(1-\frac{r_g}{R}\right)I_0(\alpha)\cos\alpha' ... '\frac{\dd\cos\alpha}{\dd\mu}' drops it. Bel02 also states 'rotation around ${\bf D}$; $b$ depends on $\mu$ only, not on $\phi$.', which holds per image branch only: with multiple images b is multivalued in mu. Image sum: Pechenick p. 847 'several images, they must all be summed over'. This entry REPLACES the rejected gr.observed-flux-element. Its round-2 reject said 'per image branch' overclaims the signed derivative, and the surviving statement was the printed equality on the primary monotonic branch, with general branches requiring |d cos alpha/d mu|. This entry encodes exactly that statement (truth/reviews/gr-r2.md line 12). VERIFICATION DATUM (wf1 review-r2:gr counterexample, recomputed here with mpmath 40 digits, M = 1): R/M = 3.2, alpha = 85 deg, b = R sin alpha (1 - 2M/R)^(-1/2). Pech83 eq. 2.12 gives psi = 190.6987573085 deg (wf1: 190.698757308 deg). dpsi/dalpha = 5.62990906389, mu = cos psi = -0.982616823247, and d cos alpha/d mu = sin alpha/(sin psi dpsi/dalpha) = -0.953144792405. With I_0 dS/D^2 = 1, the absolute-Jacobian flux is +0.0311520158731. That equals the first printed form (1 - r_g/R)^2 b |db/dmu|/R^2 to 4e-43. The printed signed form gives -0.0311520158731. wf1 quoted ±0.031152015859, which differs from this recomputation by 1.4e-11, inside wf1's tolerance of 1e-10. Primary-branch control: alpha = 40 deg gives psi = 67.8316713762 deg and d cos alpha/d mu = +0.377485591331 > 0, so there the signed and absolute forms agree. Bolometric reading: as in gr.intensity-transformation, the I/nu^4 law makes I frequency-integrated. The spectral analogue is not printed in these sources and is not claimed. Bel02's mu = cos psi is canonical \cos\psi (bare \mu is the RT direction cosine). r1 reproduction of the reviewer's numbers (mpmath 40 digits, Bel02 eqs. 9-10, R = 3.2 M, alpha = 85 deg): psi = 190.69875730845512033 deg, expected 190.6987573084551203 deg (truth/reviews/gr_geodesic-r1.md), error 2.6e-17 deg, tolerance 1e-12; d cos alpha/d mu = -0.95314479240534864, expected -0.9531447924053486, error -3.7e-17, tolerance 1e-15; absolute-Jacobian flux (I_0 dS/D^2 = 1) +0.031152015873056482, expected +0.03115201587305648, error 2.5e-18, tolerance 1e-16. sin psi = -0.1856453034 (psi in (pi, 2pi), n = 0), dpsi/dalpha = 5.62990906389 > 0. Sign scan at R = 3.2 M: alpha = 10, 40, 70 deg give psi = 16.36, 67.83, 133.46 deg and sign +1; alpha = 85, 89.9 deg give psi = 190.70, 226.21 deg and sign -1; dpsi/dalpha > 0 at all five (1.64, 1.84, 2.82, 5.63, 9.65). Notation bridge (gr_geodesic-r1 cross-entry): mu here is Bel02's cos psi (dictionary \cos\psi), neither the RT direction cosine \mu = cos theta nor DA09's mu = cos theta_Sch; phi in dS = R^2 dmu dphi is the Bel02 surface azimuth about D (dictionary \phi), not \phi_{Sch}; R is the stellar radius.'''
