[[entry]]
id = 'obs.agis-standard-model-neglects-lighttime'
kind = 'approximation'
domain = 'obs'
name = 'AGIS standard model: what is neglected'
statement = "The standard model can be derived by considering the uniform motion of the source in a purely classical framework, using Euclidean coordinates and neglecting the light propagation time from the source to the observer (except for the Roemer delay). The practical need to neglect most of the light-propagation time t - t_* (typically many years, and with a rate of change depending on the radial velocity, in general not known with sufficient accuracy) makes the transformation between kinematic and astrometric parameters non-trivial; the astrometric proper motions and radial velocity correspond to the 'apparent' quantities of Klioner (2003). To the accuracy of Gaia the model is stated to be accurate enough to model the observations to sub-microarcsec accuracy; when the astrometric parameters are to be interpreted in terms of the barycentric space velocity, some relativistic and light-propagation effects may come into play."
latex = '\text{(no formula: classical Euclidean model, light-time neglected except } t_\text{B}-t\text{)}'
source = 'lindegren_2012_agis'
locator = 'Sect. 3.2, text after eq. (roemer) (tex l.501)'
anchor = 'light propagation time from the source to the observer (except for the'
ocr = 'good'
provenance = 'convention'
ownership = 'stub'
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "accept", note = "Classical coordinates, neglected source light-time, retained Roemer delay, modelling accuracy and interpretation caveat are stated explicitly. refs/lindegren_2012_agis.txt:278–279,313–327." }]
validity = 'Stated for Gaia-accuracy modelling of observations (sub-microarcsec); see obs.bl-lighttime-first-order-effects for the size of what is neglected when propagating over a time t.'
depends_on = ["obs.agis-standard-model-direction"]
notes = "Fail-loud note: this paper does not quantify the neglected terms; that is done in Butkevich and Lindegren (2014) (obs.bl-lighttime-first-order-effects). The statement that the model is 'accurate enough ... to sub-microarcsec' is printed without a derivation here, and holds for the Gaia observing baseline."

