[[entry]]
id = 'obs.bl-proper-motion-components'
kind = 'equation'
domain = 'obs'
name = 'Proper motion vector and components via the normal triad'
statement = "The barycentric coordinate direction u = b/|b| and its time derivative, the proper motion vector mu = du/dt, are observable; they satisfy u'u = 1 and u'mu = 0 (four degrees of freedom). With the normal triad [p q r] at r (r = (cos delta cos alpha, cos delta sin alpha, sin delta), p = (-sin alpha, cos alpha, 0), q = (-sin delta cos alpha, -sin delta sin alpha, cos delta)) the proper motion components are the coordinates of mu along p and q: mu_alpha* = p'mu, mu_delta = q'mu, and mu = p mu_alpha* + q mu_delta. The alternative interpretation mu_alpha* = (d alpha/dt) cos delta, mu_delta = d delta/dt is equivalent for |delta| < pi/2 but fails at the poles."
latex = "\\vec{u} = \\frac{\\vec{b}}{|\\vec{b}|},\\quad \\vec{\\mu} = \\frac{\\mathrm{d}\\vec{u}}{\\mathrm{d}t},\\quad \\mu_{\\alpha*}=\\vec{p}'\\vec{\\mu},\\quad \\mu_\\delta=\\vec{q}'\\vec{\\mu}"
source = 'butkevich_lindegren_2014_propagation'
locator = 'Sect. 4, eqs. (u), (mu), (r), (pq), (proper_motion), (mu_from_comp), (proper_motion_alt) (tex l.577)'
anchor = 'We now define the proper motion components as the coordinates of $\vec{\mu}$'
anchor_tex = "\\mu_{\\alpha*}=\\vec{p}'\\vec{\\mu}\\, , \\quad \\mu_\\delta=\\vec{q}'\\vec{\\mu} \\, ."
ocr = 'good'
provenance = 'convention'
ownership = 'stub'
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "accept", note = "Definitions, triad components, projections, reconstruction and pole qualification match Eqs. (21)–(27). refs/butkevich_lindegren_2014_propagation.txt:286–360." }]
depends_on = ["obs.notation-gaia-propagation", "obs.agis-normal-triad"]
notes = 'Cross-check against obs.agis-normal-triad: same p, q, r components. The vector definition is what makes the transformation work at delta = +-pi/2.'

[[entry]]
id = 'obs.bl-parallax-radial-proper-motion'
kind = 'equation'
domain = 'obs'
name = 'Parallax, radial proper motion and total proper motion in terms of distance and velocity'
statement = 'Parallax is defined by varpi = A/b (A the astronomical unit, b = |b| the barycentric coordinate distance); the paper notes the alternatives sin varpi = A/b, tan varpi = A/b, 2 sin(varpi/2) = A/b differ at the order varpi^3 < 1e-10 arcsec. The sixth astrometric parameter is the radial proper motion mu_r = v_r varpi / A = v_r/b, analogous to the total tangential proper motion mu = (mu_alpha*^2 + mu_delta^2)^(1/2) = v_t/b. The apparent space velocity is v = (A_V/varpi)(r mu_r + mu), with A_V = 4.740 470 446 km yr s^-1 (parallax and proper motions in compatible units, e.g. mas and mas/yr).'
latex = '\varpi = \frac{A}{b},\quad \mu_r = v_r\varpi/A,\quad \mu = v_t/b,\quad \vec{v}=\frac{A_\mathrm{V}}{\varpi}\left(\vec{r}\mu_r+\vec{\mu}\right)'
source = 'butkevich_lindegren_2014_propagation'
