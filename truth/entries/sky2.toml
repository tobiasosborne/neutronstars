# Domain obs, lane sky2: epoch propagation of astrometric parameters, Hipparcos, Mellinger panorama.
# Sources: lindegren_2012_agis, butkevich_lindegren_2014_propagation, vanleeuwen_2007_hipparcos, mellinger_2009_panorama (plus lindegren_2021_gaia_astrometry for the Hipparcos frame epoch).
# All entries proposed.

[[entry]]
id = 'obs.notation-gaia-propagation'
kind = 'notation'
domain = 'obs'
name = 'Epoch-propagation symbols for astrometric parameters'
statement = "Symbols used by Lindegren et al. (2012) and Butkevich and Lindegren (2014) for the standard model of stellar motion and the propagation of the six astrometric parameters between epochs. Subscripted spellings avoid the project's ray cosine mu, impact parameter b, visual extinction A_V and camera symbols; the five-parameter symbols of obs.notation-gaia-sky are reused."
symbols = [
  { sym = "t_{ep}", sym_source = "T_0", meaning = "reference epoch chosen by convention", units = "s" },
  { sym = "t_{pr}", sym_source = "t = T - T_0", meaning = "time elapsed since the reference epoch over which the astrometric parameters are propagated (Julian years of 365.25 x 86400 s, TCB)", units = "s", units_source = "yr" },
  { sym = "\\vec{u}_{bary}", sym_source = "u", meaning = "barycentric coordinate direction to the source, unit vector b/|b| in the ICRS", units = "1" },
  { sym = "\\vec{r}_{tri}", sym_source = "r", meaning = "fixed unit vector coinciding with the barycentric direction at the reference epoch; third axis of the normal triad", units = "1" },
  { sym = "\\vec{p}_{tri}", sym_source = "p", meaning = "unit vector in the direction of increasing right ascension (first axis of the normal triad)", units = "1" },
  { sym = "\\vec{q}_{tri}", sym_source = "q", meaning = "unit vector in the direction of increasing declination (second axis of the normal triad)", units = "1" },
  { sym = "\\vec{\\mu}_{pm}", sym_source = "mu (vector)", meaning = "proper motion vector du/dt of the barycentric direction", units = "rad s^-1", units_source = "mas yr^-1" },
  { sym = "\\mu_{r}", sym_source = "mu_r", meaning = "radial proper motion mu_r = v_r varpi / A (radial velocity in the unit of proper motion), sixth astrometric parameter", units = "rad s^-1", units_source = "mas yr^-1" },
  { sym = "\\mu_{tot}", sym_source = "mu", meaning = "total tangential proper motion, (mu_alpha*^2 + mu_delta^2)^(1/2) = v_t / b", units = "rad s^-1", units_source = "mas yr^-1" },
  { sym = "\\vec{b}_{bary}", sym_source = "b (vector)", meaning = "barycentric position vector of the source: the apparent position b_app(T_obs) = b_true(T_em) from Sect. 4 onward of Butkevich and Lindegren (2014), where the subscripts are omitted; the true position at the same instant is a different quantity, and Sects. 1-3 write b for the true vector where the uniform rectilinear model is stated", units = "cm" },
  { sym = "b_{bary}", sym_source = "b = |b|", meaning = "barycentric distance of the source, varpi = A/b", units = "cm" },
  { sym = "\\vec{v}_{bary}", sym_source = "v (vector)", meaning = "space velocity of the source relative to the solar system barycentre: the constant TRUE velocity in the uniform rectilinear model (BL Sect. 3, eq. 1); the APPARENT velocity v_app from Sect. 4 onward, where the subscripts are omitted. True and apparent velocities differ by the light-time factor 1/(1 - v_r^app/c) of BL eq. (19); never mix them", units = "cm s^-1" },
  { sym = "v_{t}", sym_source = "v_t", meaning = "apparent tangential velocity of the source, v_t = mu b (BL Sect. 4, apparent quantities); the true tangential velocity is a different quantity", units = "cm s^-1" },
  { sym = "A_{vel}", sym_source = "A_V", meaning = "astronomical unit expressed in km yr s^-1: A_V = 4.740 470 446", units = "km yr s^-1" },
  { sym = "\\tau_{A}", sym_source = "tau_A", meaning = "light-travel time of one astronomical unit, tau_A = A/c = 499.004 784 s", units = "s" },
  { sym = "\\tau_{lt}", sym_source = "tau", meaning = "light-travel time T_obs - T_em from the source to the barycentre; tau_0 = b_0/c at the reference epoch", units = "s" },
  { sym = "f_{D}", sym_source = "f_D", meaning = "distance factor b_0/b of the epoch propagation", units = "1" },
  { sym = "f_{T}", sym_source = "f_T", meaning = "time factor of the epoch propagation with light-time effects", units = "1" },
  { sym = "f_{V}", sym_source = "f_V", meaning = "velocity factor of the epoch propagation with light-time effects", units = "1" },
  { sym = "\\varepsilon_{T}", sym_source = "epsilon_T", meaning = "small parameter f_T - 1 of the light-time expansion", units = "1" },
  { sym = "\\varepsilon_{V}", sym_source = "epsilon_V", meaning = "small parameter f_V - 1 of the light-time expansion", units = "1" },
  { sym = "\\Delta\\theta_{lt}", sym_source = "Delta theta", meaning = "angular-position error caused by neglecting light-time effects in the epoch propagation (first-order estimate)", units = "rad" },
  { sym = "\\vec{v}_{true}", sym_source = "v (true)", meaning = "true (constant) space velocity of the uniform rectilinear model, BL eq. (1); distinct from the apparent velocity \\vec{v}_{app}", units = "cm s^-1" },
  { sym = "\\vec{v}_{app}", sym_source = "v (apparent)", meaning = "apparent space velocity expressed through the astrometric parameters, v = (A_V/varpi)(r mu_r + mu), BL eq. (30); distinct from the true velocity \\vec{v}_{true}", units = "cm s^-1" },
  { sym = "\\mu_{tot,0}", sym_source = "mu_0", meaning = "total tangential proper motion at the reference epoch, mu_0 = |mu_0| = (mu_alpha*0^2 + mu_delta0^2)^(1/2) of BL; spelled mu_{tot,0} here because bare mu_0 is the vacuum permeability (const.notation-fundamental) and mu is the ray cosine", units = "rad s^-1", units_source = "mas yr^-1" },
]
source = 'butkevich_lindegren_2014_propagation'
locator = "Sect. 4 (astrometric parameters), Sect. 5, Appendix D (tex l.517)"
anchor = 'we shall subsequently use $t=T-T_0$ as the time argument in all expressions instead of $T$.'
ocr = 'good'
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "fix", note = "applied: t_ep sym_source set to T_0 and meaning to 'reference epoch chosen by convention'; mission-midpoint and J2016.0 qualifications moved to notes with separate sources (lindegren_2012_agis.txt:223–227, lindegren_2021_gaia_astrometry.txt:434–437, BL:273–283). Cross-entry bullets: true/apparent velocity distinction (v_true, v_app added; b_bary, v_bary, v_t reworded) and mu_0 mapped to mu_{tot,0}." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "accept", note = "`T_0` and conventional reference-epoch meaning are corrected; true/apparent velocities and scalar `mu_0` are explicitly distinguished. Definitions and units match `refs/butkevich_lindegren_2014_propagation.txt:238–283,286–339,534–535`." }]
notes = "Collision check against NOTATION_DECISIONS.md and notation_additions_*.md: bare mu is the ray cosine, bare b the impact parameter, A_V visual extinction (obs.notation-rxj1856-spectral), tau the camera proper time, f_nu the Eddington factor, varepsilon with letter subscripts perp/wedge/parallel/H/Lambda; none of the subscripted spellings above appears. Reuses obs.notation-gaia-sky symbols alpha_{RA}, delta_{Dec}, varpi_{plx}, mu_{alpha*}, mu_delta, v_r, A_u. [sky2-r1 applied] (1) t_ep is spelled T_0 in the source: BL print \"must be chosen, purely as a matter of convention\" (refs/butkevich_lindegren_2014_propagation.tex:516; txt:273–283); the mission-midpoint preference is Lindegren et al. (2012): \"preferably chosen to be near the mid-time of the mission in order to minimize\" (refs/lindegren_2012_agis.tex:444; txt:223–227); J2016.0 for EDR3 (hence DR3): \"which for the EDR3 astrometry is J2016.0\" (refs/lindegren_2021_gaia_astrometry.txt:434–437) (obs.gaia-reference-epoch-j2016). None of these is in the t_ep meaning. (2) True versus apparent: BL change convention between Sect. 3 (true quantities, eq. 1) and Sect. 4 (apparent quantities, subscripts omitted, refs/butkevich_lindegren_2014_propagation.txt:155–159,238–245); b_bary, v_bary and v_t carry the stated qualification, v_true and v_app are explicit. (3) Collision: BL's bare mu_0 (total proper motion at the reference epoch) is registered as \\mu_{tot,0}; the database's \\mu_0 stays the vacuum magnetic permeability (const.notation-fundamental, NOTATION_DECISIONS.md) and no obs entry may use \\mu_0 for proper motion. The latex fields of sky2 entries quote BL's spelling mu_0 verbatim; read it through this mapping."

[[entry]]
id = 'obs.agis-uniform-motion-kinematic-parameters'
kind = 'equation'
domain = 'obs'
name = 'AGIS: uniform space motion and the six kinematic parameters'
statement = 'For the astrometric core solution every source is assumed to move with uniform space velocity relative to the solar-system barycentre: in the BCRS b_i(t_*) = b_i(t_ep) + (t_* - t_ep) v_i, where t_ep is an arbitrary reference epoch and b_i(t_ep), v_i define six kinematic parameters. The six astrometric parameters are merely a transformation of the kinematic parameters into an equivalent set better suited for the analysis of observations.'
latex = '\vec{b}_i(t_*) = \vec{b}_i(t_\text{ep}) + (t_*-t_\text{ep})\vec{v}_i'
source = 'lindegren_2012_agis'
locator = 'Sect. 3.2 (Astrometric model), eq. (uniform) (tex l.416)'
anchor = 'every source is assumed to move with uniform'
anchor_tex = '\vec{b}_i(t_*) = \vec{b}_i(t_\text{ep}) + (t_*-t_\text{ep})\vec{v}_i'
ocr = 'good'
provenance = 'convention'
ownership = 'stub'
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "accept", note = "TeX anchor and equation match Sect. 3.2, printed Eq. (3), including the reference epoch and constant velocity. Six kinematic parameters and their transformation are explicit. refs/lindegren_2012_agis.txt:266–276." }]
validity = 'Uniform rectilinear motion relative to the barycentre; no acceleration, no companions.'
depends_on = ["obs.notation-gaia-propagation"]

[[entry]]
id = 'obs.agis-astrometric-parameter-set'
kind = 'equation'
domain = 'obs'
name = 'AGIS: the six astrometric parameters at the reference epoch'
statement = "The six astrometric parameters s_i are: alpha_i, the barycentric right ascension at the adopted reference epoch t_ep; delta_i, the barycentric declination at t_ep; varpi_i, the annual parallax at t_ep; mu_alpha*i = (d alpha_i/dt) cos delta_i, the proper motion in right ascension at t_ep; mu_delta,i = d delta_i/dt, the proper motion in declination at t_ep; and mu_ri = v_ri varpi_i / A_u, the 'radial proper motion' at t_ep, i.e. the radial velocity expressed in the same unit as the transverse proper motion (A_u = astronomical unit). The astrometric parameters refer to the ICRS and the time coordinate is TCB."
latex = '\mu_{ri}=v_{ri}\varpi_i/A_\text{u}'
source = 'lindegren_2012_agis'
locator = 'Sect. 3.2, parameter list (tex l.437)'
anchor = "the `radial proper motion' at epoch"
anchor_tex = '$\mu_{ri}=v_{ri}\varpi_i/A_\text{u}$'
ocr = 'good'
provenance = 'convention'
ownership = 'stub'
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "accept", note = "All six definitions, the factor cos(delta), mu_r = v_r varpi/A_u, ICRS and TCB match the source. refs/lindegren_2012_agis.txt:213–239,278–279." }]
depends_on = ["obs.agis-uniform-motion-kinematic-parameters", "obs.notation-gaia-propagation"]
notes = "The reference epoch is 'preferably chosen to be near the mid-time of the mission in order to minimize statistical correlations between the position and proper motion parameters' (same section). Gaia DR3 uses J2016.0 (obs.gaia-reference-epoch-j2016)."

[[entry]]
