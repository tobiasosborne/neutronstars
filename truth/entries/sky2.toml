kind = 'equation'
domain = 'obs'
name = 'AGIS standard model: coordinate direction at time t (direction-vector form with perspective acceleration)'
statement = "The coordinate direction to the source at time t is calculated with the same 'standard model' as was used for the Hipparcos reduction: u_bar_i(t) = < r_i + (t_B - t_ep)(p_i mu_alpha*i + q_i mu_delta,i + r_i mu_ri) - varpi_i b_G(t)/A_u >, where the angular brackets signify vector length normalisation, [p_i q_i r_i] is the normal triad of the source with respect to the ICRS, r_i the barycentric coordinate direction at t_ep, b_G(t) the barycentric position of Gaia at the time of observation, and t_B the barycentric time obtained by correcting the observation time for the Roemer delay. The mu_ri term accounts for the relative rate of change of the barycentric distance (perspective acceleration)."
latex = '\vec{\bar{u}}_i(t) = \bigl\langle \vec{r}_i+(t_\text{B}-t_\text{ep})(\vec{p}_i\mu_{\alpha*i}+\vec{q}_i\mu_{\delta i}+\vec{r}_i\mu_{ri})-\varpi_i\vec{b}_\text{G}(t)/A_\text{u} \bigr\rangle'
source = 'lindegren_2012_agis'
locator = 'Sect. 3.2, eq. (astro-standard) (tex l.458)'
anchor = 'The coordinate direction to the source at time $t$ is calculated with the same'
anchor_tex = '\vec{\bar{u}}_i(t) = \bigl\langle \vec{r}_i+(t_\text{B}-t_\text{ep})(\vec{p}_i\mu_{\alpha*i}'
ocr = 'good'
provenance = 'convention'
ownership = 'stub'
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "accept", note = "Normalization, all three motion terms, negative parallax term and observer position match printed Eq. (4). The distance-change interpretation is explicit. refs/lindegren_2012_agis.txt:240–277." }]
depends_on = ["obs.agis-astrometric-parameter-set", "obs.agis-normal-triad"]
notes = "Source of the 'perspective acceleration' term the sky lane could not find in Lindegren 2021 (obs.gaia-perspective-acceleration): it is the r_i mu_ri term. The vector is normalised, so the position at epoch t (without the parallax term, setting b_G = 0) is the normalised r + dt (p mu_alpha* + q mu_delta + r mu_r): this is exactly the no-light-time rigorous direction of obs.bl-propagation-direction-nolt (compare Butkevich eq. propBarDirection, whose f_D normalisation is the angular-bracket normalisation). Usually only five of the six are unknowns in the astrometric solution, because mu_r is better obtained from a spectroscopic radial velocity and the parallax (same section)."

