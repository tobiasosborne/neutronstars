[[entry]]
id = 'obs.mellinger-background-and-star-content'
kind = 'datum'
domain = 'obs'
name = 'Mellinger 2009: which light is removed and which kept; stars are NOT removed'
statement = "Light pollution, airglow, zodiacal light and tropospheric scattering (I_bad) were removed using Pioneer 10/11 space-probe sky-background data (Gordon et al. 1998) for the retained component I_good = I_ISL + I_DGL + I_EBL (integrated starlight of unresolved stars, diffuse galactic light, extragalactic background). The model is I = S + I_bad + I_good with S the flux of point sources or resolved diffuse objects; I_bad is estimated by a strong median filter of (I - I_good) and subtracted, leaving S + I_good. Stars were not removed: the panorama shows stars to approx. 14 mag, plus the Magellanic Clouds, M31 and solar-system objects ('No attempt was made to remove or avoid solar system objects invisible to the naked eye'). The Pioneer data do not cover the whole sky (excluded within 70 deg of the Sun for Pioneer 10 and 45 deg for Pioneer 11); missing data were filled from Leinert et al. (1998) points on a 10 x 10 degree grid and a bicubic spline interpolation."
value = 'starless: no. Stars to approx. 14 mag retained; unresolved-star background retained'
units = '-'
uncertainty = 'not printed'
source = 'mellinger_2009_panorama'
locator = 'Sect. 3.4 (Background subtraction); Sect. 4 (tex l.333)'
anchor = 'Many of these contributions to the night sky brightness are undesirable in an all-sky mosaic image.'
ocr = 'good'
provenance = 'measured'
ownership = 'leaf'
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "fix", note = "applied: notes: 'a new first-principles step' replaced by 'an unvalidated reconstruction proposal' for masking/inpainting; background equations unchanged." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "accept", note = "Background decomposition, filtering, retained stars and interpolation match. Masking/inpainting is now correctly labelled an unvalidated proposal. `refs/mellinger_2009_panorama.txt:257–277,308–330,355–371`." }]
notes = "PRD 'starless diffuse Milky Way' is NOT met by this map as published: it contains resolved stars down to approx. 14 mag. The retained I_good also contains the integrated light of unresolved stars (I_ISL); a diffuse map that is to be combined with Gaia point sources must avoid counting those stars twice, and the paper describes no star-masking or star-subtraction step. Gaia DR3 point sources (catalogue range G = 3 to 21 per the sky lane, obs.gaia-magnitude-range-and-bright-end) would overlap with this map's resolved stars. Open PRD decision (record in handoff): (a) accept Mellinger plus star masking by Gaia positions with an inpainting step (project-owned, an unvalidated reconstruction proposal; the paper supports no recovery of the missing diffuse radiance), (b) find a starless diffuse map with a printed arXiv source, (c) rebuild a diffuse background from Gaia total-flux minus catalogued flux (needs a printed Gaia source). Mellinger prints no licence (see obs.mellinger-availability)."

[[entry]]
id = 'obs.mellinger-availability'
kind = 'datum'
domain = 'obs'
name = 'Mellinger 2009: availability and licence statement'
statement = "The paper prints no licence for the panorama. It states that 'a zoomable Mercator projection can be seen on the author's web site' (a viewing statement), that a low-resolution colour image is shown in the paper (Fig. 7), and that an OpenEXR version of the full 32-bit maps is 'in preparation'. It prints no download statement, no redistribution or reuse terms, and no data-centre identifier."
value = 'licence: not printed'
units = '-'
uncertainty = '-'
source = 'mellinger_2009_panorama'
locator = 'Sect. 4 (Results), Sect. 5 (Applications) (tex l.395)'
anchor = "A zoomable Mercator projection can be seen on the author's web site"
ocr = 'good'
provenance = 'measured'
ownership = 'leaf'
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "fix", note = "applied: figure reference corrected from Fig. 5 to Fig. 7 (refs/mellinger_2009_panorama.txt:360); viewing and OpenEXR 'in preparation' statements retained; no licence grant exists in the paper." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "accept", note = "Fig. 7 correction is applied. Viewing and OpenEXR “in preparation” statements match; the paper supplies no panorama download commitment or reuse licence. `refs/mellinger_2009_panorama.txt:360–361,394–397`." }]
notes = 'Anchor is the verbatim viewing statement. The licence and download availability must be established from a source other than this paper before the map is used at runtime; the pipeline rule 7 requires a measurement or convention: the map would be a measurement (with its own checksums under refs/data/) but no licence is on disk. Not harvested: licence text.'
