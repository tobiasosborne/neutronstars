notes = "Units: in these formulae mu and varpi are in radians per unit time and radians and tau_A in the same time unit as t (tau_A = 1.5812507e-5 yr, computed from the printed 499.004 784 s and the printed Julian year 365.25 x 86400 s). Self-check against the paper's own example: Barnard's star mu = 10357.70 mas/yr, varpi = 549.01 mas; solving Delta theta = 1 mas for t gives 113.5 yr (paper: 't << 114 yr'), and Delta theta = 1 microarcsec gives 3.59 yr (paper: '3.6 yr'). Computed here with the equations above. [sky2-r1 applied] Parallax identity: from (D.9) Delta varpi = mu_r mu^2 tau_A t^2/2 and Delta mu_r = mu_r mu^2 tau_A t/varpi, so Delta varpi = (1/2) varpi t Delta mu_r (algebra; numeric check with mu = 331.2 mas/yr, varpi = 8.16 mas, t = 16 yr, illustrative mu_r = 172.134814 mas/yr: Delta varpi from (D.9) = 8.982760e-13 mas, (1/2) varpi t Delta mu_r = 8.982760e-13 mas, absolute error 0.0e+00 mas; the printed form (1/2) t Delta mu_r would give 2.270622e-05 mas, larger by 1/varpi = 2.528e+07). The printed (D.10) form without the factor varpi disagrees with (D.9) by the factor varpi. The four effect estimates themselves match refs/butkevich_lindegren_2014_propagation.txt:1345–1360. depends_on reduced to the retained no-light-time entries because the rigorous f_T, f_V entries are dropped (deferred), not rejected as wrong; the f_T, f_V definitions of the paper remain the source of epsilon_T, epsilon_V."

[[entry]]
id = 'obs.bl-lighttime-neglect-criterion'
kind = 'result'
domain = 'obs'
name = 'Criterion for neglecting light-time effects'
statement = "Light-time effects may be ignored if Delta theta << sigma_theta and Delta mu << sigma_mu, i.e. t^2 << 2 varpi sigma_theta / (mu^3 tau_A) and t << varpi sigma_mu / (mu^3 tau_A). The strong cubic dependence on mu means light-time effects are mainly important for high-proper-motion stars. Example printed: Barnard's star (mu = 10357.70 mas/yr, varpi = 549.01 mas): at sigma_theta = 1 mas, negligible for t << 114 yr; at 1 microarcsec only for t << 3.6 yr."
latex = 't^2\ll\frac{2\varpi\sigma_\theta}{\mu^3\tau_\mathrm{A}},\quad t\ll\frac{\varpi\sigma_\mu}{\mu^3\tau_\mathrm{A}}'
source = 'butkevich_lindegren_2014_propagation'
locator = 'Sect. 6.1, eq. (neglect) (tex l.1247)'
anchor = 'light-time effects are negligible'
anchor_tex = 't^2\ll\frac{2\varpi\sigma_\theta}{\mu^3\tau_\mathrm{A}} \, ,'
ocr = 'good'
provenance = 'derivable'
ownership = 'stub'
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "accept", note = "Both inequalities, cubic proper-motion dependence and Barnard examples match Eq. (88) and its discussion. Python reproduces the quoted boundaries as 113.533 and 3.59023 yr. refs/butkevich_lindegren_2014_propagation.txt:751–780." }]
depends_on = ["obs.bl-lighttime-first-order-effects"]
notes = "Reproduced numerically here: 113.5 yr and 3.59 yr for Barnard's star (see obs.bl-lighttime-first-order-effects)."

[[entry]]
id = 'obs.bl-uniform-model-applicability'
kind = 'approximation'
domain = 'obs'
name = 'Uniform-motion assumption: effect of a constant acceleration'
statement = 'A constant acceleration a on the barycentric position of a star over a span t gives Delta b ~ a t^2/2, hence Delta theta ~ a_perp t^2/(2b) (a_perp the tangential component) and Delta mu ~ a_perp t/b; in parallax Delta varpi ~ -A a_par t^2/(2 b^2) and in radial velocity Delta v_r ~ a_par t. The motion may be regarded as uniform if |Delta theta| << sigma_theta. The dominant acceleration common to all stars is the Galactic one (differential acceleration relative to the SSB); at the Sun a_0 = V_0^2/R_0 ~ 2.5e-10 m s^-2 (R_0 ~ 8.4 kpc, V_0 ~ 254 km/s, as printed). Companions are not considered.'
latex = '\Delta\theta\simeq a_\perp t^2/(2b),\quad \Delta\mu\simeq a_\perp t/b,\quad \Delta\varpi\simeq -A a_\parallel t^2/(2b^2)'
source = 'butkevich_lindegren_2014_propagation'
locator = 'Appendix E (tex l.2349)'
anchor = 'The corresponding change in the angular position'
anchor_tex = '$\Delta\theta\simeq a_\perp t^2/(2b)$'
ocr = 'good'
provenance = 'derivable'
ownership = 'stub'
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "accept", note = "Acceleration estimates, negative parallax sign, differential acceleration and companion exclusion match printed Appendix E. The solar acceleration is presented as the paper's illustrative estimate. refs/butkevich_lindegren_2014_propagation.txt:1371–1387,1413–1446." }]
validity = 'Constant acceleration; Galactic differential acceleration only. Not evaluated for RX J1856 (neutron-star proper motion, any companion or Galactic-potential curvature not assessed).'
depends_on = ["obs.bl-uniform-rectilinear-model"]
notes = 'Order-of-magnitude for RX J1856 is NOT printed and was not computed by this lane. The paper does not claim anything about its binarity or Galactic acceleration.'

