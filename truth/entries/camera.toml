[[entry]]
id = "gr.camera-projection-convention"
kind = "pipeline"
domain = "gr"
name = "Camera projection: pixel to camera-sky direction (pinhole or equidistant)"
statement = "Project convention for mapping a pixel to a direction on the camera's local sky, in the rest frame of the camera tetrad e_(a)^cam (gr.static-tetrad boosted by gr.tetrad-lorentz-transformation to u_cam). The optical axis is the unit vector a_cam. Image-right u_x and image-up u_y complete an orthonormal triad with u_x x u_y = -a_cam, so the image is unmirrored when viewed looking along a_cam. A pixel at (x_pix, y_pix) has offsets (dx, dy) from the optical-axis pixel (x_pix,0, y_pix,0), with dy positive toward image-up. Its image radius is r_pix = (dx^2 + dy^2)^(1/2) and its azimuth phi_field = atan2(dy, dx). The field angle from the optical axis is theta_field = arctan(r_pix/f_cam) for a pinhole (rectilinear) camera, valid for theta_field < pi/2, or theta_field = r_pix/f_cam for an equidistant fisheye. The focal length f_cam is in pixels and must satisfy f_cam > 0. The field angle is restricted to 0 <= theta_field <= pi (pinhole: 0 <= theta_field < pi/2); the full field of view of the image, rather than theta_field, may exceed pi. On the optical axis (r_pix = 0, theta_field = 0) N_cam(0) = a_cam. The pixel's sky direction is N_cam = cos theta_field a_cam + sin theta_field (cos phi_field u_x + sin phi_field u_y). It points toward the apparent source of the incoming ray, as N in James et al. 2015 eq. A.8. The photon propagates along -N_cam, with p = (h nu_cam/c)(e_(0)^cam - N^a e_(a)^cam), i.e. p^(0) = h nu_cam/c and h nu_cam = c p^(0) = -p_mu u^mu_cam (gr.frequency-ratio-general, gr.tetrad-vector-components)."
source = "PRD"
locator = "The shot, Frame"
anchor = "the camera's local tetrad. Aberration, Doppler, and gravitational"
ocr = "good"
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "fix", note = "applied: f_cam > 0 required; N_cam(0) = a_cam defined; equidistant field angle restricted to 0 <= theta_field <= pi (the full field of view, not this angle, may exceed pi); unsupported James claim of a neutron-star image above 2 pi sr deleted (its example is a Kerr black-hole shadow, james_2015_interstellar.txt:825-860); sourced photon-energy normalization h nu_cam = c p^(0) = -p_mu u^mu_cam attached from gr.frequency-ratio-general. kind = pipeline, so the applied gpt fix suffices to bless under the SCHEMA rule; r2 confirmation still requested." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "accept", note = "[PRD anchor:19–20](/home/tobias/Projects/neutronstars/PRD.md:19) matches; projection maps are explicitly project conventions. All R1 corrections are applied: positive focal length, defined axial direction, bounded field angle, removed neutron-star attribution and explicit photon-energy normalization. Propagation along `-N` agrees with [James text:1415](/home/tobias/Projects/neutronstars/refs/james_2015_interstellar.txt:1415)." }]
depends_on = ["gr.static-tetrad", "gr.tetrad-lorentz-transformation", "gr.tetrad-vector-components", "gr.camera-aberration", "gr.frequency-ratio-general"]
notes = "Numerical check of the applied constraints (1000 random axes, pixel offsets, f_cam in 100-2000 px; pinhole and equidistant maps): N_cam(0) = a_cam expected difference 0, computed 0, tolerance 1e-14; |N_cam| = 1 expected 1, max error 3.3e-16, tolerance 1e-14; N_cam.a_cam = cos theta_field max error 4.4e-16, tolerance 1e-14. OPEN PRD DECISION: PRD.md does not choose between the pinhole and the equidistant projection, and does not fix f_cam or the field of view. Pinhole: straight lines stay straight, the field is limited to < pi, and pixel solid angle shrinks as cos^3 theta_field toward the edge. Equidistant: the field angle is linear in r_pix, and the full field of view (the cone of directions covered by the image) may exceed pi, while theta_field itself stays within [0, pi]. No source in refs/ establishes that a neutron-star image can exceed 2 pi sr; the James et al. 2015 example (Sect. 3.5, refs/james_2015_interstellar.txt:825-860) concerns a Kerr black-hole shadow, so the wide-field need is an open question for the PRD. Also open: (i) how the pointing a_cam ('tracking the star or fixed inertial', PRD The shot, Pointing) is defined and transported along the worldline; (ii) the raster storage order of y_pix, which is separate from the image-up convention fixed here; (iii) the pixel solid angle, which the radiance-to-flux step needs. The two projection maps and the handedness rule are project definitions. No file in refs/ prints them, and they make no physical claim. The physics they feed (N, aberration, p^mu) is sourced in the entries listed in depends_on. Both maps give theta_field = r_pix/f_cam + O(r_pix^3) near the axis, so they agree for a narrow field. Resolves the r1 objection on pipeline.camera-tetrad-projection that the direction convention was undefined: N is the sightline toward the source, and the propagation direction is -N. Canonical symbols: f_{cam}, r_{pix}, \\theta_{field}, \\phi_{field}, \\hat a_{cam}, \\hat N_{cam}, x_{pix}, y_{pix}."
provenance = "convention"
ownership = "leaf"
