[[entry]]
id = "gr.doppler-factor-sr"
kind = "equation"
domain = "gr"
name = "Special-relativistic Doppler factor of the moving camera"
statement = "A camera moves with speed beta relative to the local static observer. For a photon arriving from camera-sky direction N, the ratio of the frequency the camera measures to the frequency the static observer at the same event measures is nu_cam/nu_st = sqrt(1 - beta^2)/(1 - beta N_y) = 1/[gamma (1 - beta cos theta_v)]. Here N_y = cos theta_v, and theta_v is the angle, in the camera frame, between the camera velocity e_y and the direction toward the ray's apparent source. Far from the star (alpha -> 1, omega -> 0) this factor is the whole of f_c/f' in eq. A.16."
latex = '''\left.\frac{f_c}{f'}\right|_{\alpha=1,\ \omega=0}=\frac{\sqrt{1-\beta^2}}{1-\beta N_y}'''
source = "james_2015_interstellar"
locator = "App. A.1, eq. A.16, first factor (limit alpha -> 1, omega -> 0); also the bundle-size factor in eq. A.26"
anchor = "its frequency $f'$ as seen by the source at rest on the celestial sphere, from"
anchor_tex = ' \left(\frac{\sqrt{1-\beta^2}}{1- \beta N_y }\right)'
ocr = "good"
validity = "special relativity in the local frame: any two observers at one event whose relative speed is beta along e_y; |beta| < 1"
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "accept", note = "Anchors match A.16's first factor, text:1251-1256. Boost derivation confirms local interpretation and camera-frame angle convention. Independent test, 1000 boosts: max relative Doppler error 2.66e-15, tolerance 1e-12." }]
depends_on = ["gr.camera-blueshift-celestial", "gr.camera-aberration", "gr.tetrad-lorentz-transformation"]
notes = "Derivation (harvester): in the camera frame the photon is p = E(1, -N). In the static frame, where the camera moves with +beta along y, p^0_st = gamma E (1 - beta N_y). Hence nu_cam/nu_st = 1/[gamma (1 - beta N_y)] = sqrt(1 - beta^2)/(1 - beta N_y), the first factor of eq. A.16. The same factor rescales bundle angular sizes in James eq. A.26 (refs/james_2015_interstellar.tex:1545-1549). Check over 1000 random beta in (-0.99, 0.99) and directions: relative error 3.3e-16 against the explicit boost (tolerance 1e-12). Limits: N_y = +1 (source dead ahead) gives sqrt((1 + beta)/(1 - beta)), a blueshift for beta > 0; N_y = 0 gives sqrt(1 - beta^2), the transverse Doppler redshift. This is the R2 far-field check target (PRD R2: 'Aberration and Doppler reduce to special relativity far from the star'). Rybicki & Lightman Ch. 4 (GAPS 1.6) is a book and was not fetched. Canonical symbols: \\mathcal{D}_{cam} for the factor, \\nu_{st} for the static-observer frequency."
