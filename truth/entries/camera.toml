[[entry]]
id = "gr.frequency-ratio-general"
kind = "equation"
domain = "gr"
name = "General frequency ratio g = (p.u_cam)/(p.u_em)"
statement = "Dexter & Agol define g = nu_0/nu, with nu_0 (nu) the observed (emitted) frequency, and print dl = -p_alpha u^alpha d(lambda) as the proper length differential measured along the ray by the emitting particle u. The following is derived here, not printed there. For a photon of four-momentum p^mu, a timelike observer with four-velocity u^mu, u_mu u^mu = -c^2, has tetrad time leg e_(0) = u/c and measures local energy component p^(0) = -p_mu u^mu/c (gr.tetrad-vector-components), so h nu = c p^(0) = -p_mu u^mu with E = h nu. For emitter u_em and camera u_cam this gives g = nu_0/nu = (p_mu u^mu_cam)/(p_mu u^mu_em)."
latex = 'g\equiv\nu_0/\nu,\qquad h\nu=c\,p^{(0)}=-p_\mu u^\mu,\quad u_\mu u^\mu=-c^2\;\Rightarrow\; g=\frac{p_\mu u^\mu_{cam}}{p_\mu u^\mu_{em}}'
source = "dexter_agol_2009_kerr"
locator = "Sect. 7, Line Emission subsection, text after eq. 70 (g), p. 11; Radiative Transfer subsection, text after eq. 72 (-p_alpha u^alpha), p. 12"
anchor = 'where $g \equiv \nu_0/\nu$ is the redshift, and $\nu_0$ ($\nu$) is the observed (emitted) frequency.'
anchor_tex = 'where $dl =  -p_\alpha u^\alpha d\lambda$ is the proper length differential measured along the ray'
ocr = "good"
validity = "geometric optics (photon on a null geodesic, no plasma dispersion); both four-velocities timelike, future-directed, unit-normalised with u_mu u^mu = -c^2; p_mu u^mu evaluated at the respective events on the same ray"
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "fix", note = "applied: claim reduced to what is printed. Dexter & Agol print only g = nu_0/nu and dl = -p_alpha u^alpha d(lambda); the ratio form is a stated derivation. Argument completed with h nu = c p^(0) = -p_mu u^mu (u_mu u^mu = -c^2), correcting 'energy component'; local energy component and E = h nu quoted in notes (grep -F -c: Kohri 1, CODATA 2)." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "fix", note = "applied: Anchors match; the ratio is now honestly identified as derived. The tetrad argument, [photon-energy component](/home/tobias/Projects/neutronstars/refs/kohri_yamada_2002_vacuum.txt:90) and [CODATA `E=hν`](/home/tobias/Projects/neutronstars/refs/tiesinga_2021_codata2018.txt:3429) support that derivation; CODATA PDF p. 44 was independently viewed. However, replace the notes’ `'emitter-frame photon energy per unit affine parameter'` with `'proper-length rate dℓ/dλ in Dexter & Agol’s normalization'`: their printed relation is `dℓ/dλ=-p_alpha u^alpha` ([text:930–933](/home/tobias/Projects/neutronstars/refs/dexter_agol_2009_kerr.txt:930))." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 3, verdict = "accept", note = "R2 correction complete: notes now identify `-p·u` as the “proper-length rate dℓ/dλ in Dexter & Agol’s normalization,” matching [text:930–933](/home/tobias/Projects/neutronstars/refs/dexter_agol_2009_kerr.txt:930). Both TeX anchors match byte-for-byte. The source’s [frequency definition](/home/tobias/Projects/neutronstars/refs/dexter_agol_2009_kerr.txt:872) is distinguished from the explicitly derived contraction ratio." }]
depends_on = ["gr.tetrad-vector-components", "gr.camera-four-velocity-static-frame", "gr.static-tetrad"]
notes = "Local energy component, quoted verbatim from refs/kohri_yamada_2002_vacuum.txt:90-92: 'ω the photon energy' (k = (ω, k⊥, 0, k∥) is the energy-momentum 4-vector of the photon). E = h nu, quoted verbatim from refs/tiesinga_2021_codata2018.txt:3429: 'The energy of a photon with frequency ν expressed in unit Hz is E ¼ hν in unit J.' (CODATA PDF p. 44 image-verified by the reviewer). Derivation (harvester): Dexter & Agol print g = nu_0/nu. They also print dl = -p_alpha u^alpha dlambda as the proper length element measured along the ray by the emitter u, i.e. -p.u is the proper-length rate dℓ/dλ in Dexter & Agol’s normalization. By gr.tetrad-vector-components, p^(0) = -p_mu u^mu/c is the local energy component (E_obs/c) on a tetrad with time leg e_(0) = u/c, so E_obs = c p^(0) = -p_mu u^mu = h nu. Taking the ratio at the two events gives g = (p.u_cam)/(p.u_em), with the unknown normalisation of p cancelling. The ratio form itself is not printed in any local source. Reduction to gr.frequency-redshift: in Schwarzschild a static observer has u^mu = (1 - r_g/r)^(-1/2) delta^mu_t (gr.static-observer-four-velocity, G = c = 1), and p_t is conserved along the ray. Hence g = p_t u^t_cam/(p_t u^t_em) = (1 - r_g/R)^(1/2)/(1 - r_g/r_c)^(1/2) for a static emitter at R and a static camera at r_c. Numerically, with r_g = 1, R = 3, r_c = 50: g = 0.8247860988423227 against the closed form 0.8247860988423225. For r_c = 1e12 g = 0.8164965809281344 -> (1 - r_g/R)^(1/2) = 0.816496580927726, which is gr.frequency-redshift (nu/nu_0 = (1 - r_g/R)^(1/2)); the difference is 4e-13, of order r_g/(2 r_c). Moving camera, emitter at infinity: g reproduces James eq. A.16 (gr.camera-blueshift-celestial) at a = 0. Canonical symbol: g_{shift} = \\nu_{cam}/\\nu (bare g is surface gravity)."
