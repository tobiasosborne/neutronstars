[[entry]]
id = "rt.notation-mcphac"
v1_ref = "archive/v1/src/atmosphere/feautrier.jl:82"
kind = "notation"
domain = "rt"
name = "McPHAC plane-parallel RT notation (Haakonsen 2012)"
statement = "Symbols used by the McPHAC unmagnetised plane-parallel transfer, structure and temperature-correction equations. mu is the positive cosine of the angle to the outward normal; outgoing intensity is I(y,mu) and ingoing is I(y,-mu)."
symbols = [
  { sym = "\\mu", sym_source = "μ", aliases = ["μ"], meaning = "cosine of the angle between a ray and the outward surface normal (positive); ingoing rays are written with -μ", units = "1" },
  { sym = "I_\\nu(m,\\mu)", sym_source = "I_ν(y,μ)", meaning = "specific intensity of outgoing radiation at column depth y, frequency ν, direction μ", units = "erg s^-1 cm^-2 Hz^-1 sr^-1" },
  { sym = "I_\\nu(m,-\\mu)", sym_source = "I_ν(y,-μ)", meaning = "specific intensity of ingoing radiation (direction -μ)", units = "erg s^-1 cm^-2 Hz^-1 sr^-1" },
  { sym = "P_\\nu(m,\\mu)", sym_source = "P_ν(y,μ)", meaning = "Feautrier variable: half the sum of outgoing and ingoing specific intensity, (I(y,μ)+I(y,-μ))/2", units = "erg s^-1 cm^-2 Hz^-1 sr^-1" },
  { sym = "m", sym_source = "y_col", aliases = ["y", "y_col"], meaning = "column density (mass per unit area above the point), dm = -rho dz", meaning_source = "column depth y (mass of material per unit area above the point); written y in McPHAC", units = "g cm^-2" },
  { sym = "g", sym_source = "g_s", aliases = ["g_s", "g_surf"], meaning = "surface gravity (local proper) g = GM/(R^2 sqrt(1 - r_g/R)), taken uniform through the atmosphere", meaning_source = "surface gravity, taken uniform through the atmosphere", units = "cm s^-2" },
  { sym = "P_g", sym_source = "P(y)", aliases = ["P", "P(y)", "P_gas"], meaning = "gas pressure (electrons plus ions)", meaning_source = "gas pressure at column depth y", units = "dyn cm^-2" },
  { sym = "\\tau_\\nu", sym_source = "τ_ν", meaning = "effective normal optical depth, dτ_ν = k_ν dy", units = "1" },
  { sym = "\\kappa_\\nu", sym_source = "κ_ν", aliases = ["kappa_nu", "κ_ν"], meaning = "B = 0 true-absorption opacity at photon frequency nu (free-free for fully ionised hydrogen; McPHAC also allows other absorption processes)", meaning_source = "true absorption opacity (free-free for fully ionised H)", units = "cm^2 g^-1" },
  { sym = "\\sigma_{T,r}", sym_source = "σ_T,r", aliases = ["sigma_T_r", "σ_T,r"], meaning = "reduced Thomson scattering opacity of McPHAC (per gram, includes the ionisation fraction)", meaning_source = "reduced Thomson scattering opacity", units = "cm^2 g^-1" },
  { sym = "k_\\nu", sym_source = "k_ν", meaning = "total opacity k_ν = κ_ν + σ_T,r (called total absorption opacity in the paper)", units = "cm^2 g^-1" },
  { sym = "\\varpi_\\nu", sym_source = "ρ_ν", aliases = ["ρ_ν"], meaning = "dimensionless scattering albedo σ_T,r/(κ_ν+σ_T,r) = σ_T,r/k_ν (not mass density)", units = "1" },
  { sym = "B_\\nu(T)", sym_source = "B_ν(T)", meaning = "blackbody (Planck) intensity at temperature T", units = "erg s^-1 cm^-2 Hz^-1 sr^-1" },
  { sym = "S_\\nu(m,\\mu)", sym_source = "S_ν(y,μ)", meaning = "source function", units = "erg s^-1 cm^-2 Hz^-1 sr^-1" },
  { sym = "d\\sigma_{T,r}/d\\mu'(\\mu,\\mu')", sym_source = "dσ_T,r/dμ′(μ,μ′)", meaning = "differential amount of scattering from directions μ′ into directions μ", units = "cm^2 g^-1" },
  { sym = "\\mu_q", sym_source = "μ_j", aliases = ["μ_j"], meaning = "Gauss-Legendre angle nodes on (0,1); M of them", units = "1" },
  { sym = "a_q", sym_source = "a_j", aliases = ["a_j"], meaning = "Gauss-Legendre weights on (0,1); M of them", units = "1" },
  { sym = "J_\\nu", sym_source = "J_ν", meaning = "mean specific intensity, integral over 0..1 of P_nu dmu; the moment-equation J_nu equals the transfer-solution mean only as the temperature correction vanishes (McPHAC)", units = "erg s^-1 cm^-2 Hz^-1 sr^-1" },
  { sym = "f_\\nu", sym_source = "f_ν", meaning = "Eddington factor (second moment of P_ν over J_ν)", units = "1" },
  { sym = "h_\\nu", sym_source = "h_ν", meaning = "surface Eddington factor (first moment of P_ν over J_ν)", units = "1" },
  { sym = "k_R", meaning = "Rosseland mean total absorption opacity", units = "cm^2 g^-1" },
  { sym = "T_s", sym_source = "T_eff,atm", meaning = "local effective surface temperature in the local reference frame at the stellar surface", meaning_source = "target effective temperature of the plane-parallel atmosphere (sets the flux sigma T_eff^4)", units = "K" },
  { sym = "T^{(0)}", sym_source = "T0(y)", aliases = ["T_0(y)", "T0"], meaning = "present best-guess temperature profile T_0(y) of the iteration, T = T_0 + Delta T", units = "K" },
  { sym = "\\Delta T", sym_source = "ΔT", meaning = "temperature correction Delta T(y), T(y) = T_0(y) + Delta T(y)", units = "K" },
]
conflicts_with = ["colour.notation-chromaticity", "colour.notation-reinhard-parameters", "const.notation-fundamental", "eos.notation-electron-gas", "gr.notation-geometry", "opacity.notation-particles-plasma", "rt.notation-cond-emissivity-fit", "rt.notation-spw09", "rt.notation-vacuum", "rt.notation-val"]
adopted = true
adopted_syms = ["mu", "k", "tau", "S"]
conflict_notes = ["mu: RT direction cosine keeps \\mu. Bel02 mu = cos psi -> \\cos\\psi; PY01 chemical potential -> \\mu_e; PC03 reduced mass -> \\mu_{red}.", "rho: Mass density keeps \\rho. McPHAC albedo rho_nu -> \\varpi_\\nu.", "k: McPHAC k_nu (B = 0 total opacity) keeps k_\\nu. SPW09 k_nu^i (mode absorption) -> \\kappa^a_j; CODATA k -> k_B.", "tau: Monochromatic optical depth keeps \\tau_\\nu. VAL06 Thomson depth tau -> \\tau_T.", "j: j is the normal-mode index (1 = X, 2 = O). McPHAC angle-node index j -> q; Pot12 linear-polarisation index j -> l (m -> l'), Pot12 mode index M -> j.", "y: Chromaticity keeps x, y, z. Reinhard pixel position -> (x_{pix},y_{pix}); McPHAC column depth y -> m.", "S: S_nu is the source function. Bel02 visible area S_v -> S_{vis}; VAL06 stimulated-emission factor S -> S_{stim}."]
source = "haakonsen_2012_mcphac"
locator = "Sects. 2–3.4, eqs. 1–7, 10, 19–22; Appendix A, eq. A4"
anchor = "for outgoing (Iν (y, μ)) and ingoing (Iν (y, −μ)) specific inten-"
ocr = "good"
status = "blessed"
notes = "Units of y, opacities and gs follow the paper (g cm^-2, cm^2 g^-1, cgs). The same quantity as g_s appears as g in SPW09 and VAL06. The paper uses rho_nu for the albedo; project notation must not reuse it for density."
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "fix", note = "Locator widened per reviewer (H:155-223, 260-293, 359-371, 405-418, 1107-1115)." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "accept", note = "Anchor matches H:160; locator expanded to cover definitions." }]

[[entry]]
id = "rt.notation-spw09"
kind = "notation"
domain = "rt"
name = "Two-mode RT notation (Suleimanov, Potekhin, Werner 2009)"
statement = "Symbols of the SPW09 hydrostatic, two-mode transfer, energy-balance and temperature-correction equations. Index i = 1,2 labels the polarisation mode; mu = cos theta is the cosine of the angle between the photon direction and the surface normal n and takes values in [-1,1]."
symbols = [
  { sym = "\\theta", sym_source = "θ", aliases = ["\\theta_k", "theta^(i)", "θ"], meaning = "polar angle between the photon wave vector k and the local outward surface normal n; mu = cos theta (Pot12 theta_k is a folded incidence parameter: it equals theta for outgoing rays and pi - theta for incident rays)", meaning_source = "polar angle between photon wave vector k and surface normal n (μ = cos θ)", units = "rad" },
  { sym = "\\varphi_k", sym_source = "φ", aliases = ["\\varphi_{k}", "phi", "φ"], meaning = "azimuthal angle of the photon wave vector about the surface normal, measured from the plane containing B and the normal", meaning_source = "azimuthal angle (in the inclined-field version, between the projected B and k, as shown in Fig. 1)", units = "rad" },
  { sym = "\\theta_{Bn}", sym_source = "θ_Bn", aliases = ["Theta", "\\Theta_B", "\\theta_B^{(n)}", "θ_Bn"], meaning = "angle between the magnetic field B and the local surface normal n", meaning_source = "angle θ_B between magnetic field B and surface normal n", units = "rad" },
  { sym = "\\theta_{kB}", sym_source = "α_Bk", aliases = ["theta_B", "α_Bk", "θ_kB"], meaning = "angle between the photon wave vector k and the magnetic field B", meaning_source = "angle α between B and wave vector k (equals θ when B is along n); same quantity as θ_kB in VAL06", units = "rad" },
  { sym = "j", sym_source = "i", aliases = ["i", "j"], meaning = "normal-mode index, j = 1 extraordinary (X), j = 2 ordinary (O)", units = "1" },
  { sym = "I_\\nu^j", sym_source = "I_ν^i(μ,φ)", aliases = ["I^(j)_nu", "I_ν^i(μ,φ)", "I_ν^j(τ,±μ)"], meaning = "specific intensity in normal mode j (j = 1 X, 2 O) as a function of depth and direction; +mu outgoing, -mu ingoing", meaning_source = "specific intensity in mode i", units = "erg s^-1 cm^-2 Hz^-1 sr^-1" },
  { sym = "m", aliases = ["y", "y_col"], meaning = "column density (mass per unit area above the point), dm = -rho dz", meaning_source = "column density, dm = -ρ dz", units = "g cm^-2" },
  { sym = "\\rho", sym_source = "ρ", aliases = ["rho", "rho_gas", "ρ"], meaning = "mass density (TOV/EOS: gravitational mass density = energy density/c^2; atmosphere/opacity: plasma mass density, equal to it up to O(k_B T/(m_u c^2)))", meaning_source = "gas density", units = "g cm^-3" },
  { sym = "z_{vert}", sym_source = "z_vert", meaning = "vertical distance z in the atmosphere (SPW09)", units = "cm" },
  { sym = "P_g", aliases = ["P", "P(y)", "P_gas"], meaning = "gas pressure (electrons plus ions)", meaning_source = "gas pressure", units = "dyn cm^-2" },
  { sym = "g", sym_source = "g_surf", aliases = ["g_s", "g_surf"], meaning = "surface gravity (local proper) g = GM/(R^2 sqrt(1 - r_g/R)), taken uniform through the atmosphere", meaning_source = "surface gravitational acceleration GM_NS/(R_NS^2 sqrt(1-R_S/R_NS)) as used in the atmosphere (g in SPW09; same quantity as g_s in McPHAC)", units = "cm s^-2" },
  { sym = "g_{rad}", sym_source = "g_rad", meaning = "radiative acceleration", units = "cm s^-2" },
  { sym = "M", sym_source = "M_NS", aliases = ["M_NS"], meaning = "total gravitational stellar mass, M = M_R", units = "g" },
  { sym = "R", sym_source = "R_NS", aliases = ["R_NS"], meaning = "stellar (circumferential) radius", units = "cm" },
  { sym = "r_g", sym_source = "R_S", aliases = ["R_S"], meaning = "Schwarzschild radius 2GM/c^2 of the star", units = "cm" },
  { sym = "\\kappa^a_j", sym_source = "k_ν^i", aliases = ["k_ν^i", "kappa^abs_j", "kappa_a_j", "κ_j^abs", "κ_j^ff"], meaning = "true-absorption (free-free for fully ionised H) opacity of normal mode j; depends on direction through theta_kB", meaning_source = "true absorption opacity in mode i (depends on μ, φ)", units = "cm^2 g^-1" },
  { sym = "\\kappa^s_j", sym_source = "σ_ν^i", aliases = ["kappa_s_j", "κ_j^sc", "σ_ν^i"], meaning = "total scattering opacity out of normal mode j, kappa^s_{j1} + kappa^s_{j2}; depends on direction through theta_kB", meaning_source = "electron-scattering opacity out of mode i (depends on μ, φ)", units = "cm^2 g^-1" },
  { sym = "d\\kappa^s_{ji}/d\\Omega", sym_source = "σ_ν^ij(μ,φ;μ′,φ′)", meaning = "differential scattering opacity from mode j direction (mu',phi') into mode i direction (mu,phi); under SPW09 definitions dkappa^s_{ji}/dOmega = sigma_nu^{ij}/(2 pi), not sigma_nu^{ij} itself", units = "cm^2 g^-1 sr^-1" },
  { sym = "\\tau_\\nu^j", sym_source = "τ_ν^i", meaning = "optical depth in mode i, dτ_ν^i = (k_ν^i+σ_ν^i) dm", units = "1" },
  { sym = "S_\\nu^j", sym_source = "S_ν^i", aliases = ["S_ν^i", "S_ν^j(μ)"], meaning = "source function of normal mode j", meaning_source = "source function in mode i", units = "erg s^-1 cm^-2 Hz^-1 sr^-1" },
  { sym = "\\eta_\\nu^j", sym_source = "η_ν^i", meaning = "emissivity in mode i, per unit mass-column normalisation of eq. 10", units = "erg s^-1 g^-1 Hz^-1 sr^-1" },
  { sym = "H_\\nu", sym_source = "H_ν(m)", aliases = ["H_ν(m)"], meaning = "Eddington flux at column density m", units = "erg s^-1 cm^-2 Hz^-1" },
  { sym = "H_0", meaning = "σT_eff^4/(4π), the required Eddington flux integrated over frequency", units = "erg s^-1 cm^-2" },
  { sym = "\\varepsilon_H", sym_source = "ε_H(m)", meaning = "relative flux error 1 - H_0/∫H_ν dν", units = "1" },
  { sym = "\\varepsilon_\\Lambda", sym_source = "ε_Λ(m)", meaning = "energy-balance error as a function of depth", units = "erg s^-1 g^-1" },
  { sym = "\\Lambda^j_{\\nu,diag}", sym_source = "Λ^i_ν,diag", meaning = "diagonal element of the Λ operator for mode i, a function of the mean optical depth", units = "1" },
  { sym = "\\varpi_\\nu^j", sym_source = "α_ν^i", aliases = ["α_ν^i"], meaning = "scattering albedo of mode i from averaged opacities, σ̄/(k̄+σ̄)", units = "1" },
  { sym = "\\Delta T_\\Lambda", sym_source = "ΔT_Λ", meaning = "temperature correction from the integral Λ-iteration", units = "K" },
  { sym = "E_V", sym_source = "E_V(ρ)", aliases = ["E_V (VAL06)", "E_V(ρ)"], meaning = "photon energy of the vacuum resonance (plasma and vacuum contributions to the dielectric tensor cancel) at given B and rho", meaning_source = "photon energy of the vacuum resonance at given B and ρ", units = "keV" },
  { sym = "E_{ci}", sym_source = "E_ci", aliases = ["E_Bi", "E_ci", "E_{Bi}"], meaning = "ion cyclotron energy hbar omega_ci = hbar Z e B/(A m_u c) = 0.635 (Z/A) B_14 keV", meaning_source = "ion cyclotron energy, 0.635 keV (B/10^14 G)(Z/A)", units = "keV" },
]
conflicts_with = ["const.notation-atomic", "const.notation-fundamental", "eos.notation-bsk-fit", "gr.notation-geometry", "gr.notation-pechenick", "obs.notation-rxj1856-photometry", "obs.notation-rxj1856-spectral", "opacity.notation-modes-polarization", "opacity.notation-opacity-symbols", "opacity.notation-particles-plasma", "rt.notation-cond-emissivity-fit", "rt.notation-cond-energies-geometry", "rt.notation-cond-matter-dielectric", "rt.notation-mcphac", "surface.notation-geometry"]
adopted = true
adopted_syms = ["theta", "rho", "j", "eta", "g", "H"]
conflict_notes = ["alpha: Bel02 emission angle keeps \\alpha. Renamed: Pech83 polar-cap radius -> \\theta_{cap}; CODATA/PLCH04 fine-structure -> \\alpha_f; PC03/PLCH04 cyclic polarisation index -> \\alpha_{pol}; Kaplan11 optical index -> \\alpha_{opt}; SPW09 B-k angle -> \\theta_{kB}; SPW09 albedo -> \\varpi_\\nu^j; GH83 pole-to-sight angle -> \\psi_{pole}; Pot12 incident/reflected k-B angles -> \\theta_{kB}^{(i)}, \\theta_{kB}^{(r)}, \\theta_{kB}^{(min)}.", "phi: Bel02 surface-element azimuth about the line of sight keeps \\phi. Pech83 orbit-plane azimuth -> \\phi_{orb}; SPW09/Pot12 photon azimuth about the normal -> \\varphi_k; GH83 rotation phase -> \\phi_{rot}.", "theta: RT ray angle to the surface normal keeps \\theta (mu = cos theta). Schwarzschild polar coordinate (Bel02, Pech83) -> \\theta_{Sch}; GH83 line-of-sight colatitude -> \\theta_{los}; Pot12 theta_k merged into \\theta.", "theta_B: Magnetic colatitude keeps \\theta_B. PC03/PLCH04 k-B angle -> \\theta_{kB}; SPW09/Pot12/Ho07 field-normal angle -> \\theta_{Bn}.", "rho: Mass density keeps \\rho. McPHAC albedo rho_nu -> \\varpi_\\nu.", "k: McPHAC k_nu (B = 0 total opacity) keeps k_\\nu. SPW09 k_nu^i (mode absorption) -> \\kappa^a_j; CODATA k -> k_B.", "sigma: sigma is a cross section (cm^2). CODATA Stefan-Boltzmann sigma -> \\sigma_{SB}; SPW09 scattering opacity sigma_nu^i -> \\kappa^s_j, differential sigma_nu^ij -> d\\kappa^s_{ji}/d\\Omega.", "j: j is the normal-mode index (1 = X, 2 = O). McPHAC angle-node index j -> q; Pot12 linear-polarisation index j -> l (m -> l'), Pot12 mode index M -> j.", "eta: eta is an emissivity (\\eta_\\nu^j). BSk exp(H)-1 -> \\eta_{\\mathcal{H}}; vAL05/PLCH04 longitudinal dielectric element -> \\varepsilon_\\parallel.", "g: g is surface gravity. vAL05/PLCH04 gyrotropic dielectric element g -> \\varepsilon_\\wedge (PHC16 spelling); transverse element epsilon -> \\varepsilon_\\perp.", "H: H_nu is the Eddington flux. BSk pseudo-enthalpy H -> \\mathcal{H}."]
source = "suleimanov_potekhin_werner_2009_mag_atm"
locator = "Sect. 2, eqs. 1-25"
anchor = "the specific intensity in mode i, Pg is the gas pressure, and"
ocr = "good"
status = "blessed"
notes = "The paper does not say which of i=1,2 is X or O in Sect. 2; VAL06 eq. 21 text assigns j=1 to X and j=2 to O for the K_j labelling. Units of eta and eps_Lambda are inferred from the equations (not printed in the paper); the paper prints g cm^-2 for m and cm^2 g^-1 for opacities (Figs. 2-4). sigma in eq. 18 is the Stefan-Boltzmann constant (not named in text)."
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "fix", note = "Units of eta and eps_Lambda per S:223-230, 463-470; phi defined between projected B and k as in Fig. 1 (text at S:111-112 says n; Fig. 1 governs)." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "accept", note = "Anchor matches S:138; emissivity/energy-error units and Fig. 1 phi confirmed." }]

[[entry]]
id = "rt.notation-val"
kind = "notation"
domain = "rt"
name = "Two-mode RT with vacuum conversion notation (van Adelsberg & Lai 2006)"
statement = "Symbols of the VAL06 mode transfer equation, flux constraints and source function. j labels the photon mode; mu = k.z >= 0 with +/-mu denoting outgoing/ingoing; tau is the Thomson optical depth."
symbols = [
  { sym = "\\tau_T", sym_source = "τ", aliases = ["τ"], meaning = "Thomson optical depth, dτ = -ρ κ_T dz", units = "1" },
  { sym = "\\kappa_T", sym_source = "κ_T", meaning = "Thomson scattering opacity, 0.4 cm^2 g^-1", units = "cm^2 g^-1" },
  { sym = "I_\\nu^j", sym_source = "I_ν^j(τ,±μ)", aliases = ["I^(j)_nu", "I_O", "I_X", "I_ν^i(μ,φ)", "I_ν^j(τ,±μ)"], meaning = "specific intensity in normal mode j (j = 1 X, 2 O) as a function of depth and direction; +mu outgoing, -mu ingoing", meaning_source = "specific intensity of mode j, outgoing (+μ) or ingoing (-μ)", units = "erg s^-1 cm^-2 Hz^-1 sr^-1" },
  { sym = "\\kappa_j", sym_source = "κ_j^tot", aliases = ["kappa_j", "κ_j^tot"], meaning = "total extinction opacity of normal mode j, kappa^a_j + kappa^s_j", meaning_source = "total opacity of mode j, κ_j^ff + κ_j^sc", units = "cm^2 g^-1" },
  { sym = "\\kappa^s_j", sym_source = "κ_j^sc", aliases = ["κ_j^sc"], meaning = "total scattering opacity out of normal mode j, kappa^s_{j1} + kappa^s_{j2}; depends on direction through theta_kB", units = "cm^2 g^-1" },
  { sym = "\\kappa^s_{jj'}", sym_source = "κ_ji^sc", aliases = ["κ_ji^sc"], meaning = "scattering opacity kappa^s_{jj'} from mode j into mode j'", units = "cm^2/g" },
  { sym = "\\kappa^a_j", sym_source = "κ_j^abs", aliases = ["k_ν^i", "kappa^abs_j", "kappa_a_j", "κ_j^abs", "κ_j^ff"], meaning = "true-absorption (free-free for fully ionised H) opacity of normal mode j; depends on direction through theta_kB", meaning_source = "absorption (free-free) opacity of mode j as used in the radiative-equilibrium constraint", units = "cm^2 g^-1" },
  { sym = "S_\\nu^j", sym_source = "S_ν^j(μ)", aliases = ["S_ν^i", "S_ν^j(μ)"], meaning = "source function of normal mode j", meaning_source = "source function of mode j", units = "erg s^-1 cm^-2 Hz^-1 sr^-1" },
  { sym = "J_\\nu^j", sym_source = "J_ν^j", meaning = "mean intensity of mode j, (1/2)∫_0^1 dμ [I(μ)+I(-μ)]", units = "erg s^-1 cm^-2 Hz^-1 sr^-1" },
  { sym = "u_\\nu^j", sym_source = "u_ν^j", meaning = "specific energy density of mode j, (2π/c)∫_-1^1 dμ′ I_ν^j(μ′)", units = "erg cm^-3 Hz^-1" },
  { sym = "F_{ph}", sym_source = "F_rad", aliases = ["F_rad"], meaning = "local radial photon energy flux density at the stellar surface", meaning_source = "constant radiative flux", units = "erg cm^-2 s^-1" },
  { sym = "\\sigma_{SB}", sym_source = "σ_sb", aliases = ["sigma_SB", "σ", "σ_SB", "σ_sb"], meaning = "Stefan-Boltzmann constant", meaning_source = "Stefan-Boltzmann constant (F_rad = σ_sb T_eff^4)", units = "erg cm^-2 s^-1 K^-4", units_source = "erg s^-1 cm^-2 K^-4" },
  { sym = "P_g", sym_source = "P_gas", aliases = ["P", "P(y)", "P_gas"], meaning = "gas pressure (electrons plus ions)", meaning_source = "pressure of electrons and ions (P in VAL06 eq. 7)", units = "dyn cm^-2" },
  { sym = "E", aliases = ["E_{ph}"], meaning = "photon energy hbar omega", meaning_source = "photon energy", units = "keV" },
  { sym = "\\theta_{kB}", sym_source = "θ_kB", aliases = ["theta_B", "α_Bk", "θ_kB"], meaning = "angle between the photon wave vector k and the magnetic field B", meaning_source = "angle between the magnetic field and the direction of photon propagation", units = "rad" },
]
