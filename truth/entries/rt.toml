[[entry]]
id = "rt.notation-vacuum"
v1_ref = "archive/v1/src/atmosphere/magnetic_atmosphere.jl:71"
kind = "notation"
domain = "rt"
name = "Vacuum-resonance notation (van Adelsberg & Lai 2006)"
statement = "Symbols of the vacuum-polarisation resonance and partial mode conversion: resonance energy and density, adiabatic energy, jump probability, ion and electron cyclotron energies and the scaled variables used in their formulae."
symbols = [
  { sym = "E_V", sym_source = "E_V (VAL06)", aliases = ["E_V (VAL06)", "E_V(ρ)"], meaning = "photon energy of the vacuum resonance (plasma and vacuum contributions to the dielectric tensor cancel) at given B and rho", meaning_source = "photon energy at which plasma and vacuum contributions to the dielectric tensor cancel (vacuum resonance)", units = "keV" },
  { sym = "\\rho_V", sym_source = "ρ_V", aliases = ["rho_V", "ρ_V"], meaning = "density at which a photon of energy E meets the vacuum resonance", units = "g cm^-3" },
  { sym = "E_{ad}", sym_source = "E_ad", meaning = "adiabatic energy; resonant conversion occurs when E >~ E_ad", units = "keV" },
