[[entry]]
id = "rt.mode-stokes-relations-val"
kind = "equation"
domain = "rt"
name = "Mode intensities from Stokes parameters and back (VAL06)"
statement = "Away from the vacuum resonance, neglecting dissipative terms in the dielectric tensor, the mode intensities follow from Stokes I, Q, V and the mixing angle theta_m; conversely the Stokes parameters follow from the mode intensities with a random phase difference Delta phi between the modes, so Q, U, V need phase sampling while the mode intensities do not."
latex = "I_\\nu^{\\pm} = \\tfrac{1}{2}\\left[I_\\nu \\pm (\\cos2\\theta_m Q_\\nu+\\sin2\\theta_m V_\\nu)\\right], \\quad I_\\nu = I_\\nu^{+}+I_\\nu^{-}, \\quad Q_\\nu = \\cos2\\theta_m(I_\\nu^{+}-I_\\nu^{-}) - 2\\sin2\\theta_m(I_\\nu^{+}I_\\nu^{-})^{1/2}\\cos\\Delta\\phi, \\quad U_\\nu = -2(I_\\nu^{+}I_\\nu^{-})^{1/2}\\sin\\Delta\\phi, \\quad V_\\nu = \\sin2\\theta_m(I_\\nu^{+}-I_\\nu^{-}) + 2\\cos2\\theta_m(I_\\nu^{+}I_\\nu^{-})^{1/2}\\cos\\Delta\\phi"
source = "van_adelsberg_lai_2006_magnetic_atm"
locator = "eqs. 43-47"
anchor = "Conversely, given the mode intensities, the Stokes"
anchor_tex = "I_{\\nu}^{\\pm}={1\\over 2}\\left[I_{\\nu}\\pm\\left(\\cos 2\\theta_m Q_{\\nu} + \\sin 2\\theta_m V_{\\nu}\\right)\\right]"
ocr = "good"
provenance = "derivable"
ownership = "stub"
status = "blessed"
depends_on = ["rt.two-mode-transfer-val"]
notes = "cos theta_m = K_+/sqrt(1+K_+^2), sin theta_m = 1/sqrt(1+K_+^2) (text after eq. 42). Delta phi = Delta phi_i + (omega/c)∫(n_+ - n_-)dz with random initial Delta phi_i. For the thermal-emission use case, averaging over Delta phi gives Q_nu = cos2theta_m(I+ - I-), U = 0."
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "fix", note = "Statement qualified: neglecting dissipative terms in the dielectric tensor (V:615-622). Eqs. 43-47 match V:624-638." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "accept", note = "Anchor matches V:627; dissipation qualification V:615-622; Eqs. 43-47 signs and factors match V:624-638." }]

