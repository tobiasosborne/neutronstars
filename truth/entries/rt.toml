locator = "Sects. 2-3.1, eqs. 6-9, 30-34"
anchor = "is the Thomson scattering opacity, τ is the Thomson optical"
ocr = "good"
status = "blessed"
notes = "The paper writes mu (U+00B5) for the cosine; project canonical symbol is the Greek mu of rt.notation-mcphac. Energies are in keV as printed. VAL06 g (surface gravity) is the same quantity as g_s (McPHAC) and g (SPW09)."
