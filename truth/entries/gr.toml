# Domain gr: harvested from pechenick_1983, beloborodov_2002, potekhin_pons_page_2015. All entries proposed.

[[entry]]
id = "gr.notation-geometry"
kind = "notation"
domain = "gr"
name = "Geometry and orbit symbols (Beloborodov 2002)"
statement = "Symbols for the Schwarzschild exterior, photon orbit, emission angle and visible-surface geometry as used in Beloborodov (2002)."
symbols = [
  { sym = "r_g", aliases = ["R_S"], meaning = "Schwarzschild radius 2GM/c^2 of the star", units = "cm" },
  { sym = "M", meaning = "total gravitational stellar mass, M = M_R", units = "g" },
  { sym = "R", meaning = "stellar (circumferential) radius", units = "cm" },
  { sym = "r", meaning = "radial coordinate measured from the stellar centre (areal radius)", units = "cm" },
  { sym = "t", meaning = "Schwarzschild coordinate time", units = "s" },
  { sym = "\\theta_{Sch}", sym_source = "theta", aliases = ["theta"], meaning = "Schwarzschild polar coordinate (orbit plane taken as theta = 90 deg)", units = "rad", units_source = "1" },
  { sym = "\\psi", sym_source = "psi", meaning = "polar angle of the photon position in its orbit plane, measured from the escape direction (psi = 0 at infinity); for a surface point, the polar angle of the emission point measured from the direction to the observer", units = "rad", units_source = "1" },
  { sym = "\\alpha", sym_source = "alpha", aliases = ["alpha", "delta"], meaning = "emission angle: angle between the photon direction and the local radial direction (surface normal), measured by the local static observer at the emission point", meaning_source = "emission angle: angle between the photon velocity and the local radial direction, measured by the local observer at the emission point", units = "rad", units_source = "1" },
  { sym = "\\beta", sym_source = "beta", meaning = "bending angle beta = psi - alpha", units = "rad", units_source = "1" },
  { sym = "b", sym_source = "b (impact)", aliases = ["b (impact)"], meaning = "impact parameter of the photon orbit", units = "cm" },
  { sym = "\\cos\\psi", sym_source = "mu (cos psi)", aliases = ["mu (cos psi)"], meaning = "mu = cos psi", units = "1" },
  { sym = "\\cos\\psi_{vis}", sym_source = "mu_v", aliases = ["mu_v"], meaning = "critical value of mu = cos psi at which the emission is tangential (alpha = 90 deg); surface points with mu < mu_v are invisible (single-image regime R > 2 r_g only; compact stars with R < 2 r_g or R < 3 GM/c^2 show multiple images)", units = "1" },
  { sym = "x_g", sym_source = "u (r_g/R)", aliases = ["u", "u (r_g/R)"], meaning = "compactness r_g/R = 2GM/(c^2 R) at the stellar surface", meaning_source = "compactness u = r_g/R at the stellar surface", units = "1" },
  { sym = "\\lambda_{aff}", sym_source = "lambda", aliases = ["lambda"], meaning = "affine parameter along the photon orbit (normalisation source-specific: Bel02 lambda -> r as r -> infinity; Pech83 eq. 2.2)", meaning_source = "affine parameter along the photon orbit (lambda = r as r -> infinity)", units = "cm" },
  { sym = "k^\\mu", sym_source = "u^k", aliases = ["u^k", "v^mu"], meaning = "photon tangent four-vector dx^mu/dlambda_aff (normalisation source-specific: Bel02 u_t = 1; Pech83 eq. 2.2)", meaning_source = "photon four-velocity u^k = dx^k/dlambda, x^k = (t, r, theta, psi)", units = "s cm^-1 for u^t; 1 for u^r; cm^-1 for u^psi (t in s, lambda in cm; source normalisation u_t = 1 is source-specific, conversion to the adopted metric convention unspecified)" },
  { sym = "D", aliases = ["d"], meaning = "distance from the observer to the star (D >> R)", meaning_source = "distance of the observer from the star (D >> R)", units = "cm" },
  { sym = "\\phi", sym_source = "phi", aliases = ["phi"], meaning = "azimuthal angle of a surface element about the observer direction D", units = "rad", units_source = "1" },
  { sym = "S_{vis}", sym_source = "S_v", aliases = ["S_v"], meaning = "visible area of the stellar surface", units = "cm^2" },
]
conflicts_with = ["colour.notation-cie-cmf", "const.notation-atomic", "const.notation-particles", "eos.notation-electron-gas", "gr.notation-pechenick", "obs.notation-rxj1856-photometry", "opacity.notation-fields", "opacity.notation-modes-polarization", "opacity.notation-particles-plasma", "opacity.notation-photon-cyclotron", "rt.notation-cond-emissivity-fit", "rt.notation-cond-energies-geometry", "rt.notation-mcphac", "rt.notation-spw09", "rt.notation-vacuum", "surface.notation-geometry"]
adopted = true
adopted_syms = ["alpha", "phi", "b", "M", "beta"]
conflict_notes = ["alpha: Bel02 emission angle keeps \\alpha. Renamed: Pech83 polar-cap radius -> \\theta_{cap}; CODATA/PLCH04 fine-structure -> \\alpha_f; PC03/PLCH04 cyclic polarisation index -> \\alpha_{pol}; Kaplan11 optical index -> \\alpha_{opt}; SPW09 B-k angle -> \\theta_{kB}; SPW09 albedo -> \\varpi_\\nu^j; GH83 pole-to-sight angle -> \\psi_{pole}; Pot12 incident/reflected k-B angles -> \\theta_{kB}^{(i)}, \\theta_{kB}^{(r)}, \\theta_{kB}^{(min)}.", "lambda: Wavelength keeps \\lambda. Bel02/Pech83 affine parameter -> \\lambda_{aff}.", "phi: Bel02 surface-element azimuth about the line of sight keeps \\phi. Pech83 orbit-plane azimuth -> \\phi_{orb}; SPW09/Pot12 photon azimuth about the normal -> \\varphi_k; GH83 rotation phase -> \\phi_{rot}.", "theta: RT ray angle to the surface normal keeps \\theta (mu = cos theta). Schwarzschild polar coordinate (Bel02, Pech83) -> \\theta_{Sch}; GH83 line-of-sight colatitude -> \\theta_{los}; Pot12 theta_k merged into \\theta.", "mu: RT direction cosine keeps \\mu. Bel02 mu = cos psi -> \\cos\\psi; PY01 chemical potential -> \\mu_e; PC03 reduced mass -> \\mu_{red}.", "b: Impact parameter keeps b. Relativistic field parameter B/B_Q -> b_{rel}.", "u: Bare u retired. CODATA atomic mass unit -> m_u; Bel02 compactness -> x_g; Pech83 M/r -> u_{geo}; PC03 hbar omega/kT -> u_{kT}.", "M: M is the gravitational mass in g. Pech83 geometric-unit M -> GM/c^2; Pot12 mode label M -> j.", "S: S_nu is the source function. Bel02 visible area S_v -> S_{vis}; VAL06 stimulated-emission factor S -> S_{stim}.", "beta: Bel02 bending angle keeps \\beta. PC03 beta_e, beta_p -> \\zeta_e, \\zeta_p (PHC16 spelling); PLCH04 mode parameter -> \\beta_{pol}; GH83 beta (magnetic colatitude) -> \\theta_B."]
source = "beloborodov_2002_ray_tracing"
locator = "Sect. 1-3 and Appendix"
anchor = "Here rg = 2GM/c2 is the Schwarzschild radius of"
ocr = "good"
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "fix", note = "[Beloborodov:228–233](/home/tobias/Projects/neutronstars/refs/beloborodov_2002_ray_tracing.txt:228): with declared \\(t[\\mathrm{s}]\\), \\(\\lambda[\\mathrm{cm}]\\), correct \\(u^t\\) units to `\"s cm^-1\"`; document conversion of the source's component normalization." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "accept", note = "Definitions match [Beloborodov:38–49](/home/tobias/Projects/neutronstars/refs/beloborodov_2002_ray_tracing.txt:38), [228–265](/home/tobias/Projects/neutronstars/refs/beloborodov_2002_ray_tracing.txt:228). Corrected component units are dimensionally consistent; source normalization is explicitly left unconverted." }]
notes = "Project convention adopted: Beloborodov/Potekhin CGS-style symbols (r_g = 2GM/c^2 explicit, M in grams, u = r_g/R). Pechenick uses geometric units G=c=1 (M means GM/c^2, u = M/r); convert on use. Symbol strings b, mu, u, xi, M are qualified in parentheses where the bare symbol collides with other domains (opacity b, eos mu, opacity/const u, eos xi) or with Pechenick geometric units; the bare paper symbol is the unqualified part. Same-concept symbols (r, R, M, M_r, r_g) reuse the meaning strings of eos.notation-structure verbatim so that no spurious conflict is raised; if that entry is reworded, reword these in step. Units are assigned by this database. In this paper b = u_psi with u_t = 1. Index positions of u_t, u_psi were read off the PDF image since the text layer drops sub/superscripts. [2026-10-23 notation pass: sym strings are now the project spellings of truth/NOTATION_DECISIONS.md; the parenthesis qualifiers and u = r_g/R described above survive only in sym_source (compactness is x_g, impact parameter b, cos psi is no longer written mu).]"

[[entry]]
id = "gr.notation-radiation"
kind = "notation"
domain = "gr"
name = "Intensity and flux symbols (Beloborodov 2002)"
statement = "Symbols for surface intensity, observed intensity, frequencies, surface element and solid angle in Beloborodov (2002) Sect. 3 and Appendix."
symbols = [
  { sym = "I_0", meaning = "surface radiation intensity at the emission point as a function of emission angle alpha (emitter frame); the paper relates it to the observed I through I/nu^4 = I_0/nu_0^4", units = "erg s^-1 cm^-2 sr^-1 (inferred frequency-integrated, from the I/nu^4 scaling)" },
  { sym = "I^\\infty", sym_source = "I", aliases = ["I"], meaning = "observed intensity at the observer (at infinity) corresponding to I_0", units = "erg s^-1 cm^-2 sr^-1 (inferred, as I_0)" },
  { sym = "\\nu^\\infty", sym_source = "nu (observer)", aliases = ["nu (observer)"], meaning = "photon frequency measured at the observer (at infinity)", units = "Hz" },
  { sym = "\\nu", sym_source = "nu_0", aliases = ["nu", "nu (I_nu)", "nu_0", "nu_loc"], meaning = "photon frequency in the local rest frame of the emitting plasma (static frame at the surface for a non-rotating star)", meaning_source = "photon frequency measured at the emission point by the local observer", units = "Hz" },
  { sym = "dS", aliases = ["dΣ"], meaning = "proper surface element of the stellar surface, dS = R^2 d(cos psi) d phi", meaning_source = "surface element of the star, dS = R^2 dmu dphi", units = "cm^2" },
  { sym = "d\\Omega", sym_source = "dOmega", meaning = "solid angle subtended by dS on the observer sky, dOmega = b db dphi / D^2", units = "sr" },
  { sym = "dF", meaning = "observed flux from the surface element dS, dF = I dOmega", units = "erg s^-1 cm^-2 (frequency-integrated)" },
]
conflicts_with = ["obs.notation-rxj1856-timing"]
adopted = true
adopted_syms = ["nu"]
conflict_notes = ["nu: nu is a photon frequency. Spin frequency -> \\nu_{spin}."]
source = "beloborodov_2002_ray_tracing"
locator = "Appendix, eq. 11 and text above it"
anchor = "I = (1 − rg /R)2 I0 [I and I0 are related through I/ν 4 = I0 /ν04"
ocr = "good"
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "accept", note = "[Beloborodov:260–270](/home/tobias/Projects/neutronstars/refs/beloborodov_2002_ray_tracing.txt:260) supports the definitions; inferred bolometric interpretation is explicitly identified." }]
notes = "Project convention adopted: Beloborodov/Potekhin CGS-style symbols (r_g = 2GM/c^2 explicit, M in grams, u = r_g/R). Pechenick uses geometric units G=c=1 (M means GM/c^2, u = M/r); convert on use. The assignment of nu to the observer and nu_0 to the emitter, and the frequency-integrated nature of I, are inferred from context (I observed = (1-r_g/R)^2 I_0 and nu/nu_0 = (1-r_g/R)^(1/2) < 1); the paper states neither explicitly."

