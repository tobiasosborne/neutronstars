# truth/entries/const.toml -- CODATA 2018 recommended values (Tiesinga et al. 2021).
# All values SI as printed in Table XXXI (non-SI units: Table XXXIV). value/uncertainty strings follow the printed
# table: '(NN)' is the standard uncertainty in the last digits of the value; 'exact' = no uncertainty;
# an ellipsis marks an exact quantity whose printed digits are truncated. CGS conversion is left to the code
# (the source states no CGS factors).

