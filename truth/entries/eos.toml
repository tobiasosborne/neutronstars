  { sym = "\\Lambda", sym_source = "Lambda(r)", aliases = ["Lambda", "Lambda(r)"], meaning = "metric function Lambda(r): g_rr = e^(2 Lambda)", meaning_source = "metric function in g_rr = exp(2 Lambda) = 1 - 2 G M_r /(c^2 r) (as printed in PPP15 eq. 1)", units = "1" },
  { sym = "P", meaning = "pressure", units = "dyn cm^-2" },
