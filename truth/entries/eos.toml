# Domain "eos": TOV structure, surface gravity/redshift, BSk analytic EOS fits, BSk benchmarks,
# electron-gas pressure. Harvested from refs/ only. All status = proposed.
# NOTE: refs/potekhin_chabrier_2001_eos.pdf is actually Potekhin & Yakovlev, A&A 374, 213 (2001)
# "Thermal structure and cooling of neutron stars with magnetized envelopes" (arXiv:astro-ph/0105261).
# Entries citing it are tagged accordingly in notes.

# ---------------------------------------------------------------- notation
[[entry]]
