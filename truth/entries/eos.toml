notes = "Symbols r, R, M_r, M, r_g, Phi, Lambda, P, rho, G, c from PPP15 pp. 4-5; g from PY01 p. 3 (surface gravity); T_s, L, and the superscript-inf quantities from PPP15 eq. 40 (p. 41). rho is explicitly the gravitational mass density, not the rest-mass density. [r1 fix applied, per-symbol re-source recorded here because check.py has no per-symbol source field] T_s^\\infty: T_s^inf = T_s sqrt(1 - r_g/R) (sqrt sign dropped by the text layer), refs/potekhin_yakovlev_2001_cooling.txt L227-233, verbatim \"Ts∞ = Ts 1 − rg /R\"."

