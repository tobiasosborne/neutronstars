  { sym = "G", meaning = "gravitational constant", units = "cm^3 g^-1 s^-2" },
  { sym = "c", meaning = "speed of light", units = "cm s^-1" },
  { sym = "T_s", meaning = "local effective surface temperature in the local reference frame at the stellar surface", units = "K" },
  { sym = "T_s^\\infty", sym_source = "T_s^inf", meaning = "redshifted (apparent) surface temperature as seen by a distant observer", units = "K" },
  { sym = "L_{ph}", sym_source = "L", aliases = ["L", "L_ph"], meaning = "photon luminosity in the local reference frame at the stellar surface", meaning_source = "luminosity in the local reference frame at the surface", units = "erg s^-1" },
  { sym = "L_{ph}^\\infty", sym_source = "L^inf", aliases = ["L^inf", "L_ph^inf", "L_ph^∞"], meaning = "apparent photon luminosity for a distant observer, L_ph^inf = (1 - r_g/R) L_ph", meaning_source = "redshifted (apparent) luminosity at infinity", units = "erg s^-1" },
  { sym = "R^\\infty", sym_source = "R^inf", aliases = ["R^inf", "R^∞", "R_inf", "R_infty"], meaning = "apparent radius of the star for a distant observer, R^inf = R/sqrt(1 - r_g/R) = R(1 + z_g)", meaning_source = "apparent radius for a distant observer", units = "cm" },
]
