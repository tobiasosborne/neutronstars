# ---------------------------------------------------------------- electron gas (Potekhin & Yakovlev 2001)
[[entry]]
id = "eos.electron-pressure-magnetised"
kind = "equation"
provenance = "derivable"
ownership = "stub"
domain = "eos"
name = "Pressure of the ideal magnetised degenerate electron gas"
statement = "Electron pressure of a magnetised Fermi gas expressed through the chemical potential mu and temperature T, as a sum over Landau levels n = 0..n_max of Fermi-Dirac integrals I_{1/2}(chi_n, tau_n); P_r and T_r are the relativistic units of pressure and temperature."
latex = 'P_e = P_r \frac{b\,\tau_0^{3/2}}{\sqrt{2}\,\pi^2}\sum_{n=0}^{n_{\max}} (2 - \delta_{n0})(1 + 2bn)^{1/4} I_{1/2}(\chi_n, \tau_n)'
source = "potekhin_yakovlev_2001_cooling"
locator = "eq. 12, p. 4"
anchor = "pressure can be expressed through the chemical potential"
anchor_tex = "P_r\\,{b \\tau_0^{3/2}\\over\\sqrt2\\pi^2}"
ocr = "poor"
status = "blessed"
image_verified = true
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "accept", note = "PDF Eq. 12 confirms the prefactor, tau_0^{3/2}, degeneracy factor, quarter power and integral arguments; notes correctly distinguish this from a complete hydrogen EOS." }]
depends_on = ["eos.notation-electron-gas", "eos.relativistic-units-pr-tr"]
notes = "Source is Potekhin & Yakovlev 2001 (file mislabelled potekhin_chabrier_2001_eos). Equation text layer is garbled; latex read off PDF page 4 image by harvester; reviewer must confirm. The I_{1/2} fit (Chabrier & Potekhin 1998) and the mu(rho, T, B) iterative procedure (Potekhin & Yakovlev 1996) are referenced, not given, in this paper. The paper's own use is the outer-envelope EoS (partially ionised iron treated via an effective charge): this is not a hydrogen-atmosphere EoS."

