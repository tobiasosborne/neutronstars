[[entry]]
id = "const.esu-from-coulomb"
kind = "definition"
domain = "const"
name = "Gaussian bridge adopted by the project: q[esu] = 10 c[m/s] q[C] (exact by project convention)"
statement = "The project adopts the Gaussian bridge q[esu] = 10 c[m s^-1] q[C] = c[cm s^-1]/10 q[C] as an exact definition of the statcoulomb (so 1 statC = 1/(10 c[m/s]) C). Printed evidence in NIST SP 811 App. B.8: 1 statC = 3.335 641 E-10 C (rounded, not boldface) and 1 abcoulomb = 1.0 E+01 C (exact)."
latex = 'q_{\mathrm{esu}} = 10\,c_{\mathrm{m\,s^{-1}}}\,q_{\mathrm C} = \frac{c_{\mathrm{cm\,s^{-1}}}}{10}\,q_{\mathrm C}'
units = "esu C^-1"
source = "nist_sp811_2008_si_guide"
locator = "App. B.8, statcoulomb row (txt l.3815); abcoulomb row (txt l.3167)"
anchor = 'statcoulomb ......................................................... coulomb (C) ......................................... 3.335 641 E−10'
ocr = "good"
status = "rejected"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "reject", note = "NIST anchor and locator match txt l.3815, but the exact relation is absent. The non-bold factor is rounded under txt l.2907-2908; the abcoulomb row does not supply the missing esu/emu relation. Surviving weaker statement: 1 statC ~ 3.335641e-10 C at NIST's printed precision. The notes' CODATA agreement was also numerically wrong (the 4.803204712413e-10 figure truncates hbar)." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "reject", note = "The rewrite correctly distinguishes NIST’s rounded evidence from project exactness, but identifying the exact project unit with **Gaussian statC** remains unsupported. [NIST txt L3815](/home/tobias/Projects/neutronstars/refs/nist_sp811_2008_si_guide.txt:3815), read with [L2907–2908](/home/tobias/Projects/neutronstars/refs/nist_sp811_2008_si_guide.txt:2907), supplies only a rounded conversion; PDF typography confirms this. **Surviving weaker statement:** `1 statC ≈ 3.335641e-10 C`. An exact project coordinate `q_proj := 10 c[m/s] q[C]` is definable, but its identification with Gaussian charge requires reconciliation with the existing Gaussian identities." }]
provenance = "convention"
ownership = "leaf"
depends_on = ["const.elementary-charge", "const.speed-of-light"]
notes = "NIST prints only the rounded factor 3.335 641 E-10 C/statC; it does NOT print the exact relation. Exactness of q[esu] = 10 c[m/s] q[C] is the project's convention, following from the definition of the statcoulomb, pending a printed source (Jackson appendix, manual). Printed evidence, verbatim from refs/nist_sp811_2008_si_guide.txt: 'statcoulomb ......................................................... coulomb (C) ......................................... 3.335 641 E−10' and 'abcoulomb ........................................................... coulomb (C) .................................................... 1.0 E+01' (1 abcoulomb = 10 C exact). Numeric check: 10 * 2.99792458e8 * 1.602176634e-19 = 4.803204712570263e-10 (esu per elementary charge under the bridge). Rounded-factor check (review r1): 1/(10 c) = 3.335640951981521e-10 vs printed 3.335641e-10; absolute error 4.80185e-18 < half-last-digit tolerance 5e-17: rounding-compatible, not a proof of exactness. The earlier claim that sqrt(alpha hbar c) = 4.803204712413e-10 agrees with this bridge is withdrawn: with hbar = h/(2 pi) (NIST 'Planck constant divided by 2π', txt l.1071) the Gaussian identity gives e = 4.803204713884971e-10 esu, relative difference -2.74e-10 from the bridge value, larger than u_r(e) = 7.5e-11 (reviewer, from CODATA 2018); the CODATA alpha-based route is not used as an agreement check here. Notation: use alpha_f for the fine-structure constant (alpha is the emission angle); esu and statC, Gs and G remain explicit unit aliases. Related printed factor: 1 statvolt = 2.997 925 E+02 V (txt l.3820); not entered separately. Rejected r2 (no round 3): the identification of the exact project unit with the Gaussian statC is unsupported by the local sources. Surviving weaker statement: `1 statC ≈ 3.335641e-10 C`. Work order: fetch a source that prints the exact relation (Jackson, Classical Electrodynamics, Appendix on units; manual download) and re-propose."

