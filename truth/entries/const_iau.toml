# truth/entries/const_iau.toml -- IAU exact length units, IAU 2015 B3 nominal solar conversion constants,
# and the SI -> Gaussian-CGS bridge. Primary anchors: Prsa et al. 2016 (arXiv:1605.09788), NIST SP 811 (2008).
# The iau.org resolution PDFs could not be fetched (JavaScript bot challenge page returned), so every IAU
# statement is anchored in Prsa 2016, which reproduces and cites the resolutions.
# Nominal values are conversion constants, not measurements.

