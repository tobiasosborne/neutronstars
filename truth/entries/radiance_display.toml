# ---------------------------------------------------------------- 1.8 Planck function

[[entry]]
id = "rt.planck-function-bnu"
kind = "equation"
domain = "rt"
name = "Planck function B_nu(T) (per unit frequency)"
statement = "Power emitted per unit area per steradian per unit frequency interval by a blackbody at temperature T, as a function of frequency nu: B_nu = (2 h nu^3 / c^2) / (exp[h nu / (k T)] - 1), with h the Planck constant, k the Boltzmann constant, c the speed of light. In Gaussian CGS B_nu has units erg s^-1 cm^-2 Hz^-1 sr^-1."
latex = 'B_\nu =\frac{2h\nu^3}{c^2}\frac{1}{\exp[h\nu/(kT)]-1}'
source = "marr_2011_planck_law"
locator = "eq. 2"
anchor = "emitted power per unit area per steradian per frequency interval."
anchor_tex = 'B_\nu =\frac{2h\nu^3}{c^2}\frac{1}{\exp[h\nu/(kT)]-1}.'
ocr = "good"
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "fix", note = "applied: anchor now the .txt quote at Marr:56 (grep -F count 1), TeX equation kept in anchor_tex, TeX prose anchor recorded in notes; deleted the unsupported photon-density-of-states derivation from notes; added bridge k -> k_B." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "accept", note = "Anchor matches [refs/marr_2011_planck_law.txt:56](/home/tobias/Projects/neutronstars/refs/marr_2011_planck_law.txt:56); eq. 2 at lines 58–61 matches every factor and exponent, independently confirmed against TeX:49. Unsupported derivation removed; \\(k\\to k_B\\) bridge applied." }]
provenance = "derivable"
ownership = "stub"
depends_on = ["const.planck", "const.boltzmann", "const.speed-of-light"]
notes = "The source prints the formula only, with no derivation (the earlier photon-density-of-states derivation was removed per review r1: unsupported by this source). TeX prose anchor (refs/marr_2011_planck_law.tex): 'This function is denoted $B_\\nu$, and is given as a function of frequency $\\nu$ by'. Stub: no code in this repo yet evaluates and tests it. Verification is the integral identity rt.planck-integral-stefan-boltzmann. In code evaluate with expm1 and assert h nu / kT > 0 and finite (fail loud on overflow, no clamp). sym_source: paper B_nu = project B_\\nu; h = Planck constant, k = Boltzmann constant. NOTATION BRIDGE (review r1): source k -> project k_B."

