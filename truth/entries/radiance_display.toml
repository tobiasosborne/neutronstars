notes = "REVIEW r1 APPLIED: anchor is Ho Sec. 6 .txt (grep -F count 1; the TeX line 1012 is in anchor_tex). Walter+2010 distance 123 +11/-15 pc (walter_2010_rxj1856_distance.txt:617-620) gives 17 x 11/140 = +1.336 and 17 x 15/140 = -1.821 km. Ho's earlier 30% radius allowance was itself distance uncertainty (Ho:354-357), so it is not added again (double-counting). Earlier TeX prose anchor: 'the radius is given assuming a distance $d_{140}=d/(140\\mbox{ pc})=1$'. NOTATION BRIDGES: Ho R^infty -> R_{em}^\\infty (not whole-star R^\\infty), d -> D. ARITHMETIC: 123/140 = 0.878571; 17 x 0.878571 = 14.9357 km (computed in python: 17*123/140 = 14.935714285714285). Distance 123 pc is obs.rxj1856-distance (Walter+2010). Same scaling of the blackbody column of Ho Table 1 (R^infty = 5.0 km at 140 pc): 5.0 x 123/140 = 4.39 km. ALTERNATIVE M1 INPUT (labelled by provenance, see pipeline.surface-parameters): the Chandra LETGS single-blackbody apparent temperature kT^infty = 63.5 +/- 0.2 eV (obs.rxj1856-xray-kt-chandra) and apparent radius R^infty = 4.4 +/- 0.1 km (d/120 pc) (obs.rxj1856-xray-rinf-chandra), equivalently R^infty/d = 36.7 +/- 0.8 km/kpc (obs.rxj1856-xray-bb-r-over-d); at 123 pc these give R^infty = 4.4 x 123/120 = 4.51 km, and 36.7 km/kpc x 0.123 kpc = 4.51 km (computed; 4.4*123/120 = 4.510, 36.7*0.123 = 4.514; consistent to 0.1%, within the rounding of both printed numbers). The Ho+2007 values are code output (provenance code, stub) and the Chandra blackbody values are measurements; they are different physical models (atmosphere vs blackbody, kT^infty = 37 eV is quoted by Ho Sec. 6 for the atmosphere versus 63.5 eV for the blackbody), not two measurements of one number. T^infty = 4.34e5 K is not rescaled: the atmosphere shape fit is distance independent in the Ho assumption set, but this is not independently verified here."
