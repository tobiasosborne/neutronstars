[[entry]]
id = "rt.planck-integral-stefan-boltzmann"
kind = "equation"
domain = "rt"
name = "Integral of B_nu over frequency equals sigma T^4 / pi"
statement = "A blackbody radiates, per unit area per steradian across the whole spectrum, sigma T^4 / pi, with sigma the Stefan-Boltzmann constant; the formula is obtained by integrating B_nu over all frequencies from zero to infinity. The 1/pi appears because the Stefan-Boltzmann law is the integral of intensity over solid angle."
latex = '\int_{0}^{\infty}{B_\nu \,d\nu} = {\sigma T^4 \over \pi}'
source = "marr_2011_planck_law"
locator = "eq. 9"
anchor = "frequencies, from zero to infinity, that is,"
anchor_tex = '\int_{0}^{\infty}{B_\nu \,d\nu} = {\sigma T^4 \over \pi}.'
ocr = "good"
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "fix", note = "applied: anchor now the .txt quote at Marr:240 (grep -F count 1), TeX equation kept in anchor_tex, TeX prose anchor in notes; flux explanation cites the printed F = sigma T^4 = pi int B_nu dnu (Marr:426); bridges sigma -> sigma_SB, k -> k_B recorded." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "accept", note = "Anchor and eq. 9 match [Marr:236–244](/home/tobias/Projects/neutronstars/refs/marr_2011_planck_law.txt:236), independently confirmed against TeX:138. Added flux relation is printed at [line 426](/home/tobias/Projects/neutronstars/refs/marr_2011_planck_law.txt:426); notation bridges applied." }]
provenance = "derivable"
ownership = "stub"
depends_on = ["rt.planck-function-bnu", "const.stefan-boltzmann", "const.planck", "const.boltzmann", "const.speed-of-light"]
notes = "TeX prose anchor (refs/marr_2011_planck_law.tex): 'This formula is obtained by integrating $B_\\nu$ over all frequencies, from zero to infinity, that is,'. Flux relation explicitly printed at Marr:426 (txt): F = sigma T^4 = pi int_0^inf B_nu dnu. NOTATION BRIDGE (review r1): source sigma -> project sigma_SB, source k -> k_B. Derivation: substitute x = h nu/(kT) in eq. 2: \\int B_nu dnu = (2 k^4 T^4 / (h^3 c^2)) \\int_0^inf x^3/(e^x - 1) dx = (2 k^4 T^4/(h^3 c^2)) pi^4/15; multiply by pi (Lambertian flux = pi B): sigma = 2 pi^5 k^4/(15 h^3 c^2). The Bose integral pi^4/15 is a mathematical identity, not printed in Marr & Wilkin. This equals the printed CODATA form sigma = (pi^2/60) k^4/(hbar^3 c^2) of const.stefan-boltzmann because hbar = h/(2 pi): (pi^2/60)(2 pi)^3 = 2 pi^5/15. NUMERIC CHECK (python decimal, 30 digits, SI, CODATA 2018 as in const.* entries: h = 6.626 070 15e-34 J s, k = 1.380 649e-23 J/K, c = 299 792 458 m/s): expected (const.stefan-boltzmann, CODATA 2018 Table XXXI as printed) sigma = 5.670 374 419e-8 W m^-2 K^-4 (digits truncated at the ellipsis); computed 2 pi^5 k^4/(15 h^3 c^2) = 5.670 374 419 184 43e-8; relative error +3.3e-11, tolerance 1e-10 (the printed value is truncated at 9 decimals so the unprinted digits 18... explain the residual exactly). Independent quadrature check: Simpson on [1e-9, 80] gives \\int x^3/(e^x-1) dx = 6.493939402266830, expected pi^4/15 = 6.493939402266828, error 1.8e-15, tolerance 1e-12; sigma recomputed from the quadrature = 5.6703744191844294e-8, identical to the closed form to all printed digits. Conversion to Gaussian CGS: 5.670374419e-8 W m^-2 K^-4 = 5.670374419e-5 erg cm^-2 s^-1 K^-4."

# ---------------------------------------------------------------- 1.12 display colour

[[entry]]
id = "colour.srgb-stokes-decode-power"
kind = "equation"
domain = "colour"
name = "sRGB decoding, power segment (Stokes eq. 1.7b), as printed"
statement = "Equation 1.7b of the proposal for the non-linear to linear sRGB inversion, transcribed as printed in srgb20.gif (condition) and srgb21.gif (equation). The condition is printed with the unprimed symbols R_sRGB, G_sRGB, B_sRGB > 0.03928. The equation is printed as three rows: R_sRGB = [(R'_sRGB + 0.055)/1.055]^2.4, G_sRGB = [(R'_sRGB + 0.055)/1.055]^2.4, B_sRGB = [(R'_sRGB + 0.055)/1.055]^2.4; that is, the G and B rows as printed contain R'_sRGB on the right-hand side, a typographical error of the source."
latex = 'R_{sRGB},G_{sRGB},B_{sRGB}>0.03928\ (\text{printed unprimed}):\quad R_{sRGB}=\left[\frac{R^\prime_{sRGB}+0.055}{1.055}\right]^{2.4},\ G_{sRGB}=\left[\frac{R^\prime_{sRGB}+0.055}{1.055}\right]^{2.4},\ B_{sRGB}=\left[\frac{R^\prime_{sRGB}+0.055}{1.055}\right]^{2.4}\ (\text{G and B rows printed with }R^\prime_{sRGB})'
source = "stokes_1996_srgb"
locator = "eq. 1.7b (srgb20.gif, srgb21.gif)"
anchor = "The reverse relationship is defined as follows;"
ocr = "poor"
image_verified = true
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "accept", note = "Anchor at Stokes:857 immediately precedes the reverse equations, 1.7b at 871-874; srgb20.gif and srgb21.gif show unprimed channels > 0.03928, R' in all three numerators, +0.055, 1.055, exponent 2.4. Correct as literal historical transcription with the editorial reading separated." }]
provenance = "convention"
ownership = "leaf"
depends_on = ["colour.srgb-decode-threshold", "colour.srgb-inverse-linear", "colour.srgb-stokes-encode-power", "colour.notation-srgb-nonlinear"]
notes = "Read off refs/data/stokes_1996_srgb_img/srgb21.gif at 5x magnification (217x141 px): all three rows read [(R'_sRGB + 0.055) / 1.055]^2.4, with the subscript sRGB and the prime on an R in every row (the G and B rows start with G_sRGB = and B_sRGB = but the numerator is R'). srgb20.gif (188x22 px) reads 'R_sRGB, G_sRGB, B_sRGB > 0.03928', all unprimed. The earlier colour.srgb-inverse-power was rejected for silently repairing this ('same for G,B'); colour.srgb-inverse-transfer-power for the same reason plus the primed condition. This entry repairs nothing. EDITORIAL READING (not printed, not in latex): the intended relation is per channel, C_sRGB = [(C'_sRGB + 0.055)/1.055]^2.4 for C in R, G, B, applied when the encoded value C'_sRGB > 0.03928. Numeric consistency of that reading with eq. 1.2 and 1.7a: encode threshold 12.92 x 0.00304 = 0.0392768 (expected 0.03928 as printed, error 3.2e-6, tolerance 5e-6 = half unit of the 5th decimal); decode at the threshold: 0.03928/12.92 = 0.0030402 (linear branch) vs [(0.03928+0.055)/1.055]^2.4 = 0.0030395 (power branch), expected equal to the encode threshold 0.00304, differences 2.5e-7 and 5.1e-7 respectively, i.e. continuous to about 1.7e-4 relative, which is the rounding of 0.03928. Decoding must apply the typographical correction explicitly and visibly (log it), and the unprimed printed condition must be read as a condition on the encoded value; both are interpretations. The linear segment (eq. 1.7a) is already blessed as colour.srgb-inverse-linear (srgb19.gif checked again here: G row G'/12.92 and B row B'/12.92, no typo). Thresholds are 1996 proposal values, not IEC 61966-2-1. REVIEW r1 CORRECTION (truth/reviews/radiance_display-r1.md, sRGB bullet): the 'srgb21.gif re-inspection' note on the two rejected entries colour.srgb-inverse-power (in colour_srgb.toml) and colour.srgb-inverse-transfer-power (in colour.toml), which claims srgb21.gif shows per-channel inputs, is wrong: the image shows R' in all three numerators, as this entry transcribes. Those entries were rejected for silently repairing the print; this entry preserves the printed error and does not make it an executable decoder. The source labels this proposal obsolete (Stokes:22)."

