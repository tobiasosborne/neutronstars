locator = "eq. 1 and eq. 5"
anchor = "where h and k are the Planck and Boltzmann constants and c is the speed of light."
anchor_tex = 'B_\lambda =\frac{2hc^2}{\lambda^5}\frac{1}{\exp[hc/(\lambda kT)]-1},'
ocr = "good"
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "fix", note = "applied: Jacobian stated with absolute differentials, B_lambda |d lambda| = B_nu |d nu|; anchor now the .txt quote at Marr:53 (grep -F count 1), TeX equation kept in anchor_tex, TeX prose anchor in notes; bridge k -> k_B." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "fix", note = "applied: notes sentence now reads |dnu| = c |dlambda|/lambda^2 (absolute differential), consistent with eq. 6. Eq. 1 matches [Marr:47–53](/home/tobias/Projects/neutronstars/refs/marr_2011_planck_law.txt:47) and TeX:42; the main statement’s absolute differentials are corrected. **Notes still omit one absolute value:** replace `|dnu| = c dlambda/lambda^2` with `|dnu| = c |dlambda|/lambda^2`, consistent with [eq. 6, lines 204–207](/home/tobias/Projects/neutronstars/refs/marr_2011_planck_law.txt:204)." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 3, verdict = "accept", note = "Round-2 correction fully applied: notes now give \\(\\lvert d\\nu\\rvert=c\\lvert d\\lambda\\rvert/\\lambda^2\\), consistent with [Marr eqs. 5–6, lines 192–207](/home/tobias/Projects/neutronstars/refs/marr_2011_planck_law.txt:192). Anchor matches line 53 byte-for-byte; formula matches [eq. 1, lines 47–53](/home/tobias/Projects/neutronstars/refs/marr_2011_planck_law.txt:47) and [TeX line 42](/home/tobias/Projects/neutronstars/refs/marr_2011_planck_law.tex:42). Supports Milestone 1 blackbody radiance." }]
