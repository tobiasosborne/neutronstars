statement = "Ho et al. 2007 give R^infty for the B = 4e12 G atmosphere fit as 17 km (d_140 = 1) and state that the radius is given assuming d = 140 pc; the fit is linear in distance (the apparent radius fixes the normalisation (R^infty/d)^2 at fixed T^infty, z_g, N_H). At the Walter+2010 distance d = 123 pc: R^infty(123 pc) = R^infty(140 pc) x 123/140 = 17 km x 123/140 = 14.94 km (14.935714... km). This is a fixed-model rescaling (fixed atmospheric gravity, T^infty, N_H; Ho Sec. 6 prints R^infty ~ 17 (d/140 pc) km), not a self-consistent refit at 123 pc. NOTATION: Ho's R^infty is written R_{em}^\\infty here to avoid colliding with the whole-star R^infty; d is written D. The T^infty = 4.34e5 K, z_g = 0.22 and N_H labels are not rescaled."
