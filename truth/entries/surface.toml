name = "One-dimensional (radial) heat-blanketing approximation"
statement = "Envelope thermal structure is computed in the 1D plane-parallel approximation with Fb = sigma_SB Ts^4 locally in the absence of neutrino energy losses in the envelope. It overestimates the heat-blanketing effect where the magnetic field is nearly tangential because heat then flows along field lines from hotter surface regions; for a dipole this is an equatorial band of width ~10 percent of the radius, which is also the coldest region, so its contribution to the total flux is negligible and the 1D approach reproduces the integrated observed flux. For magnetars with complex field geometry the 1D approach is not adequate and a 2D/3D treatment is required."
validity = "Reliable where the field lines make a substantial angle to the surface (Kaminker et al. 2012, 2014); predicts too low surface temperatures where the tangential field dominates; adequate for integrated flux of dipole fields."
