# ---------------------------------------------------------------- notation

[[entry]]
id = "opacity.notation-fields"
kind = "notation"
domain = "opacity"
name = "Magnetic-field scales and parameters"
statement = "Symbols for the magnetic field strength and its natural scales used by the magnetic opacity papers: the atomic field B_0, the QED critical field B_Q, the dimensionless ratios gamma_B and b, and the magnetic length."
symbols = [
  { sym = "B", meaning = "magnetic field strength", units = "G" },
  { sym = "B_{12}", sym_source = "B_12", aliases = ["B_12"], meaning = "magnetic field B/(10^12 G)", units = "1" },
  { sym = "B_{14}", sym_source = "B_14", aliases = ["B_14"], meaning = "local magnetic field strength B/(10^14 G)", meaning_source = "B / (10^14 G)", units = "1" },
  { sym = "B_0", meaning = "atomic magnetic field m_e^2 c e^3 / hbar^3 = 2.3505e9 G", units = "G" },
  { sym = "B_Q", meaning = "QED critical field m_e^2 c^3 / (e hbar) = 4.414e13 G (called B_r in PC03)", units = "G" },
  { sym = "\\gamma_B", sym_source = "gamma_B", meaning = "atomic field parameter B / B_0 (PHC16 writes gamma)", units = "1" },
  { sym = "b_{rel}", sym_source = "b_rel", aliases = ["b", "b_rel"], meaning = "relativistic field parameter b = B/B_Q = hbar omega_ce/(m_e c^2) = B_12/44.14", meaning_source = "relativistic field parameter b = B / B_Q = hbar omega_ce / (m_e c^2) (PLCH04 Appendix, PHC16 Sect. 2); the eos domain writes this symbol as b", units = "1" },
  { sym = "a_m", meaning = "magnetic length (hbar c/(eB))^(1/2) = lambda_e / sqrt(b)", units = "cm" },
]
conflicts_with = ["eos.notation-electron-gas", "gr.notation-geometry", "gr.notation-pechenick"]
adopted = true
adopted_syms = ["B"]
conflict_notes = ["b: Impact parameter keeps b. Relativistic field parameter B/B_Q -> b_{rel}.", "B: Magnetic field keeps B. Pech83 effective potential B^-2(r) -> \\mathcal{B}^{-2}(r)."]
source = "potekhin_chabrier_2003_ff_opacity"
locator = "p. 955 (Sect. 1) and p. 956"
anchor = "the field strength B is higher than B0 = m2e c e3 /~3 ="
ocr = "good"
status = "rejected"
reviews = [ {reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "reject", note = "anchor supports only B_0; B_14, gamma_B, b_rel, Compton-wavelength identity need separate anchored entries"} ]
notes = "Lai (2001, Eq. 1.3) uses b for B/B_0; this project uses gamma_B for B/B_0 and b_rel (paper symbol b) for B/B_Q, following PLCH04 and PHC16 (both define b = B/B_Q). [r1 fix applied, per-symbol re-source recorded here because check.py has no per-symbol source field] B_{14}: explicit definition B_14 = B/(1e14 G) (txt layer drops the superscript 14), also in rt.notation-vacuum, refs/van_adelsberg_lai_2006_magnetic_atm.txt L185, verbatim \"B14 = B/(10 G), and\". \\gamma_B: gamma = B/B_0 (source spelling gamma), refs/potekhin_ho_chabrier_2016_review.txt L120-121, verbatim \"γ ≡ B/B0 .\"."

