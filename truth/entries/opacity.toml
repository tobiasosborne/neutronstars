[[entry]]
id = "opacity.notation-photon-cyclotron"
kind = "notation"
domain = "opacity"
name = "Photon frequency and cyclotron/quantisation parameters"
statement = "Symbols for the photon frequency and the electron, proton and ion cyclotron frequencies together with the dimensionless quantisation parameters."
symbols = [
  { sym = "\\omega", sym_source = "omega", meaning = "photon angular frequency", units = "rad/s" },
  { sym = "\\nu", sym_source = "nu_loc", aliases = ["nu", "nu (I_nu)", "nu_0", "nu_loc"], meaning = "photon frequency in the local rest frame of the emitting plasma (static frame at the surface for a non-rotating star)", meaning_source = "photon frequency in cycles per second in the plasma frame, omega = 2 pi nu_loc (McPHAC symbol nu)", units = "Hz" },
  { sym = "u_{kT}", sym_source = "u_kT", aliases = ["u", "u_kT"], meaning = "hbar omega / (k_B T), scaled photon energy (paper symbol u; McPHAC: u = h nu / k_B T)", units = "1" },
  { sym = "\\omega_{ce}", sym_source = "omega_ce", aliases = ["omega_c", "omega_ce"], meaning = "electron cyclotron angular frequency omega_ce = eB/(m_e c) (Gaussian CGS)", meaning_source = "electron cyclotron angular frequency e B / (m_e c)", units = "s^-1", units_source = "rad/s" },
  { sym = "\\omega_{cp}", sym_source = "omega_cp", meaning = "proton cyclotron angular frequency (m_e/m_p) omega_ce", units = "rad/s" },
  { sym = "\\omega_{ci}", sym_source = "omega_ci", meaning = "ion cyclotron angular frequency Z e B / (m_i c)", units = "rad/s" },
  { sym = "\\zeta_e", sym_source = "beta_e", aliases = ["beta_e (PC03)", "zeta_e (PHC16)"], meaning = "electron quantisation parameter hbar omega_ce/(k_B T)", meaning_source = "hbar omega_ce / (k_B T), electron quantisation parameter (PHC16 writes zeta_e)", units = "1" },
  { sym = "\\zeta_p", sym_source = "beta_p", aliases = ["beta_p"], meaning = "hbar omega_cp / (k_B T), proton quantisation parameter", units = "1" },
  { sym = "\\zeta_i", sym_source = "zeta_i", meaning = "hbar omega_ci / (k_B T), ion quantisation parameter (PHC16)", units = "1" },
]
conflicts_with = ["const.notation-particles", "gr.notation-geometry", "gr.notation-pechenick", "opacity.notation-modes-polarization", "surface.notation-geometry"]
adopted = false
conflict_notes = ["u: Bare u retired. CODATA atomic mass unit -> m_u; Bel02 compactness -> x_g; Pech83 M/r -> u_{geo}; PC03 hbar omega/kT -> u_{kT}.", "beta: Bel02 bending angle keeps \\beta. PC03 beta_e, beta_p -> \\zeta_e, \\zeta_p (PHC16 spelling); PLCH04 mode parameter -> \\beta_{pol}; GH83 beta (magnetic colatitude) -> \\theta_B."]
source = "potekhin_chabrier_2003_ff_opacity"
locator = "eq. 1; eq. 41 (u = hbar omega/(k_B T)); proton quantisation beta_p < 1 discussion (L715-716)"
anchor = "where ωcp = (me /mp ) ωce is the proton cyclotron fre-"
ocr = "good"
status = "rejected"
reviews = [ {reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "reject", note = "anchor confirms only omega_cp; McPHAC frequency convention and PHC16 zeta_e/zeta_i need separate entries"} ]
notes = "PC03 beta_e and PHC16 zeta_e are the same quantity (PC03 eq. 1 gives 134.3 B12/T6, PHC16 eq. 2.13 gives 134.34 B12/T6). PHC16 p. 6 gives zeta_i = 0.0737 (Z/A) B12/T6 and PC03 p. 958 gives beta_p ~ 0.0732 B12/T6. [r1 fix applied, per-symbol re-source recorded here because check.py has no per-symbol source field] u_{kT}: u defined at PC03 eq. 41, refs/potekhin_chabrier_2003_ff_opacity.txt L659-664, verbatim \"1 − e−u Λffα , u ≡\". \\omega_{ci}: omega_ci = Z e B/(m_i c), refs/potekhin_ho_chabrier_2016_review.txt L332-333, verbatim \"ZeB/(mi c) is the ion cyclotron frequency\". \\zeta_p: proton-quantisation discussion; eq. 1/11 does not define beta_p, refs/potekhin_chabrier_2003_ff_opacity.txt L715-716, verbatim \"βp < 1, and obtain\". \\zeta_i: zeta_i = hbar omega_ci/(k_B T), refs/potekhin_ho_chabrier_2016_review.txt L332-333, verbatim \"ζi = h̄ωci /kB T = 0.0737 (Z/A)B12 /T6\"."

[[entry]]
id = "opacity.notation-modes-polarization"
kind = "notation"
domain = "opacity"
name = "Normal-mode and dielectric-tensor symbols"
statement = "Symbols for propagation geometry, polarisation index, normal-mode labels and vectors, and the plasma polarisability/dielectric tensor used for the two-mode opacity formalism."
symbols = [
  { sym = "\\theta_{kB}", sym_source = "theta_B", aliases = ["theta_B", "α_Bk", "θ_kB"], meaning = "angle between the photon wave vector k and the magnetic field B", meaning_source = "angle between photon propagation direction k and magnetic field B", units = "rad" },
  { sym = "\\alpha_{pol}", sym_source = "alpha_pol", aliases = ["alpha", "alpha_pol"], meaning = "basic polarisation index, 0 (linear along B) or +/-1 (circular in the transverse plane); PC03 and PLCH04 write alpha", units = "1" },
  { sym = "j", meaning = "normal-mode index, j = 1 extraordinary (X), j = 2 ordinary (O)", units = "1" },
  { sym = "\\mathbf{e}_j", sym_source = "e_j", meaning = "polarisation vector of normal mode j (unit complex vector)", units = "1" },
  { sym = "e_{j,\\alpha}", sym_source = "e_j_alpha", meaning = "cyclic component of e_j: e_{j,0} = e_{j,z}, e_{j,+/-1} = (e_{j,x} +/- i e_{j,y})/sqrt(2)", units = "1" },
  { sym = "K_j", meaning = "transverse polarisation parameter of mode j in the frame with z along k and B in the x-z plane", units = "1" },
  { sym = "K_{z,j}", sym_source = "K_z_j", meaning = "longitudinal polarisation parameter K_{z,j} of mode j", units = "1" },
  { sym = "\\beta_{pol}", sym_source = "beta_pol", aliases = ["beta", "beta_pol"], meaning = "mode polarisation parameter beta of PLCH04 Eq. 21 (not the quantisation parameter beta_e)", units = "1" },
  { sym = "\\varepsilon_\\perp", sym_source = "ε", aliases = ["ε", "epsilon"], meaning = "transverse diagonal element of the dielectric tensor I + 4 pi chi, frame z || B: eps_xx = eps_yy = eps_perp", meaning_source = "diagonal transverse element of I + 4 pi chi in the frame with z along B (PLCH04: epsilon; PHC16: epsilon_perp)", units = "1" },
  { sym = "\\varepsilon_\\wedge", sym_source = "g", aliases = ["g"], meaning = "off-diagonal (gyrotropic) element of the dielectric tensor I + 4 pi chi, frame z || B, with eps_xy = +i eps_wedge and eps_yx = -i eps_wedge (convention common to vAL05 and PLCH04)", meaning_source = "off-diagonal (gyrotropic) element of I + 4 pi chi (PLCH04: g; PHC16: epsilon_wedge)", units = "1" },
  { sym = "\\varepsilon_\\parallel", sym_source = "η", aliases = ["η", "eta"], meaning = "longitudinal element (along B) of the dielectric tensor I + 4 pi chi, frame z || B: eps_zz = eps_parallel", meaning_source = "element of I + 4 pi chi along B (PLCH04: eta; PHC16: epsilon_parallel)", units = "1" },
  { sym = "\\varepsilon'_\\perp", sym_source = "eps_prime", meaning = "epsilon' = eps_perp + a_hat, transverse element including vacuum", units = "1" },
  { sym = "\\varepsilon'_\\parallel", sym_source = "eta_prime", meaning = "eta' = eta_par + a_hat + q_vac, longitudinal element including vacuum", units = "1" },
  { sym = "\\chi", sym_source = "chi", meaning = "complex polarisability tensor of the plasma, chi = chi^H + i chi^A", units = "1" },
  { sym = "\\chi^H", sym_source = "chi_H", meaning = "Hermitian part of chi (refraction and polarisation)", units = "1" },
  { sym = "\\chi^A", sym_source = "chi_A", meaning = "chi^A in chi = chi^H + i chi^A; i chi^A is the anti-Hermitian part (absorption)", units = "1" },
  { sym = "\\chi^{vac}", sym_source = "chi_vac", meaning = "polarisability tensor of the vacuum", units = "1" },
]
conflicts_with = ["const.notation-atomic", "eos.notation-bsk-fit", "gr.notation-geometry", "gr.notation-pechenick", "obs.notation-rxj1856-photometry", "obs.notation-rxj1856-spectral", "opacity.notation-particles-plasma", "opacity.notation-photon-cyclotron", "rt.notation-cond-energies-geometry", "rt.notation-cond-matter-dielectric", "rt.notation-spw09", "surface.notation-geometry"]
adopted = false
conflict_notes = ["alpha: Bel02 emission angle keeps \\alpha. Renamed: Pech83 polar-cap radius -> \\theta_{cap}; CODATA/PLCH04 fine-structure -> \\alpha_f; PC03/PLCH04 cyclic polarisation index -> \\alpha_{pol}; Kaplan11 optical index -> \\alpha_{opt}; SPW09 B-k angle -> \\theta_{kB}; SPW09 albedo -> \\varpi_\\nu^j; GH83 pole-to-sight angle -> \\psi_{pole}; Pot12 incident/reflected k-B angles -> \\theta_{kB}^{(i)}, \\theta_{kB}^{(r)}, \\theta_{kB}^{(min)}.", "theta_B: Magnetic colatitude keeps \\theta_B. PC03/PLCH04 k-B angle -> \\theta_{kB}; SPW09/Pot12/Ho07 field-normal angle -> \\theta_{Bn}.", "eta: eta is an emissivity (\\eta_\\nu^j). BSk exp(H)-1 -> \\eta_{\\mathcal{H}}; vAL05/PLCH04 longitudinal dielectric element -> \\varepsilon_\\parallel.", "g: g is surface gravity. vAL05/PLCH04 gyrotropic dielectric element g -> \\varepsilon_\\wedge (PHC16 spelling); transverse element epsilon -> \\varepsilon_\\perp.", "beta: Bel02 bending angle keeps \\beta. PC03 beta_e, beta_p -> \\zeta_e, \\zeta_p (PHC16 spelling); PLCH04 mode parameter -> \\beta_{pol}; GH83 beta (magnetic colatitude) -> \\theta_B."]
source = "potekhin_lai_chabrier_ho_2004_polarization"
locator = "eqs. 1-5, 18-21 (pp. 2, 5)"
anchor = "4πχ±1 = ε − 1 ± g, 4πχ0 = η − 1."
ocr = "good"
status = "rejected"
reviews = [ {reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "fix", note = "Applied reviewer correction after checking against refs text."}, {reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "reject", note = "χ_A is corrected, but cyclic components lack a frame designation and silently reuse the modal frame’s x,y,z."} ]
notes = "The sym keys eps_perp, g_gyro, eta_par avoid clashes with generic g (surface gravity) and eta elsewhere. PLCH04 eq. 2 has the tensor [[eps, ig, 0],[-ig, eps, 0],[0, 0, eta]]; PHC16 eq. 2.5 writes the same tensor with eps_perp, eps_wedge, eps_parallel. [r1 fix applied, per-symbol re-source recorded here because check.py has no per-symbol source field] j: j = 1 X, j = 2 O, refs/potekhin_lai_chabrier_ho_2004_polarization.txt L355-356, verbatim \"where j = 1, 2 correspond to the extraordinary mode (X-\". e_{j,\\alpha}: explicit cyclic-component formula, refs/potekhin_chabrier_2003_ff_opacity.txt L382-383, verbatim \"ej,±1 = (ej,x ±iej,y )/ 2 are the circular components.\"."

