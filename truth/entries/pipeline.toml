[[entry]]
id = "pipeline.pixel-radiance"
kind = "pipeline"
domain = "pipeline"
name = "Pixel spectral radiance in the camera frame (unpolarised)"
statement = "For each pixel direction of the camera tetrad and each frequency nu_cam (Hz), trace the null geodesic backwards; if it hits the star, take the local surface radiance I^(j)_nu'(nu', mu, T_s, B) in the surface comoving frame and transform it with I_nu/nu^3 invariance to I_nu(nu_cam); if it escapes, take the sky radiance in the asymptotic direction and transform it the same way. Sum the polarisation modes into the unpolarised specific intensity I only, in the stated gravity-only transparent exterior (no Stokes Q, U, V: that needs basis transport, exterior vacuum polarisation evolution and phase averaging, which have no computation dependencies). Output in erg s^-1 cm^-2 Hz^-1 sr^-1, with a scale-adaptive switch to a point source plus PSF when the disc is unresolved."
source = "PRD"
locator = "The shot, Primary output"
anchor = "HDR spectral radiance per pixel in absolute units, with"
ocr = "good"
status = "blessed"
provenance = "derivable"
ownership = "stub"
milestone = 1
depends_on = [
  "gr.approx-opaque-surface",
  "pipeline.camera-tetrad-projection", "pipeline.null-geodesic-trace", "pipeline.frequency-shift",
  "pipeline.surface-radiance", "pipeline.sky-radiance", "pipeline.star-scale-adaptive",
  "pipeline.surface-parameters", "pipeline.constant-set",
]
notes = "Audit A32 (redshift and I_obs = I_em/(1+z)^3, correct in v1), A33 (v1 pixel scale bug: now from the camera model), A42 (output sampling). Gap: no entry for parallel transport of the polarisation basis (Stokes rotation) along a Schwarzschild null geodesic. Review r1 (codex REJECT, root node, not rejected here; dispute recorded): fixed per stated reasons by restricting to unpolarised intensity in a gravity-only transparent exterior. Observed Stokes parameters are NOT promised: parallel transport alone is insufficient (magnetised-vacuum propagation, phase averaging missing)."
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "fix", note = "Root node kept: codex reject treated as fix by weakening to unpolarised specific intensity in the gravity-only transparent exterior; polarised transport left as a gap. Dispute noted." }]

