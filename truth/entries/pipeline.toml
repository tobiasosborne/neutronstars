[[entry]]
id = "pipeline.null-geodesic-trace"
kind = "pipeline"
domain = "pipeline"
name = "Exact null geodesic from camera pixel to surface or sky"
statement = "For a ray of impact parameter b (cm) starting at the camera radius r_c, integrate the exact Schwarzschild orbit equation (or evaluate the exact bending integral) in its orbital plane: decide hit (the past-directed ray reaches r = R before an exterior turning point or escape; an exterior turning point above R prevents a hit; the initial radial branch is retained; the surface-grazing b_max requires R > 3GM/c^2) or escape; on a hit return the surface point (theta, phi), the emission angle alpha (cos alpha relative to the local normal) and the azimuth of the photon direction relative to the local B; on escape return the asymptotic sky direction. Multiple images (bending > pi) are included."
source = "PRD"
locator = "Scope, In"
anchor = "exact Schwarzschild geodesics from a finite-radius moving camera;"
ocr = "good"
status = "blessed"
provenance = "derivable"
ownership = "stub"
