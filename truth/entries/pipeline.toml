[[entry]]
id = "pipeline.frequency-shift"
kind = "pipeline"
domain = "pipeline"
name = "Gravitational, Doppler and aberration shift of I_nu"
statement = "For each ray, compute the frequency ratio g = nu_cam/nu_em = (p . u_cam)/(p . u_em) from the photon four-momentum and the emitter (static surface or distant sky) and camera four-velocities, and transform the specific intensity by I_nu,cam(nu_cam) = g^3 I_nu,em(nu_cam/g), i.e. for the static case I_nu,obs(nu) = (1+z)^(-3) I_nu,em((1+z)nu) (I_nu/nu^3 invariant). For a static camera at infinity this reduces to 1 + z = (1 - r_g/R)^(-1/2) and I_nu,obs(nu) = (1+z)^(-3) I_nu,em((1+z)nu); far from the star it reduces to the special-relativistic Doppler factor."
source = "PRD"
locator = "The shot, Frame"
anchor = "shifts of the star and the sky follow from that one transformation."
ocr = "good"
status = "blessed"
provenance = "derivable"
ownership = "stub"
milestone = 1
depends_on = [
  "gr.invariant-inu-over-nu3", "gr.frequency-redshift", "gr.static-observer-four-velocity",
  "gr.disk-uniform-brightness", "gr.frequency-ratio-general", "gr.intensity-g-cubed", "gr.doppler-factor-sr",
  "gr.camera-blueshift-celestial",
  "pipeline.camera-tetrad-projection", "pipeline.ns-exterior-spacetime", "pipeline.null-geodesic-trace",
]
notes = "Audit A32 (correct in v1 for a static observer at infinity), R2 acceptance. gr.disk-uniform-brightness is a verification target (isotropic sphere appears uniform). Gap: no entry for the special-relativistic Doppler factor of a moving observer (needed for the R2 far-field limit check) and none for the four-velocity of the surface if rotation were included. Review r1: gr.intensity-transformation removed as a spectral dependency (its source has the fourth power: a bolometric check only). Photon momentum at the emitter now comes from pipeline.null-geodesic-trace. The moving-observer contraction/Doppler relation still needs its own entry. depends_on extended 2026-10-23 (M1 harvest): gr.frequency-ratio-general, gr.intensity-g-cubed, gr.doppler-factor-sr, gr.camera-blueshift-celestial. gr.doppler-factor-sr and gr.camera-blueshift-celestial fill the r1 moving-observer Doppler gap (R2 far-field check); gr.frequency-ratio-general (proposed) and gr.intensity-g-cubed state g = (p.u_cam)/(p.u_em) and the g^3 law. Node was blessed, not rejected, so its statement is unchanged."
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "fix", note = "Added pipeline.null-geodesic-trace; spectral transform written as I_nu,obs(nu)=(1+z)^-3 I_nu,em((1+z)nu); removed gr.intensity-transformation." }]

[[entry]]
id = "pipeline.sky-radiance"
kind = "pipeline"
domain = "pipeline"
name = "Background sky radiance at RX J1856"
statement = "Given an asymptotic ray direction (unit vector at infinity in Gaia-CRF3 / ICRS axes, in the rest frame of RX J1856), return the background-sky specific intensity I_nu (erg s^-1 cm^-2 Hz^-1 sr^-1) as (a) catalogued point sources plus (b) a diffuse term. (a) Each Gaia DR3 source carries its astrometric parameters at the reference epoch J2016.0 in Gaia-CRF3 (obs.gaia-dr3-astrometric-parameters, obs.gaia-reference-epoch-j2016, obs.gaia-reference-frame-crf3). Its barycentric position vector is built from the standard model of stellar motion (obs.gaia-standard-model-of-stellar-motion, obs.agis-standard-model-direction, obs.agis-astrometric-parameter-set) and propagated to the render epoch with the no-light-time formulae (obs.bl-propagation-direction-nolt, -parallax-nolt, -pm-nolt, -mur-nolt; perspective acceleration per obs.gaia-perspective-acceleration), the light-time neglect being checked per source against obs.bl-lighttime-neglect-criterion (raise if violated). Distances use 1/parallax only for sources whose parallax passes a stated significance cut; the treatment of the others is an open item and every frame logs it. Re-projection: the observer is translated from the solar-system barycentre to RX J1856, whose position vector is fixed by its position (obs.rxj1856-position-walter2010; the paper prints no epoch or frame for it, so this is logged as an assumption), its distance d = 123 pc (obs.rxj1856-distance, parallax obs.rxj1856-parallax-walter2010-text) and its proper motion (obs.rxj1856-proper-motion-total) propagated to the same epoch (size of the neglected light-time terms: obs.rxj1856-epoch-propagation-estimate). Each star's direction is the normalised difference vector from RX J1856 to the star, and its flux is multiplied by (distance from the Sun / distance from RX J1856)^2. Spectra: for sources with a published sampled XP spectrum (obs.gaia-xp-sampled-subset, only stars brighter than G = 15) the absolute SED f_lambda comes from the externally calibrated spectrum (obs.gaia-xp-ecs-definition, obs.gaia-xp-ecs-spd-sed-units, obs.gaia-xp-absolute-calibration); stars fainter than G = 15 have no sampled XP spectrum: an ECS must be reconstructed by our own code from the continuous representation where it is published, and otherwise only G, BP, RP photometry constrains the source through the band-flux integral (obs.gaia-band-flux-integral, obs.gaia-passband-distribution) and the VEGAMAG/AB zero points (obs.gaia-vegamag-definition, obs.gaia-ab-definition, obs.gaia-zero-points-vegamag, obs.gaia-zero-points-ab), which does not fix a spectrum, so the SED model used for those stars is an open decision labelled per frame. Gaia covers G = 3 to 21 with saturation effects at G below about 8 (obs.gaia-magnitude-range-and-bright-end); brighter stars need Hipparcos rows in the ICRS (obs.hipparcos-optical-realization-icrs). Point sources are delta functions in direction, deposited through the camera PSF downstream, not given a surface brightness here. (b) Diffuse term: OPEN PRD DECISION. The candidate Mellinger panorama (obs.mellinger-background-and-star-content, obs.mellinger-photometric-calibration, obs.mellinger-availability) is NOT starless (stars to about 14 mag remain) and no licence is on disk; the options are masking and inpainting it at Gaia positions, another map, or Gaia total minus catalogued flux. Until the decision is made, the diffuse term is absent and every frame says so. Data still to fetch into refs/data with checksums: Gaia archive rows, Gaia passband tables (VizieR), XP sampled spectra, CALSPEC Vega, Hipparcos rows."
source = "PRD"
locator = "Scope, In"
anchor = "background sky from Gaia DR3 re-projected to the star's location plus a"
ocr = "good"
status = "rejected"
provenance = "derivable"
ownership = "stub"
milestone = 1
depends_on = [
  "obs.rxj1856-distance", "obs.rxj1856-parallax-walter2010-text", "obs.rxj1856-proper-motion-total",
  "obs.rxj1856-position-walter2010", "obs.gaia-reference-epoch-j2016", "obs.gaia-reference-frame-crf3",
  "obs.gaia-dr3-astrometric-parameters", "obs.gaia-standard-model-of-stellar-motion",
  "obs.gaia-perspective-acceleration", "obs.gaia-band-flux-integral", "obs.gaia-vegamag-definition",
  "obs.gaia-ab-definition", "obs.gaia-zero-points-vegamag", "obs.gaia-zero-points-ab",
  "obs.gaia-passband-distribution", "obs.gaia-xp-ecs-definition", "obs.gaia-xp-ecs-spd-sed-units",
  "obs.gaia-xp-sampled-subset", "obs.gaia-xp-absolute-calibration", "obs.gaia-magnitude-range-and-bright-end",
  "obs.agis-standard-model-direction", "obs.agis-astrometric-parameter-set", "obs.bl-propagation-direction-nolt",
  "obs.bl-propagation-parallax-nolt", "obs.bl-propagation-pm-nolt", "obs.bl-propagation-mur-nolt",
  "obs.bl-lighttime-neglect-criterion", "obs.rxj1856-epoch-propagation-estimate",
  "obs.hipparcos-optical-realization-icrs",
  "pipeline.constant-set",
]
notes = "No v1 audit item (Part C, M1 non-v1 debt). Gaps: Gaia DR3 source catalogue (positions, parallaxes, G, BP, RP, XP spectra) has no entry; RX J1856 sky position (RA, Dec) has no entry; stellar SED from Gaia photometry (Part C warns a synthetic-spectra grid would be a new table dependency); starless diffuse Milky Way map and its licence (PRD open decision); Gaia passbands and zero points. REJECTED r1. Surviving weaker statement: reproject a measured stellar catalogue to RX J1856 and combine with a selected diffuse map (PRD.md:35-36); no Gaia catalogue, passbands, distance inference, spectral reconstruction or diffuse-map dataset is supplied, a distance alone does not fix the translation vector, and broadband photometry does not fix a spectrum. r1b re-proposal: the catalogue, epoch/frame, propagation, passband, zero-point and XP spectral entries are now harvested (sky.toml, sky2.toml; several still proposed), and the RX J1856 position vector (not only its distance) now fixes the translation. The three Mellinger entries are candidate dependencies pending the PRD diffuse-map decision. Remaining gaps: the sky data files themselves, the faint-star SED model, the parallax-significance rule, and the diffuse map. Re-proposed 2026-10-23 after the Milestone-1 harvest; r1 reject note retained above. r2 (pipeline-r1b) REJECT: the three Mellinger entries (obs.mellinger-background-and-star-content, obs.mellinger-photometric-calibration, obs.mellinger-availability) are moved out of depends_on and kept here as candidate dependencies only: the retained stars reach about magnitude 14 so the map cannot supply the promised starless component (Mellinger:352-355). Surviving weaker statement: the sources support a conditional catalogue-propagation and XP-SED recipe; they do not yet specify a complete absolute-radiance sky at RX J1856. Still missing before re-proposal: (1) catalogue, passband and spectral datasets fetched into refs/data with checksums; (2) the parallax cut; (3) the remaining-distance treatment; (4) a photometry-only SED model; (5) the RX J1856 coordinate epoch/frame and radial-velocity assumptions (logging an unspecified epoch/frame does not fix the propagated position); (6) note that the cited light-time criterion (obs.bl-lighttime-neglect-criterion) concerns epoch propagation, not the observer translation to RX J1856, which the statement used it for (the standard observer model includes a Roemer correction); (7) no complete spectral/frame reconstruction or selected diffuse component is defined (absolute XP SEDs only for a selected subset)."
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "reject", note = "Rejected: dependencies cannot produce absolute sky radiance (no catalogue, passbands, SED reconstruction, diffuse map)." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "reject", note = "Rejected again: catalogue/passband/spectral datasets absent; parallax cut, remaining-distance treatment and photometry-only SED model unspecified; RX J1856 coordinate epoch/frame and radial-velocity assumptions missing; the light-time criterion concerns epoch propagation, not the observer translation. Mellinger edges moved from depends_on to notes (dependency padding). Surviving weaker statement: conditional catalogue-propagation and XP-SED recipe; no complete absolute-radiance sky at RX J1856." }]

[[entry]]
