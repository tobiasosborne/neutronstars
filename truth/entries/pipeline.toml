# Domain pipeline: the SPINE of the argument DAG. Each entry is a computation our
# code performs, ordered from the rendered image (root) down to physics. Anchors
# are verbatim fragments of single lines of PRD.md. All entries proposed / stub.
# Audit item numbers (A1..A43) refer to truth/DEPENDENCY_AUDIT.md Part A.
# 'depends_on' lists the truth entries each computation consumes, then the lower
# spine nodes. Verification targets used by the node's tests are listed too and
# named as such in 'notes'.

# ---------------------------------------------------------------------------
# Top: the rendered frame and its display transforms
# ---------------------------------------------------------------------------

[[entry]]
id = "pipeline.rendered-frame"
kind = "pipeline"
domain = "pipeline"
name = "Rendered frame (HDR radiance plus derived display image)"
statement = "Root of the spine. For one camera event (proper time tau on the camera worldline) produce (i) the HDR spectral radiance cube I_nu(x, y, nu) (unpolarised; no Q, U, V until polarised transport exists) in erg s^-1 cm^-2 Hz^-1 sr^-1 in the camera frame, and (ii) the display image (8-bit sRGB per pixel) derived from it through the stated colour, exposure and tone transforms. Milestone 1 delivers a single frame; the >= 60 s video needs milestone 4 and a separate time-remapping computation, not merely repeated frames. The Stokes Q, U, V content is limited to what pipeline.pixel-radiance supplies (unpolarised intensity only)."
source = "PRD"
locator = "Requirements, R8"
anchor = "One 4k still at periastron, one video of at least 60 s, and the HDR radiance behind both"
ocr = "good"
status = "blessed"
provenance = "derivable"
ownership = "stub"
milestone = 1
depends_on = ["pipeline.pixel-radiance", "pipeline.display-exposure-tone", "pipeline.display-colour", "pipeline.earth-photometry"]
notes = "No audit item of its own; it composes A31-A33 (GR/camera), A38-A42 (display) and the surface models. Video time remapping (PRD milestone 4) has no truth entry yet (gap). Review r1: pipeline.earth-photometry added as an explicitly labelled verification dependency (the R5 harness), so it stays reachable now that surface-parameters no longer depends on it."
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "fix", note = "Single-frame milestone 1 stated, video needs milestone 4 time remapping; added pipeline.earth-photometry as labelled verification dependency; Stokes claim weakened to match pixel-radiance." }]

[[entry]]
id = "pipeline.display-colour"
kind = "pipeline"
domain = "pipeline"
name = "Spectral radiance to CIE XYZ to linear and encoded sRGB"
statement = "Integrate the pixel spectral radiance I_lambda (erg s^-1 cm^-2 nm^-1 sr^-1, I_lambda = I_nu |dnu/dlambda| = I_nu c/lambda^2 with the nm conversion, lambda = c/nu) against the CIE 1931 2-degree colour matching functions over 360-830 nm to get X, Y, Z (absolute, then scaled by exposure); convert XYZ to linear sRGB with the matrix obtained by inverting the primaries/D65 matrix built from the sRGB chromaticities; clip to gamut; apply the sRGB transfer function and quantise to 8-bit code values. Clipping and quantisation are lossy; the original HDR data is retained, and the inverse path (code value to linear sRGB) is only an approximate decode."
