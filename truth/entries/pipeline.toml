[[entry]]
id = "pipeline.camera-tetrad-projection"
kind = "pipeline"
domain = "pipeline"
name = "Camera tetrad and pixel-to-photon-momentum projection"
statement = "At each camera event of pipeline.camera-worldline build the camera's orthonormal tetrad e_(a)^cam: the static-observer tetrad of gr.static-tetrad, e_(t) = [c (1 - r_g/r)^(1/2)]^(-1) d/dt, e_(r) = (1 - r_g/r)^(1/2) d/dr, e_(theta) = r^(-1) d/dtheta, e_(phi) = (r sin theta)^(-1) d/dphi, boosted by the local Lorentz transformation (gr.tetrad-lorentz-transformation, the sign giving e_(0)^cam = gamma (e_(0) + beta_cam hat v_cam^a e_(a))) to the camera four-velocity u_cam = c gamma (e_(0) + beta_cam hat v_cam), whose speed beta_cam and direction hat v_cam relative to the static observer are read off the worldline's u^mu (gr.camera-four-velocity-static-frame); e_(0)^cam = u_cam/c. Pixel mapping (gr.camera-projection-convention): optical axis a_cam, image-right u_x and image-up u_y with u_x x u_y = -a_cam; a pixel offset (dx, dy) from the optical-axis pixel gives r_pix = (dx^2 + dy^2)^(1/2), phi_field = atan2(dy, dx) and the field angle theta_field = arctan(r_pix/f_cam) (pinhole, theta_field < pi/2) or theta_field = r_pix/f_cam (equidistant), with f_cam > 0 in pixels; at r_pix = 0, set N_cam = a_cam without evaluating atan2; equidistant pixels require 0 ≤ theta_field ≤ pi; the pixel's sky direction is N_cam = cos theta_field a_cam + sin theta_field (cos phi_field u_x + sin phi_field u_y). Direction convention: N_cam points toward the apparent source of the incoming ray (N of James et al. 2015 eq. A.8); the photon propagates along -N_cam, with four-momentum p = (h nu_cam/c)(e_(0)^cam - N^a e_(a)^cam), so h nu_cam = -p_mu u^mu_cam, and coordinate components p^mu = p^(i) e_(i)^mu (gr.tetrad-vector-components). Aberration between the camera and static frames is this one boost (gr.camera-aberration, n_F the static-frame propagation direction). From p_mu return, per pixel and frequency, the ray's conserved constants (gr.null-geodesic-constants: p_t, p_phi in its own orbit plane, impact parameter b = |p_phi/p_t| c in cm), its orbit plane (the plane through r = 0 containing the camera position and the spatial direction of p; for a radial ray (b = 0), choose a fixed auxiliary orbit plane) and its initial radial branch; the static-frame sky angle of gr.observer-sky-angle is a consistency check. Pointing for a still: image-up u_y is -e_(theta)^cam (the orbit normal along +L_z of pipeline.camera-worldline, unchanged by boosts in the orbit plane), orthogonalised against a_cam; in tracking mode a_cam is the camera-frame image, through gr.camera-aberration, of the static-frame inward radial direction -e_(r) (the star's centre). This M1 computation supports tracking only; fixed-inertial requests raise until a transport-law dependency exists. Each frame supplies the projection and positive f_cam. gr.disk-angular-radius is a distant-static verification target only."
source = "PRD"
locator = "The shot, Frame"
anchor = "the camera's local tetrad. Aberration, Doppler, and gravitational"
ocr = "good"
status = "blessed"
reject_resolved = true
provenance = "derivable"
ownership = "stub"
milestone = 1
depends_on = [
