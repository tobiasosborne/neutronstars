[[entry]]
id = "pipeline.camera-worldline"
kind = "pipeline"
domain = "pipeline"
name = "Camera worldline (hyperbolic timelike geodesic)"
statement = "Integrate the camera worldline as an unbound (hyperbolic) timelike geodesic of the Schwarzschild exterior of pipeline.ns-exterior-spacetime, parameterised by camera proper time tau_prop (s). Mass: the star's gravitational mass is a labelled parameter m_star_N := GM/(GM)^N_sun (the nominal-solar-mass ratio defined through GM; the symbol m is reserved for column density); r_g = 2GM/c^2 is computed from the product GM = m_star_N (GM)^N_sun with (GM)^N_sun = 1.3271244e26 cm^3 s^-2 (const.gm-sun-nominal-cgs), and M in grams, where needed, is M ≈ m_star_N × 1.98841e33 g with CODATA 2018 G (const.m-sun-nominal-cgs, not an IAU nominal quantity). Inputs: the conserved specific energy E-tilde = (1 - r_g/r) dt/dtau_prop > 1 (dimensionless; the unbound condition of gr.timelike-unbound-condition), or equivalently the speed at infinity v_inf = c (1 - E-tilde^-2)^(1/2) (gr.timelike-speed-at-infinity), and the periastron radius r_peri (cm; PRD default about 100 km). The specific angular momentum L-tilde = r^2 dphi_Sch/dtau_prop (cm^2 s^-1) follows from L-tilde^2 = c^2 r_peri^2 [E-tilde^2/(1 - r_g/r_peri) - 1] (gr.timelike-angular-momentum-from-periastron); the run raises unless r_peri > max(R, r_g) and r_peri is the largest real root of the periastron cubic and a simple root with d\\mathcal{R}/dr(r_peri) > 0 (gr.timelike-periastron-cubic), so that the orbit turns at r_peri, is not captured, and does not intersect the star. Orientation convention: the orbit lies in the Schwarzschild equatorial plane theta_Sch = pi/2 (Carter constant Q = 0), L_z = +|L-tilde| so phi_Sch increases along the orbit, phi_Sch = 0 and tau_prop = 0 at periastron, and tau_prop increases to the future (E-tilde > 0). Equations: (dr/dtau_prop)^2 = c^2 E-tilde^2 - (1 - r_g/r)(c^2 + L-tilde^2/r^2) (gr.timelike-radial-equation-schwarzschild), dt/dtau_prop = E-tilde (1 - r_g/r)^(-1), dphi_Sch/dtau_prop = L-tilde/r^2; the inbound branch dr/dtau_prop < 0 holds for tau_prop < 0 and the outbound branch for tau_prop > 0. Proper time is the unsigned two-leg quadrature dtau_prop = |dr|/(c^2 E-tilde^2 - (1 - r_g/r)(c^2 + L-tilde^2/r^2))^(1/2), integrated with increasing r on each leg, r_peri -> r_start inbound and r_peri -> r_end outbound, with the integrable 1/(r - r_peri)^(1/2) endpoint singularity regularised (gr.timelike-proper-time-quadrature). Finite r_start, r_end > r_peri are supplied inputs; the caller verifies the unresolved-endpoint criterion using the moving-camera image and stated PSF. Output: x^mu(tau_prop) = (t, r, theta_Sch, phi_Sch) and u^mu(tau_prop) = dx^mu/dtau_prop, with g_mu nu u^mu u^nu = -c^2 checked at every output event (fail loud)."
source = "PRD"
locator = "The shot, Camera"
anchor = "on a hyperbolic timelike geodesic of the Schwarzschild spacetime of"
ocr = "good"
status = "blessed"
