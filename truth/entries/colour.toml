[[entry]]
id = "colour.srgb-inverse-transfer-linear"
kind = "equation"
provenance = "convention"
ownership = "leaf"
domain = "colour"
name = "sRGB decoding, linear segment (Stokes eq. 1.7a)"
statement = "Inverse of eq. 1.2a: when the condition holds the linear value is the encoded value divided by 12.92. The condition is printed (srgb18.gif) as R_sRGB, G_sRGB, B_sRGB <= 0.03928, on the unprimed symbols; read as a threshold on the encoded values it matches 12.92 x 0.00304 = 0.0393 to 4 s.f. This reading is an editorial interpretation, not printed."
latex = "R_{sRGB},G_{sRGB},B_{sRGB}\\le 0.03928:\\quad R_{sRGB}=R'_{sRGB}\\div 12.92"
source = "stokes_1996_srgb"
locator = "eq. 1.7a"
anchor = "The reverse relationship is defined as follows;"
ocr = "poor"
status = "rejected"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "fix", note = "printed condition transcribed faithfully (srgb18.gif verified); editorial reading separated." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "reject", note = "12.92x0.00304 = 0.03928 at 4 s.f., not 0.0393; statement wrong." }]
depends_on = ["colour.srgb-transfer-linear"]
notes = "Read from srgb18.gif, srgb19.gif. Printed condition uses unprimed symbols; latex records it as printed. Editorial reading: the threshold applies to the encoded (primed) values."

[[entry]]
id = "colour.srgb-inverse-transfer-power"
kind = "equation"
provenance = "convention"
ownership = "leaf"
domain = "colour"
name = "sRGB decoding, power segment (Stokes eq. 1.7b)"
statement = "Inverse of eq. 1.2b: for encoded values above 0.03928 the linear value is ((encoded + 0.055)/1.055) raised to 2.4. AS PRINTED the G and B rows of the image use R' in the right-hand side (copy-paste typo); the intended relation is per channel."
latex = "R'_{sRGB}>0.03928:\\quad R_{sRGB}=\\left[\\frac{R'_{sRGB}+0.055}{1.055}\\right]^{2.4}\\ (\\text{same for }G,B)"
source = "stokes_1996_srgb"
locator = "eq. 1.7b"
anchor = "The reverse relationship is defined as follows;"
ocr = "poor"
status = "rejected"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "reject", note = "Entry as written is wrong: statement claims G/B rows use R' (srgb21.gif shows per-channel rows, so claim is false) and latex repairs the printed unprimed branch condition without flagging it. Replacement entry needed with printed condition R_sRGB,G_sRGB,B_sRGB > 0.03928." }]
depends_on = ["colour.srgb-transfer-power", "colour.srgb-inverse-transfer-linear"]
notes = "Read from srgb20.gif, srgb21.gif. Continuity check: 1.055*0.00304^(1/2.4)-0.055 = 0.0393 = 12.92*0.00304."

