notes = "L_white enters eq. 4 as L(x,y)/L_white^2 where L is scaled and dimensionless, so L_white is a scaled (dimensionless) luminance; the paper's L_max (= max of Lw) is in world units. The source is loose about this distinction; the reboot must define L_white and L_max in the same space (see the L_white default entry, which sets L_white=L_max)."
symbols = [
  { sym = "L_w", meaning = "world luminance of pixel (x_pix,y_pix), scene luminance before scaling; source-unspecified units (absolute CGS/stilb is not asserted)", units = "source-unspecified (luminance)" },
  { sym = "\\bar{L}_w", meaning = "log-average luminance of the scene (eq. 1), same units as L_w", units = "source-unspecified (luminance)" },
  { sym = "L_{sc}(x_{pix},y_{pix})", sym_source = "L(x,y)", aliases = ["L(x,y)"], meaning = "scaled luminance after key scaling, eq. 2", units = "1" },
  { sym = "L_d", meaning = "display luminance output of the tone-mapping operator, eq. 3-4; eq. 4 permits values above 1 when L_sc exceeds L_white", units = "1" },
  { sym = "L_{max}", meaning = "maximum scaled luminance in the scene, L_max = max L_sc (for use with eq. 4, alongside L_white)", units = "1" },
  { sym = "L_{white}", meaning = "smallest scaled luminance mapped to pure white, eq. 4 (threshold in scaled luminance, same scale as L_sc)", units = "1" },
]
conflicts_with = ["eos.notation-structure"]
adopted = false
conflict_notes = ["L: Bare L retired. PPP15 local luminosity -> L_{ph}; Reinhard scaled luminance -> L_{sc}(x_{pix},y_{pix})."]

