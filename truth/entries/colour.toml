[[entry]]
id = "colour.reinhard-log-average-luminance"
kind = "equation"
provenance = "convention"
ownership = "leaf"
domain = "colour"
name = "Log-average (world) luminance, Reinhard eq. 1"
statement = "Reinhard et al. define the log-average luminance of the scene, used as an approximation to the scene key, from the world luminance L_w(x,y) of all N pixels with a small offset delta that avoids the singularity at black pixels. AS PRINTED in this tech report (p. 4 page image) the prefactor 1/N stands outside the exponential, i.e. (1/N) exp(sum log(delta+L_w)), which is not the geometric mean described by the prose name 'log-average'; the form exp((1/N) sum log(delta+L_w)) would be the geometric mean. Record the printed form and flag it; the reboot must not silently pick one."
latex = "\\bar{L}_w = \\frac{1}{N}\\exp\\left(\\sum_{x,y}\\log\\left(\\delta + L_w(x,y)\\right)\\right)"
source = "reinhard_2002_tonemapping"
locator = "eq. 1 (p. 4)"
anchor = "view the log-average luminance as a useful approximation to the"
ocr = "poor"
image_verified = true
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "accept", note = "Anchor matches Reinhard txt 188-197; p.4 image shows 1/N outside exp; printed form flagged in statement." }]
depends_on = ["colour.notation-reinhard-luminance", "colour.notation-reinhard-parameters"]
v1_ref = "archive/v1/src/colorimetry/cie_srgb.jl:163"
notes = "Layout text of the equation is split across lines (1/N above, sum below); form read from the rendered page 4 image. Printed form appears to contain a typo relative to the stated intent (log-average); verify against the SIGGRAPH 2002 published version before implementing. v1 code never computed L_avg (default L_avg=1.0)."

[[entry]]
id = "colour.reinhard-scaled-luminance"
kind = "equation"
provenance = "convention"
ownership = "leaf"
domain = "colour"
name = "Scaled luminance with key value a, Reinhard eq. 2"
statement = "The world luminance is linearly scaled so that the log-average luminance maps to the key value a (default middle-grey 0.18), giving the scaled luminance L(x,y) that is the input of the tone-mapping operators."
latex = "L(x,y) = \\frac{a}{\\bar{L}_w} L_w(x,y)"
source = "reinhard_2002_tonemapping"
locator = "eq. 2 (p. 4)"
anchor = "where L(x, y) is a scaled luminance and a = 0.18."
ocr = "poor"
image_verified = true
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "accept", note = "Anchor and eq. 2 match; fraction and subscripts visually confirmed." }]
depends_on = ["colour.reinhard-log-average-luminance", "colour.notation-reinhard-luminance", "colour.notation-reinhard-parameters"]
v1_ref = "archive/v1/src/colorimetry/cie_srgb.jl:165"
