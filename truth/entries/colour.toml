kind = "notation"
domain = "colour"
name = "Luminance symbols of the Reinhard operator"
statement = "Luminance quantities used by the Reinhard global tone-mapping operator. L_w is the world luminance per pixel; L-bar_w its log-average; L the scaled luminance; L_d the display luminance in [0,1); L_max the maximum scene luminance; L_white the smallest luminance mapped to pure white. The source does not state physical units for L_w; L, L_d are dimensionless."
