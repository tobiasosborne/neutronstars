# truth/entries/colour_srgb.toml -- sRGB colour space (Stokes et al. 1996, W3C proposal v1.10)
# and the CIE 1931 2-degree colour matching function data file.
# All equation images are GIFs in refs/data/stokes_1996_srgb_img/ ; transcriptions in
# refs/stokes_1996_srgb_equations.txt. Equation entries are ocr="poor": a reviewer must read the GIF.
# Thresholds are the 1996 values (0.00304, 0.03928), NOT the IEC 61966-2-1 values (0.0031308, 0.04045).

