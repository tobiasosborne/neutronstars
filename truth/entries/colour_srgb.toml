kind = "result"
provenance = "convention"
ownership = "leaf"
domain = "colour"
name = "Origin of the CIE 1931 2-degree CMFs"
statement = "The CIE 1931 2-deg CMFs (CIE, 1932) form the basis for most practical colorimetry. They are based on the chromaticity coordinates of Guild (1931) and Wright (1928); chromaticity gives only relative ratios whereas CMFs specify absolute energy values. To reconstruct the CMFs from the Wright and Guild data it was assumed that the CIE 1924 V(lambda) photopic luminosity function is a linear combination of the three CMFs."
latex = 'V(\lambda)=a_1\bar{x}(\lambda)+a_2\bar{y}(\lambda)+a_3\bar{z}(\lambda)'
source = "data/cie1931_2deg_cvrl_README"
locator = "Notes paragraph 1"
anchor = "The CIE 1931 2-deg CMFs (CIE, 1932), which form the basis for most practical"
ocr = "good"
status = "rejected"
depends_on = ["colour.notation-cie-cmf"]
notes = "The latex only expresses the statement 'V(lambda) is a linear combination of the three CMFs'; the coefficients a_i are NOT given in the README and are placeholders. (Wyszecki & Stiles 1982 is the cited source for the tabulated values.)"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "drop", note = "Historical reconstruction is unnecessary for Milestones 1–3. `refs/data/cie1931_2deg_cvrl_README.txt:16–24` supports the prose, but does not print the supplied barred-function equation or coefficient symbols." }]

