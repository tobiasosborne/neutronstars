[[entry]]
id = "obs.gaia-xp-ecs-spd-sed-units"
kind = "equation"
domain = "obs"
name = "ECS: spectral photon distribution and SED units, and usable wavelength range"
statement = "The reconstructed externally calibrated spectrum is given as the spectral photon distribution n_p in photons s^-1 m^-2 nm^-1 (Eq. 33) and as the SED f_lambda in W m^-2 nm^-1 (Eq. 34), reconstructed by two distinct matrix equations, n_p = (D_phi^P H V_C^T) b and f_lambda = (D_phi^E H V_C^T) b. The sampling wavelength grid must be limited to [330, 650] nm for BP and [635, 1050] nm for RP to avoid large errors in the reconstructed spectra. The two partial spectra are combined into a single distribution by a weighted mean in the overlap region [lambda_lo, lambda_hi] with linear weights w_BP = 1 - (lambda - lambda_lo)/(lambda_hi - lambda_lo), w_RP = 1 - w_BP. The numerical conversion factor inside the design matrix D^E is unresolved and is not certified here."
latex = "\\mathbf n_p=(D_\\varphi^P H V_C^T)\\mathbf b\\ [\\mathrm{photons\\,s^{-1}\\,m^{-2}\\,nm^{-1}}],\\qquad \\mathbf f_\\lambda=(D_\\varphi^E H V_C^T)\\mathbf b\\ [\\mathrm{W\\,m^{-2}\\,nm^{-1}}]"
source = "montegriffo_2023_gaia_xp"
locator = "Sect. 5, Eqs. (33)–(36), p. 8 (refs/montegriffo_2023_gaia_xp.txt:526-550)"
anchor = 'which is the SED in units of $\rm W m^{-2} nm^{-1}$.'
anchor_tex = '\mathbf{f_\lambda} = \left(\mathrm{D}_\varphi^E \cdot \mathrm{H} \cdot V_C^T\right) \cdot \mathbf{b}'
ocr = "good"
provenance = "derivable"
ownership = "stub"
status = "blessed"
reject_resolved = true
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "reject", note = "TeX-only anchor (valid per SCHEMA, kept). The 10^8 factor faithfully transcribes Eq. (32) but is inconsistent with the stated SI constants and nanometre wavelength convention: at 550 nm SI hc/lambda = 3.611719740271e-19 J, printed factor gives 3.611719740271e-20 J, ratio 0.1, relative error -0.9. Surviving weaker statement applied: units, matrix reconstruction, wavelength restrictions and linear overlap weights only; conversion factor unresolved, cannot be blessed for computation. Provenance set to derivable, ownership stub (a reconstruction is not a measured leaf)." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "fix", note = "applied: ECS reconstruction text replaced by the two distinct equations n_p=(D_phi^P H V_C^T)b and f_lambda=(D_phi^E H V_C^T)b (statement and latex); locator corrected to 'Sect. 5, Eqs. (33)–(36), p. 8' (refs/montegriffo_2023_gaia_xp.txt:526-550; the named subsection is commented out in TeX); deleted the doubled-backslash historical wavelength quote from notes; unresolved-factor exclusion retained. Reviewer reason: Replace “both obtained by … `f_lambda`” with the distinct reconstructions **`\\mathbf n_p=(D_\\varphi^P H V_C^T)\\mathbf b`** and **`\\mathbf f_\\lambda=(D_\\varphi^E H V_C^T)\\mathbf b`**. Correct locator to **“Sect. 5, Eqs. (33)–(36), p. 8”**: `refs/montegriffo_2023_gaia_xp.txt:526–550`. The named subsection is commented out in TeX. Primary TeX anchor `.tex:706` is valid. Delete the doubled-backslash historical wavelength quote; retain the unresolved-factor exclusion." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 3, verdict = "accept", note = "Distinct photon/energy reconstruction equations, corrected locator, wavelength limits and overlap weights match `refs/montegriffo_2023_gaia_xp.txt:526–550`. Primary TeX anchor byte-matches `.tex:706`. Malformed quotation removed; unresolved conversion-factor exclusion retained." }]
depends_on = ["obs.gaia-xp-ecs-definition"]
notes = "UNRESOLVED CONVERSION FACTOR. Eq. (32) of the paper prints D^E_ij = D_ij (1/R(lambda_i)) (10^8 h c / lambda_i); the 10^8 factor is a faithful transcription but is inconsistent with the stated SI constants and nanometre wavelength convention (refs/montegriffo_2023_gaia_xp.txt:135-143,586-588): at 550 nm SI hc/lambda = 3.611719740271e-19 J, the printed factor gives 3.611719740271e-20 J (ratio 0.1, relative error -0.9; constants refs/tiesinga_2021_codata2018.txt:3444,3451). It cannot be blessed for computation and is omitted from the statement and latex. What the paper reports, at refs/montegriffo_2023_gaia_xp.txt:526-550: SPD/SED units (Eqs. 33-34), matrix reconstruction, wavelength restrictions and linear overlap weights (Eqs. 35-36). lambda_lo and lambda_hi are not printed in this passage. Provenance/ownership changed from measured leaf: a reconstruction equation is not a measured leaf; measured calibration inputs must be separated from the computation. Conversion for the renderer: W m^-2 nm^-1 = 1e10 erg s^-1 cm^-2 cm^-1 and I_nu = I_lambda lambda^2/c. The ECS is an SED at the catalogue point source (flux density, not surface intensity): treat as a delta source in the renderer."

[[entry]]
id = "obs.gaia-xp-sampled-subset"
kind = "datum"
domain = "obs"
name = "Gaia DR3 XP mean spectra: counts and the sampled ECS subset (G < 15)"
statement = "XP mean spectra are published for 219,197,643 sources, mostly sources with G brighter than 17.65 mag and more than 15 CCD transits for both XP. All are given in a continuous (basis-function) representation. For a selected subset of sources with BP and RP spectral data that includes only sources brighter than G = 15 mag (the exact list is obtained by selecting gaia_source.has_xp_sampled = 't'; this is not stated to be every G < 15 source) the XP spectra are also provided in a sampled representation on a default grid as externally calibrated spectra in absolute flux and wavelength systems; for other sources ECS can be computed with GaiaXPy on a user-defined wavelength grid."
value = "219197643 sources; sampled ECS only for a selected subset of sources brighter than G = 15"
units = "sources; mag"
uncertainty = "exact as printed"
source = "montegriffo_2023_gaia_xp"
locator = "Appendix B (refs/montegriffo_2023_gaia_xp.txt:1932-1959)"
anchor = "BP and RP mean spectra are published for 219,197,643 sources."
anchor_tex = 'externally calibrated spectra in absolute flux and wavelength systems'
ocr = "good"
provenance = "measured"
ownership = "leaf"
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "fix", note = "applied: locator set to Appendix B; anchor now the .txt quote (count 1), TeX quote kept in anchor_tex; statement and value now say selected subset of sources brighter than G = 15, not every G < 15 source; count, selection criteria, continuous representation and GaiaXPy option verified (lines 1932-1959)." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "accept", note = "Count 219197643, “mostly” selection criteria, continuous representation, selected G<15 sampled subset and GaiaXPy option match `refs/montegriffo_2023_gaia_xp.txt:1932–1959`. The erroneous every-bright-source implication is removed." }]
depends_on = ["obs.gaia-xp-ecs-definition"]
notes = "Byte-checked counts (l.1577): 'mean spectra are published for 219,197,643 \\textbf{sources}'. Montegriffo l.290 repeats 'for a subset of sources with $G<15$ they will also be provided as ECS sampled on a standard wavelength grid'. NOT PRINTED in this paper: the default sampling grid itself (start, end, step, number of points); it is in the Gaia archive / DataLink product and the dedicated Cosmos page (URL in the report's fetch list). Consequence for sky-radiance: continuous XP coefficients exist for stars down to about 17.65, but sampled absolute-flux ECS only for G < 15; stars fainter than the sampled subset need GaiaXPy (external code, a verification target, not a runtime input under rule 7) or the broadband G, G_BP, G_RP fluxes, which do not fix a spectrum. This supports only a selected subset of bright sources, not availability of sampled ECS for every G < 15 source. Count, the \"mostly\" selection criteria, continuous representation, the selected G < 15 sampled subset and the GaiaXPy option match refs/montegriffo_2023_gaia_xp.txt:1932-1959."

