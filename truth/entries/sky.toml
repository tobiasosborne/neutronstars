kind = "datum"
domain = "obs"
name = "Gaia EDR3/DR3 magnitude range, and the bright end"
statement = "Gaia EDR3 contains results for 1.812 billion sources in the magnitude range G = 3 to 21. The magnitudes of the well-observed sources range from G = 6 to 21. Partial saturation of images affects G <~ 8 (astrometric calibration), and the G-band photometry improved for G <~ 6 through better handling of saturated samples in the IPD process. No source is stated to be complete at the bright end; the sources printed here give only the nominal range."
value = "G = 3 to 21 (range of the catalogue); G = 6 to 21 (well-observed sources)"
units = "mag"
uncertainty = "not stated"
source = "lindegren_2021_gaia_astrometry"
locator = "Abstract and Sect. 1 (refs/lindegren_2021_gaia_astrometry.txt:33-34,54-55); partial saturation refs/lindegren_2021_gaia_astrometry.txt:2719-2720,2696; photometric G<~6 improvement refs/riello_2021_gaia_photometry.txt:763-764"
anchor = "in the magnitude range G = 3 to 21 based on"
anchor_tex = 'from $G=6$ to 21. All data are publicly available in the online \textit{Gaia} Archive at'
ocr = "good"
provenance = "measured"
ownership = "leaf"
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "fix", note = "applied: anchor now the .txt quote (count 1), well-observed-range TeX quote kept in anchor_tex, old TeX anchor moved to notes; locator extended with the saturation locators and secondary Riello locator 763-764 for G<~6; no bright-end completeness claim." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "accept", note = "Nominal and well-observed ranges match `refs/lindegren_2021_gaia_astrometry.txt:33–34,54–55`; partial saturation matches lines 2719–2720,2696. Bright-end improvement matches `refs/riello_2021_gaia_photometry.txt:763–764`. No completeness inference remains." }]
depends_on = ["obs.gaia-dr3-astrometric-parameters"]
notes = "GAPS row 1.11 says 'G <~ 3' stars are missing from Gaia. The sources printed here do NOT state a completeness limit or a list of missing bright stars: they state the catalogue range G = 3 to 21 and well-observed G = 6 to 21 (l.89, l.148). The DR3 summary (gaia_2023_dr3_summary) prints no bright-limit sentence (grep for bright, completeness: nothing about G < 3). So the claim that stars brighter than about G = 3 are absent is NOT harvested; Hipparcos (van Leeuwen 2007, arXiv:0708.1752) is the GAPS-listed fetch for bright stars. Additional lines: l.2801 'for $G\\lesssim 8$) the partial saturation of images' in refs/lindegren_2021_gaia_astrometry.tex, and riello_2021_gaia_photometry.tex l.421 'the very bright end, $G\\lesssim6$'. Nominal range and well-observed range match refs/lindegren_2021_gaia_astrometry.txt:33-34,54-55; partial saturation is supported at refs/lindegren_2021_gaia_astrometry.txt:2719-2720,2696; the G<~6 photometric improvement is at refs/riello_2021_gaia_photometry.txt:763-764. No bright-end completeness claim is justified. Earlier TeX prose anchor (byte-checked in refs/lindegren_2021_gaia_astrometry.tex): 'in the magnitude range $G=3$ to 21 based on observations collected by the European Space'."
