[[entry]]
id = "obs.gaia-standard-model-of-stellar-motion"
kind = "definition"
domain = "obs"
name = "Standard model of stellar motion (six kinematic parameters, uniform velocity)"
statement = "For the main EDR3 astrometric results it is assumed that all sources outside the solar system move with uniform velocity relative to the solar system barycentre. Under this standard model of stellar motion the motion of a source is completely specified by six kinematic parameters, conventionally the five astrometric parameters (alpha, delta, varpi, mu_alpha* = mu_alpha cos delta, mu_delta) and the radial velocity v_r, all referring to the reference epoch J2016.0. Non-linear motions (binarity, perturbations) are ignored."
latex = '(\alpha, \delta, \varpi, \mu_{\alpha*}=\mu_\alpha\cos\delta, \mu_\delta, v_r)'
source = "lindegren_2021_gaia_astrometry"
locator = "Sect. 3.1, p. 6 (refs/lindegren_2021_gaia_astrometry.txt:423-437)"
anchor = "move with uniform velocity relative to the solar system barycen-"
anchor_tex = '($\alpha$, $\delta$, $\varpi$, $\mu_{\alpha*}{\,=\,}\mu_\alpha\cos\delta$, $\mu_\delta$)'
ocr = "good"
provenance = "convention"
ownership = "stub"
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "fix", note = "applied: locator set to Sect. 3.1; anchor now the .txt quote (count 1), equation TeX quote kept in anchor_tex and the old prose TeX anchor moved to notes; removed the unsourced propagation recipe and the asserted title of the follow-up reference from notes; dependency on obs.rxj1856-position-walter2010 removed." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "accept", note = "Uniform barycentric velocity, six parameters, J2016.0 and ignored perturbations match `refs/lindegren_2021_gaia_astrometry.txt:423–437`. Unsupported propagation recipe removed." }]
depends_on = ["obs.gaia-reference-epoch-j2016", "obs.gaia-reference-frame-crf3"]
notes = "THE PRINTED PROPAGATION EQUATIONS ARE NOT IN THIS PAPER. Lindegren 2021 cites ESA 1997 and Lindegren 2020a for the standard model but prints no formula that propagates (alpha, delta) from J2016.0 to another epoch (grep for propagat, rigorous, tangent in the .tex finds none). Until a source for the propagation is on disk, ownership is stub and no equation entry is written. The assumption, the six parameters and the ignored perturbations match refs/lindegren_2021_gaia_astrometry.txt:423-437. Earlier TeX prose anchor (byte-checked in refs/lindegren_2021_gaia_astrometry.tex): 'all sources outside of the solar system move with uniform velocity relative to the solar'."

[[entry]]
id = "obs.gaia-perspective-acceleration"
kind = "equation"
domain = "obs"
name = "Perspective acceleration term and the radial proper motion mu_r"
statement = "The standard model takes into account perspective acceleration through terms depending on the radial velocity v_r. The radial proper motion is mu_r = v_r varpi / A_u, with A_u the astronomical unit. v_r (or mu_r) is the sixth kinematic parameter of the standard model and is sometimes called the sixth astrometric parameter; the source notes this is potentially confusing, because in the six-parameter astrometric solutions (Sect. 2.3) the sixth parameter fitted is instead the pseudocolour. In EDR3 the effect is taken into account whenever possible, using RVS radial velocities from DR2, complemented for a few nearby stars (mainly white dwarfs) by literature values."
latex = '\mu_r = v_r \varpi / A_\text{u}'
source = "lindegren_2021_gaia_astrometry"
locator = "Sect. 3.1, p. 6 (refs/lindegren_2021_gaia_astrometry.txt:456-475)"
anchor = "tion through terms depending on the radial velocity vr ."
anchor_tex = '$\mu_r= v_r\varpi/A_\text{u}$'
ocr = "good"
provenance = "convention"
ownership = "stub"
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "fix", note = "applied: locator set to Sect. 3.1; anchor now the .txt quote (count 1), equation TeX quote kept in anchor_tex, old prose TeX anchor moved to notes; statement now distinguishes the sixth kinematic parameter (radial velocity) from the sixth parameter of catalogue six-parameter astrometry (pseudocolour); equation and EDR3 treatment verified at lines 456-475." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "accept", note = "`\\mu_r=v_r\\varpi/A_\\text{u}` matches the TeX and `refs/lindegren_2021_gaia_astrometry.txt:470–475`. EDR3 treatment matches lines 456–463; radial velocity is correctly distinguished from fitted pseudocolour." }]
depends_on = ["obs.gaia-standard-model-of-stellar-motion"]
notes = "The perspective-acceleration terms themselves are not printed in this paper (see obs.gaia-standard-model-of-stellar-motion). Whether it matters at RX J1856's 0.331 arcsec/yr: NOT assessable from the local sources. The size of the effect scales with mu_r, i.e. with v_r varpi, which for the neutron star's optical counterpart is unmeasured here. No radial velocity of RX J1856 exists in refs/. Do not assume it negligible; flag to the lead. For background Gaia stars the sources printed here say only that radial velocities enter 'whenever possible' (above); the size of the effect is not quantified in the local sources. Earlier TeX prose anchor (byte-checked in refs/lindegren_2021_gaia_astrometry.tex): 'The standard model takes into account perspective acceleration through terms depending'."

