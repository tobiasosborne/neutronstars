# All entries proposed.

[[entry]]
id = "obs.notation-gaia-sky"
kind = "notation"
domain = "obs"
name = "Gaia astrometric symbols"
statement = "Symbols for the Gaia astrometric parameters (right ascension, declination, parallax, proper motion components), the radial velocity and the astronomical unit, as used in Lindegren et al. (2021) Sect. 3.1. Canonical spellings avoid the project's emission angle alpha, albedo varpi_nu and Newton constant G. The Gaia photometric symbols are in obs.notation-gaia-photometry."
symbols = [
  { sym = "\\alpha_{RA}", sym_source = "alpha", aliases = ["ra"], meaning = "right ascension of a source; the reference frame and epoch are attributes of each datum (Gaia DR3: ICRS, Gaia-CRF3, epoch J2016.0; Walter+2010: not stated)", units = "rad", units_source = "deg" },
  { sym = "\\delta_{Dec}", sym_source = "delta", aliases = ["dec"], meaning = "declination of a source; the reference frame and epoch are attributes of each datum (Gaia DR3: ICRS, Gaia-CRF3, epoch J2016.0; Walter+2010: not stated)", units = "rad", units_source = "deg" },
  { sym = "\\varpi_{plx}", sym_source = "varpi", aliases = ["parallax"], meaning = "trigonometric parallax of a source at the reference epoch J2016.0 (Gaia astrometric parameter)", units = "rad", units_source = "mas" },
  { sym = "\\mu_{\\alpha*}", sym_source = "mu_{alpha*} = mu_alpha cos(delta)", aliases = ["pmra"], meaning = "proper motion in right ascension times cos(delta), at J2016.0 (catalogue field pmra)", units = "rad s^-1", units_source = "mas yr^-1" },
  { sym = "\\mu_\\delta", sym_source = "mu_delta", aliases = ["pmdec"], meaning = "proper motion in declination at J2016.0 (catalogue field pmdec)", units = "rad s^-1", units_source = "mas yr^-1" },
  { sym = "v_r", sym_source = "v_r", meaning = "radial velocity of a source relative to the solar system barycentre (sixth kinematic parameter of the standard model)", units = "cm s^-1" },
  { sym = "\\mathrm{au}", sym_source = "A_u", meaning = "astronomical unit, exactly 149 597 870 700 m (IAU 2012 B2)", units = "cm", units_source = "au" },
]
source = "lindegren_2021_gaia_astrometry"
locator = "Sect. 3.1, p. 6 (refs/lindegren_2021_gaia_astrometry.txt:432-437,470-475)"
anchor = "dard five astrometric parameters (α, δ, $, µα∗ = µα cos δ, µδ )"
anchor_tex = '($\alpha$, $\delta$, $\varpi$, $\mu_{\alpha*}{\,=\,}\mu_\alpha\cos\delta$, $\mu_\delta$)'
ocr = "good"
status = "blessed"
reject_resolved = true
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "reject", note = "Anchor exists only in TeX (valid per SCHEMA, kept in anchor_tex); actual locator is Sect. 3.1. Lindegren does not support the bundled photometric symbols; aliases also reintroduce collisions. Surviving weaker statement applied: only the astrometric parameters, radial velocity, reference epoch and astronomical unit (lines 432-437, 470-475) remain; photometric symbols split to obs.notation-gaia-photometry; bare aliases alpha, delta, varpi dropped." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "fix", note = "applied: removed units_source = 'km s^-1' from v_r (this source does not specify that unit); units = 'cm s^-1' retained as the project convention. Reviewer reason: The split and collision repairs are applied; symbols and epoch match `refs/lindegren_2021_gaia_astrometry.txt:432–437,470–475`. Remove **`units_source = 'km s^-1'`** from `v_r`: this source does not specify that unit. Retain `units = 'cm s^-1'` as the project convention." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 3, verdict = "accept", note = "Unsupported radial-velocity `units_source` removed; `cm s^-1` retained as project convention. Definitions and epoch match `refs/lindegren_2021_gaia_astrometry.txt:432–437,470–475`; both anchors byte-match." }]
notes = "Surviving weaker statement: the five astrometric parameters, radial velocity, reference epoch and astronomical unit are supported by refs/lindegren_2021_gaia_astrometry.txt:432-437,470-475; Lindegren does not support the photometric symbols, which are split off to obs.notation-gaia-photometry (sourced to Riello 2021). The bare aliases alpha, delta and varpi were dropped (they collide with the emission angle, its alias delta and the albedo varpi_nu, truth/NOTATION_DECISIONS.md); sym_source keeps the paper spelling, ra, dec, parallax, pmra, pmdec remain as catalogue-field aliases. Collision check against NOTATION_DECISIONS.md: bare alpha is the emission angle (gr.notation-geometry), delta is an alias of that alpha, varpi_nu and varpi_nu^j are albedos, bare mu is the ray cosine. varpi_{plx} was chosen so that the glyph is not shared with the albedo rows. Units: code converts mas -> rad (1 mas = pi/(180*3600*1000) rad) and yr -> s explicitly; rad s^-1 is the CGS-code unit, the catalogue unit is mas/yr. Symbols renamed 2026-10-23 to the dictionary spelling (notation merge)."

[[entry]]
id = "obs.notation-gaia-photometry"
kind = "notation"
domain = "obs"
name = "Gaia photometric symbols"
statement = "Symbols for the Gaia photometric bands, the band flux integral, the passband and pupil area, the photometric zero points and the synthetic mean fluxes, as used in Riello et al. (2021) Sect. 7. Canonical spellings avoid Newton's constant G and the proton density n_p; printed SI units are kept in units_source."
symbols = [
  { sym = "G_{Gaia}", sym_source = "G", aliases = ["phot_g_mean_mag"], meaning = "Gaia G-band magnitude", units = "mag", units_source = "mag" },
  { sym = "G_{BP}", sym_source = "G_BP", meaning = "Gaia blue-photometer band magnitude", units = "mag", units_source = "mag" },
  { sym = "G_{RP}", sym_source = "G_RP", meaning = "Gaia red-photometer band magnitude", units = "mag", units_source = "mag" },
  { sym = "n_{p,Gaia}", sym_source = "n_p", meaning = "mean source flux in a Gaia band in electrons per second (e- s^-1), not normalised by telescope area; in the XP chapter n_p(lambda) is the photon flux distribution", units = "s^-1", units_source = "e- s^-1" },
  { sym = "S_{Gaia}", sym_source = "S(lambda)", meaning = "Gaia system overall response function, including the scaling from photons to electrons (passband)", units = "e- photon^-1" },
  { sym = "P_{pupil}", sym_source = "P", meaning = "telescope pupil area in the Gaia flux integral", units = "cm^2" },
  { sym = "ZP_{VEG}", sym_source = "ZP_{VEG}", meaning = "Gaia passband zero point in the VEGAMAG system, per band", units = "mag" },
  { sym = "ZP_{AB}", sym_source = "ZP_{AB}", meaning = "Gaia passband zero point in the AB system, per band", units = "mag" },
  { sym = "\\langle F_\\lambda\\rangle", sym_source = "<f_lambda>", meaning = "synthetic mean energy flux per wavelength unit through a passband", units = "erg s^-1 cm^-2 cm^-1", units_source = "W m^-2 nm^-1" },
  { sym = "\\langle F_\\nu\\rangle", sym_source = "<f_nu>", meaning = "synthetic mean energy flux per frequency unit through a passband", units = "erg s^-1 cm^-2 Hz^-1", units_source = "W m^-2 Hz^-1" },
]
source = "riello_2021_gaia_photometry"
locator = "Sect. 7, Eq. (7), p. 15 (refs/riello_2021_gaia_photometry.txt:931-940); Eqs. (13)-(17), p. 17; Table 3, p. 18"
anchor = "where P represents the telescope pupil area and S (λ) is the sys-"
anchor_tex = 'n_p = P \int\limits_0^\infty \, n_p(\lambda)\, S(\lambda) \, {\rm d}\lambda,'
ocr = "good"
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "fix", note = "applied: canonical symbols changed to \\langle F_\\lambda\\rangle and \\langle F_\\nu\\rangle (lowercase source spellings retained in sym_source) because canonical f_nu is the Eddington factor; 'Gaia unfiltered G-band magnitude' changed to 'Gaia G-band magnitude' ('unfiltered' unsupported); removed P_pupil.units_source='m^2' and S_Gaia.units_source='1' (units not printed at the cited definitions). Reviewer reason: Definitions match `refs/riello_2021_gaia_photometry.txt:934–940,999–1000,1108–1140,1147–1156`. Adopt **`\\langle F_\\lambda\\rangle`**, **`\\langle F_\\nu\\rangle`**, retaining lowercase source spellings: canonical `f_\\nu` already means Eddington factor. Change **“Gaia unfiltered G-band magnitude”** to **“Gaia G-band magnitude”**; “unfiltered” is unsupported here. Remove `P_pupil.units_source='m^2'` and `S_Gaia.units_source='1'`: those units are not printed at the cited definitions." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 3, verdict = "accept", note = "Canonical mean-flux symbols corrected, source spellings retained, “unfiltered” removed, and unsupported pupil/response source-unit fields deleted. Definitions match `refs/riello_2021_gaia_photometry.txt:934–940,999–1000,1108–1140,1147–1156`; both anchors byte-match." }]
notes = "Split from obs.notation-gaia-sky (round-1 reject: Lindegren 2021 does not define these symbols). Symbols defined in Riello 2021: n_p, P, S(lambda) at Eq. (7) (refs/riello_2021_gaia_photometry.txt:931-940); G, G_BP, G_RP and ZP_VEG, ZP_AB in Table 3 (refs/riello_2021_gaia_photometry.txt:1147-1156) and Eq. (17); <f_lambda>, <f_nu> at Eqs. (13)-(14) (refs/riello_2021_gaia_photometry.txt:1108-1121). Bare G is Newton's constant and bare n_p is the proton density, so those aliases are not registered (sym_source keeps the paper spelling). Canonical flux units are CGS with the printed SI units retained in units_source; pupil area in cm^2. Round 2: canonical spellings are \\langle F_\\lambda\\rangle and \\langle F_\\nu\\rangle because f_nu already denotes the Eddington factor (truth/NOTATION_DECISIONS.md); lowercase source spellings kept in sym_source. Unit bridge: the proposed Gaia per-cm quantity is distinct from per-A F_lambda at truth/entries/obs.toml:770. P_pupil.units_source and S_Gaia.units_source removed (those units are not printed at the cited definitions)."

[[entry]]
id = "obs.gaia-reference-epoch-j2016"
kind = "datum"
domain = "obs"
name = "Gaia DR3 / EDR3 astrometric reference epoch J2016.0"
statement = "All Gaia EDR3 astrometric parameters (and hence those of DR3, whose astrometry is unchanged) refer to the reference epoch J2016.0 = JD 2457389.0 (TCB) = 1 January 2016, 12:00:00 (TCB), which is exactly 0.5 Julian year (182.625 d) later than the DR2 epoch J2015.5."
value = "J2016.0 = JD 2457389.0 (TCB)"
units = "TCB Julian date"
uncertainty = "exact (a convention)"
source = "lindegren_2021_gaia_astrometry"
locator = "Sect. 3.1, p. 6 (refs/lindegren_2021_gaia_astrometry.txt:434-437)"
anchor = "JD 2457 389.0 (TCB) = 1 January 2016, 12:00:00 (TCB)."
anchor_tex = '$\text{J2016.0}=\text{JD~2457\,389.0 (TCB)}=\text{1 January 2016, 12:00:00}$ (TCB).'
ocr = "good"
provenance = "convention"
ownership = "leaf"
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "fix", note = "applied: locator set to Sect. 3.1, p. 6; anchor now the .txt quote (grep -F count 1), TeX quote kept in anchor_tex; epoch digits and 182.625 d verified; DR3 support locator added; dependency on obs.rxj1856-position-walter2010 removed." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "accept", note = "Anchor and epoch match `refs/lindegren_2021_gaia_astrometry.txt:434–437`: JD 2457389.0 TCB; difference 182.625 days. DR3 reuse is supported by `refs/gaia_2023_dr3_summary.txt:392–394`. Round-1 corrections applied." }]
notes = "RX J1856 position and proper motion (obs.rxj1856-position-walter2010, obs.rxj1856-proper-motion-total) have no printed epoch for the nominal pair (Walter Table 4 prints a different position with epoch 2003.624, txt:913, tex:1339; see sky2-r1); any comparison with Gaia positions must move one to the other with the standard model (obs.gaia-standard-model-of-stellar-motion). Epoch drift at the neutron star's 0.331 arcsec/yr is 0.33 arcsec per year, so a 16-year epoch error is about 5.3 arcsec. Epoch digits and the 182.625-day difference match refs/lindegren_2021_gaia_astrometry.txt:434-437 (expected 2457389.0 and 182.625, as printed; error 0). DR3 astrometry is unchanged from EDR3, supported separately at refs/gaia_2023_dr3_summary.txt:392-394. The epoch definition does not depend on RX J1856 position data."

[[entry]]
id = "obs.gaia-reference-frame-crf3"
kind = "definition"
domain = "obs"
name = "Gaia-CRF3 celestial reference frame (aligned with ICRF3 / ICRS)"
statement = "Gaia DR3 source positions and proper motions are given with respect to Gaia-CRF3, the third realisation of the Gaia celestial reference frame. Gaia-CRF3 is aligned with ICRF3 (the radio realisation of the ICRS) to about 0.01 mas RMS at epoch J2016.0 (TCB), and is globally non-rotating with respect to quasars to within 0.005 mas/yr RMS. The ICRS axes are conventionally defined by VLBI positions of extragalactic radio sources; the astrometric processing uses the BCRS (origin at the solar system barycentre, axes aligned with the ICRS, time coordinate TCB). Coordinates and proper motions are equatorial (ICRS)."
latex = '\alpha_{RA}, \delta_{Dec} \text{ in ICRS (equatorial)}'
source = "gaia_2023_dr3_summary"
locator = "Gaia DR3 summary Sect. 3.2 (refs/gaia_2023_dr3_summary.txt:392-400); secondary: refs/lindegren_2021_gaia_astrometry.txt:328-331,416-420,1533-1534 (VLBI-defined ICRS axes, BCRS/TCB, equatorial coordinates)"
anchor = "Reference Frame in the radio (ICRF3) to about 0.01 mas root-"
anchor_tex = 'Reference Frame in the radio (ICRF3) to about $0.01$ mas root-mean-square'
ocr = "good"
provenance = "convention"
ownership = "leaf"
status = "blessed"
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "fix", note = "applied: anchor now the .txt quote (count 1), TeX quote kept in anchor_tex; locator extended with Sect. 3.2 and the explicit secondary .txt locators for ICRS axes, BCRS/TCB and equatorial coordinates; alignment, epoch and spin figures verified against lines 392-400." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "accept", note = "Alignment 0.01 mas RMS, J2016.0 TCB, and spin 0.005 mas/yr RMS match `refs/gaia_2023_dr3_summary.txt:392–400`. Added secondary locators support ICRS axes, BCRS/TCB and equatorial coordinates: `refs/lindegren_2021_gaia_astrometry.txt:328–331,416–420,1533–1534`." }]
notes = "Second sources, byte-checked against refs/lindegren_2021_gaia_astrometry.tex: 'International Celestial Reference System' / '(ICRS) is conventionally defined by means of the accurate positions for extragalactic radio sources observed' (l.534-535); 'the choice of ICRS (equatorial) coordinates for the position and proper motion' (l.2127). The renderer needs the camera/sky axes in this frame: ICRS equatorial axes are the frame in which the position of RX J1856 must be expressed. The frame of obs.rxj1856-position-walter2010 is unstated and not assessed here. Alignment (0.01 mas), epoch J2016.0 and spin (0.005 mas/yr) figures match refs/gaia_2023_dr3_summary.txt:392-400; the secondary claims (VLBI-defined ICRS axes, BCRS/TCB, equatorial coordinates) rest on the explicit additional locators refs/lindegren_2021_gaia_astrometry.txt:328-331,416-420,1533-1534."

