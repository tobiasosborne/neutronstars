name = "Gaia band flux as integral of photon flux distribution times system response"
statement = "The mean source flux n_p in a Gaia band, in units of e- s^-1, is related to the source photon flux distribution n_p(lambda) by n_p = P integral_0^inf n_p(lambda) S(lambda) d lambda, where P is the telescope pupil area and S(lambda) is the overall system response function including the scaling factor from photons to electrons. The same relation holds for G, G_BP and G_RP with their own S(lambda)."
