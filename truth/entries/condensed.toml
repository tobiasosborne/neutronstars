name = "Ion cyclotron energy, Potekhin 2012 eq. 8"
statement = "The ion cyclotron energy of the condensed-matter ions (charge number Z, mass number A) is E_ci = hbar Z e B/(A m_u c) = 0.0635 (Z/A) B13 keV, with m_u the unified atomic mass unit. Below E_ci the free-ion and fixed-ion reflectivities differ sharply."
latex = "E_{\\rm ci} = \\hbar Z e B/A m_u c = 0.0635\\,(Z/A)\\,B_{13}\\ {\\rm keV}"
source = "potekhin_2012_condensed_surface"
locator = "eq. 8 (p. 4)"
anchor = "Eci = ~ZeB/Amu c = 0.0635 (Z/A) B13 keV"
anchor_tex = "=0.0635\\,({Z}/{A})\\, B_{13}"
ocr = "good"
status = "blessed"
provenance = "derivable"
ownership = "stub"
depends_on = ["rt.notation-cond-energies-geometry"]
notes = "van Adelsberg+2005 eq. 4b: E_Bi = hbar Z e B/(m_i c) = 0.635 B14 (Z/A) keV (same number). For Fe the fiducial thin-atmosphere model of Sect. 3.2 quotes E_ci = 0.118 keV at B = 4e13 G."
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "accept", note = "Eq. 8 gives the stated denominator, coefficient and units; the low-energy distinction is supported." }]

