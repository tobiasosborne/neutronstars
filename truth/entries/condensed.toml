[[entry]]
id = "rt.cond-kirchhoff-law"
kind = "equation"
domain = "rt"
name = "Kirchhoff emission of a macroscopic body, van Adelsberg 2005 eqs. 7-8"
statement = "Placing the body in an unpolarised blackbody cavity at its own temperature and requiring the cavity field to stay unpolarised gives the intrinsic emission in each reflected polarisation, I_nu,j^(e) = B_nu/2 - I_nu,j^(r) = (1 - R_j) B_nu/2, so that the total emission is I_nu^(e) = (1 - R) B_nu(T) = J B_nu(T) with R = (R_1 + R_2)/2 the reflectivity and J = 1 - R the dimensionless emissivity; these hold also out of equilibrium since they are intrinsic properties of the body."
latex = "I^{(e)}_{\\nu j} = \\tfrac12 B_\\nu - I^{(r)}_{\\nu j} = \\tfrac12 (1-R_j) B_\\nu,\\qquad I^{(e)}_\\nu = (1-R)\\,B_\\nu(T) \\equiv J B_\\nu(T)"
source = "van_adelsberg_2005_condensed_surface"
locator = "eqs. 7a, 7b, 8 (p. 4-5)"
anchor = "Iν(e) = (1 − R)Bν (T ) ≡ JBν (T )"
anchor_tex = "I^{(e)}_{\\nu 1}={1\\over 2}B_{\\nu}-I^{(r)}_{\\nu 1}"
ocr = "poor"
image_verified = true
status = "blessed"
provenance = "derivable"
ownership = "stub"
depends_on = ["rt.notation-cond-emissivity-fit"]
notes = "Reflected intensities (eq. 6): I_nu1^(r) = (|r11|^2+|r21|^2) B_nu/2 = R_1 B_nu/2 and I_nu2^(r) = (|r12|^2+|r22|^2) B_nu/2 = R_2 B_nu/2, with incident field E_j^(i) = A e_j^(i), A = sqrt(B_nu/2). The angle-averaged emission used for the flux: F_nu = int dphi int dtheta cos theta sin theta J B_nu, <1-R> = F_nu/(pi B_nu) (sect. 4, Fig. 10)."
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "fix", note = "Factors, reflected-polarization indexing and equilibrium argument match the images. Add `image_verified = true`." }, { reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 2, verdict = "accept", note = "Both polarization factors, reflected-component interpretation and extension outside cavity equilibrium match. [2005:289–333](/home/tobias/Projects/neutronstars/refs/van_adelsberg_2005_condensed_surface.txt:289)." }]
