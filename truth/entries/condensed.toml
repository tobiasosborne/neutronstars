[[entry]]
id = "rt.cond-electron-cyclotron-energy"
kind = "equation"
domain = "rt"
name = "Electron cyclotron energy, Potekhin 2012 eq. 1"
statement = "The electron cyclotron energy E_ce = hbar e B/(m_e c) equals 115.77 B13 keV, with B13 = B/1e13 G. It is set equal to the Hartree energy m_e e^4/hbar^2 at the natural atomic field B0 = e^3 m_e^2 c/hbar^3 = 2.35e9 G."
latex = "E_{\\rm ce} = \\hbar e B/m_e c = 115.77\\,B_{13}\\ {\\rm keV}"
source = "potekhin_2012_condensed_surface"
locator = "eq. 1 (p. 2)"
anchor = "Ece = ~eB/mec = 115.77 B13 keV"
anchor_tex = "\\Ece = \\hbar eB/\\mel c =115.77~B_{13}\\textrm{ keV}"
ocr = "good"
status = "blessed"
provenance = "derivable"
ownership = "stub"
depends_on = ["rt.notation-cond-energies-geometry"]
notes = "van Adelsberg+2005 eq. 4a gives the same quantity as E_Be = 1158 B14 keV."
reviews = [{ reviewer = "codex_review.sh", model = "gpt-6.1-sol", round = 1, verdict = "accept", note = "Anchor and eq. 1 match, including the Hartree comparison and field scaling." }]

[[entry]]
