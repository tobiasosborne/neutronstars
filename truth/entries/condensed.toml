[[entry]]
id = "rt.cond-inner-bc"
kind = "equation"
domain = "rt"
name = "Inner boundary condition of a thin atmosphere on a condensed surface, Potekhin 2012 eqs. 29-30"
statement = "At the inner boundary (rho = rho_s) the outgoing specific intensity in each normal mode is the surface emission plus reflected incident intensity from both modes: I_E^X(theta_k, phi) = (1/2) J_X B_E(T) + R_XX I_E^X(pi - theta_k, phi) + R_XO I_E^O(pi - theta_k, phi), I_E^O = (1/2) J_O B_E + R_OO I_E^O(pi - theta_k, phi) + R_OX I_E^X(pi - theta_k, phi). Here R_MM' is the reflection coefficient from incident mode M' into reflected mode M, J_X = 1 - R_X, J_O = 1 - R_O, R_X = R_XX + R_XO and R_O = R_OO + R_OX."
latex = "I_E^X(\\theta_k,\\varphi) = \\tfrac12 J_X B_E(T) + R_{XX} I_E^X(\\pi-\\theta_k,\\varphi) + R_{XO} I_E^O(\\pi-\\theta_k,\\varphi);\\quad I_E^O(\\theta_k,\\varphi) = \\tfrac12 J_O B_E(T) + R_{OO} I_E^O(\\pi-\\theta_k,\\varphi) + R_{OX} I_E^X(\\pi-\\theta_k,\\varphi)"
source = "potekhin_2012_condensed_surface"
locator = "eqs. 29-30 (p. 7)"
anchor = "IEX (θk , ϕ) = 12 JX (θk , ϕ)BE (T ) + RXX (θk , ϕ) IEX (π − θk , ϕ)"
ocr = "poor"
image_verified = true
status = "blessed"
provenance = "derivable"
ownership = "stub"
depends_on = ["rt.cond-emissivity-definition", "rt.notation-cond-emissivity-fit"]
notes = "Ho+2007 retained only the emission terms. Paper II (Suleimanov+2010) included reflection but neglected R_OO, R_OX, R_XO and took R_XX = R independent of phi (X-mode total reflection assumed); this difference changes the emergent thin-atmosphere spectra (Sect. 3.2, Figs. 8-10: fiducial B = 4e13 G, Teff = 1.2e6 K, column density Sigma = 10 g cm^-2). Mode transformation by reflection moves part of the O-mode energy into the X-mode, which then escapes. Temperature correction at this boundary uses the Unsoeld-Lucy method with the flux fixed there (eqs. 31-34, not recorded here)."
