statement = "The fit of J(E, B, theta_B, theta_k, phi) is constructed for 1e12 <~ B <~ 1e14 G and 1 eV <~ E <~ 10 keV for condensed Fe (rho_s with eta = 1). For most geometric settings the fit error is within 10% over more than 95% of -3 < log10 E(keV) < 1; the remaining <5% are narrow ranges where J(E) changes sharply. Errors may exceed 20% in up to 10% of the logarithmic range for strongly inclined fields (theta_B > pi/4) and small phi. The fit ignores the temperature dependence (numerics at T ~ 1e6 K), justified by the weak T dependence through the damping."
source = "potekhin_2012_condensed_surface"
