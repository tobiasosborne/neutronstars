[[entry]]
id = "rt.notation-cond-matter-dielectric"
kind = "notation"
domain = "rt"
name = "Notation: condensed matter, dielectric tensor and damping"
statement = "Symbols for the condensed phase and its dielectric tensor (van Adelsberg+2005, Potekhin+2012); renamed where needed to avoid clashes (Z -> Z_nuc, A -> A_mass, eta in rho_s -> eta_rho, eta in tensor -> eta_zz)."
symbols = [
  { sym = "A_{ion}", sym_source = "A", aliases = ["A", "A_ion", "A_{mass}"], meaning = "ion mass number A", meaning_source = "atomic mass number of the condensed-matter ion (paper: A)", units = "1" },
  { sym = "Z_{ion}", sym_source = "Z", aliases = ["Z", "Z_ion", "Z_{nuc}"], meaning = "ion charge number Z (nuclear charge of a fully ionised ion)", meaning_source = "nuclear charge number of the ion (paper: Z)", units = "1" },
  { sym = "\\rho_{s,cond}", sym_source = "ρ_s", aliases = ["rho_s"], meaning = "zero-pressure density of the condensed surface (paper: rho_s)", units = "g cm^-3" },
  { sym = "\\eta_{\\rho}", sym_source = "η", aliases = ["η"], meaning = "dimensionless factor eta in the surface density rho_s: uniform-electron (Wigner-Seitz) model, unity for the ion-sphere model", units = "1" },
  { sym = "T_{crit}", meaning = "critical temperature below which condensation occurs", units = "K" },
  { sym = "Q_{s}", meaning = "cohesive energy of the condensed phase", units = "eV" },
  { sym = "n_e", sym_source = "n_{e}", aliases = ["n_{e}"], meaning = "electron number density", meaning_source = "electron number density of the condensed matter", units = "cm^-3" },
  { sym = "\\varepsilon_\\perp", sym_source = "ε", aliases = ["ε", "epsilon"], meaning = "transverse diagonal element of the dielectric tensor I + 4 pi chi, frame z || B: eps_xx = eps_yy = eps_perp", meaning_source = "diagonal transverse element of the dielectric tensor in the frame with B along z", units = "1" },
  { sym = "\\varepsilon_\\wedge", sym_source = "g", aliases = ["g"], meaning = "off-diagonal (gyrotropic) element of the dielectric tensor I + 4 pi chi, frame z || B, with eps_xy = +i eps_wedge and eps_yx = -i eps_wedge (convention common to vAL05 and PLCH04)", meaning_source = "off-diagonal (gyrotropic) element of the dielectric tensor (paper: g)", units = "1" },
  { sym = "\\varepsilon_\\parallel", sym_source = "η", aliases = ["η", "eta"], meaning = "longitudinal element (along B) of the dielectric tensor I + 4 pi chi, frame z || B: eps_zz = eps_parallel", meaning_source = "longitudinal element of the dielectric tensor (paper: eta)", units = "1" },
  { sym = "u_{e}", meaning = "(E_Be/E)^2, squared ratio of electron cyclotron energy to photon energy", units = "1" },
  { sym = "u_{i}", meaning = "(E_Bi/E)^2, squared ratio of ion cyclotron energy to photon energy", units = "1" },
  { sym = "v_{e}", meaning = "(E_pe/E)^2, squared ratio of electron plasma energy to photon energy", units = "1" },
  { sym = "\\gamma_{ei}^{(tr)}", meaning = "dimensionless collisional damping rate hbar nu/E for motion transverse to B", units = "1" },
  { sym = "\\gamma_{ei}^{(l)}", meaning = "dimensionless collisional damping rate hbar nu/E for motion longitudinal to B", units = "1" },
  { sym = "\\nu_{ei}^{(tr)}", meaning = "electron-ion collision frequency transverse to B", units = "s^-1" },
  { sym = "\\nu_{ei}^{(l)}", meaning = "electron-ion collision frequency longitudinal to B", units = "s^-1" },
  { sym = "\\Gamma_{coul}", sym_source = "Γ", aliases = ["Γ"], meaning = "Coulomb coupling parameter Gamma = (Ze)^2/(a_ion k_B T) of the ions (van Adelsberg+2005 sect. 2.1)", units = "1" },
  { sym = "a_{ion}", sym_source = "a_i", aliases = ["a_i"], meaning = "ion-sphere radius a_i, defined by (4 pi a_i^3/3)^(-1) = n_i (ion number density)", units = "cm" },
]
conflicts_with = ["colour.notation-cie-xyz", "eos.notation-bsk-fit", "opacity.notation-modes-polarization", "opacity.notation-particles-plasma", "rt.notation-spw09"]
adopted = false
conflict_notes = ["Z: Bare Z is the CIE tristimulus value. Ion charge number -> Z_{ion} (mass number A -> A_{ion}).", "eta: eta is an emissivity (\\eta_\\nu^j). BSk exp(H)-1 -> \\eta_{\\mathcal{H}}; vAL05/PLCH04 longitudinal dielectric element -> \\varepsilon_\\parallel.", "g: g is surface gravity. vAL05/PLCH04 gyrotropic dielectric element g -> \\varepsilon_\\wedge (PHC16 spelling); transverse element epsilon -> \\varepsilon_\\perp."]
source = "van_adelsberg_2005_condensed_surface"
locator = "Sect. 2 (p. 2-4)"
anchor = "we consider the free electron gas model for"
ocr = "good"
status = "blessed"
notes = "Aliases (round-1 review): A_{mass} = A_ion, Z_{nuc} = Z_ion, epsilon = eps_perp, g_{gyr} = g_gyro, eta_{zz} = eta_par, n_e = n_e of the existing notation entries; the condensed-phase/model qualification is retained here."
