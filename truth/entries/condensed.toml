statement = "The surface emits monochromatic intensity I_{E,j} = J_j B_E/2 in linear polarisation j (j = 1 parallel, j = 2 perpendicular to the plane of incidence), where B_E = B_nu/(2 pi hbar) = E^3/[4 pi^3 hbar^3 c^2 (exp(E/kT) - 1)] is the Planck function per unit energy (eq. 7) and the dimensionless emissivity is J_j = 1 - R_j with R_j the effective reflectivity of mode j. For unpolarised radiation the mean R = (R_1 + R_2)/2 and J = 1 - R = (J_1 + J_2)/2."
