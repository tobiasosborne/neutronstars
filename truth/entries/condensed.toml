source = "potekhin_2012_condensed_surface"
locator = "eq. 6, eq. 7 and text (p. 3-4)"
anchor = "IE, j = J j BE /2 ( j = 1, 2)."
anchor_tex = "B_E = \\frac{B_\\nu}{2\\pi\\hbar}="
ocr = "poor"
status = "rejected"
provenance = "convention"
ownership = "leaf"
depends_on = ["rt.notation-cond-emissivity-fit"]
notes = "Eq. 7 is read from the page image (text extraction garbled). I_{E,j} dSigma dOmega dE dt is the energy radiated in wave j. Emission with J dependent on direction (theta_k, phi), B, theta_B, E."
