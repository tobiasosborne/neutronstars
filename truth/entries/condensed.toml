statement = "Characteristic energies and angles used for condensed-surface emission (symbol names adapted where a plain symbol would clash with other domains; the paper writes E, B13, theta_B, theta_k, phi). Universal constants hbar, e, c, m_e, k_B, m_u are as in CODATA and not listed."
symbols = [
  { sym = "E", sym_source = "E_{ph}", aliases = ["E_{ph}"], meaning = "photon energy hbar omega", meaning_source = "photon energy hbar omega (paper: E)", units = "keV" },
  { sym = "B_{13}", meaning = "local magnetic field strength in units of 1e13 G (B/1e13 G)", units = "1" },
  { sym = "B_{14}", aliases = ["B_14"], meaning = "local magnetic field strength B/(10^14 G)", meaning_source = "local magnetic field strength in units of 1e14 G (B/1e14 G; van Adelsberg+2005)", units = "1" },
  { sym = "E_{ce}", aliases = ["E_Be", "E_{Be}"], meaning = "electron cyclotron energy hbar omega_ce = hbar e B/(m_e c) = 1158 B_14 keV", meaning_source = "electron cyclotron energy hbar e B/(m_e c)", units = "keV" },
  { sym = "E_{ci}", aliases = ["E_Bi", "E_ci", "E_{Bi}"], meaning = "ion cyclotron energy hbar omega_ci = hbar Z e B/(A m_u c) = 0.635 (Z/A) B_14 keV", meaning_source = "ion cyclotron energy hbar Z e B/(A m_u c) (van Adelsberg+2005: E_Bi)", units = "keV" },
  { sym = "E_{pe}", meaning = "electron plasma energy of the condensed matter", units = "keV" },
  { sym = "E_{C}", meaning = "upper characteristic energy E_ci + E_pe^2/E_ce", units = "keV" },
  { sym = "\\tilde E_{C}", meaning = "effective characteristic energy E_ci + (E~_pe)^2/E_ce at which the square of the effective refraction index becomes positive", units = "keV" },
  { sym = "\\tilde E_{pe}", meaning = "angle-dependent effective plasma energy E_pe sqrt(3 - 2 cos theta_k)", units = "keV" },
  { sym = "E_{L}", meaning = "line energy of the plasma-edge feature in the emissivity fit", units = "keV" },
  { sym = "\\theta_{Bn}", sym_source = "\\theta_B^{(n)}", aliases = ["Theta", "\\Theta_B", "\\theta_B^{(n)}", "θ_Bn"], meaning = "angle between the magnetic field B and the local surface normal n", meaning_source = "angle between the magnetic field and the surface normal z (paper: theta_B)", units = "rad" },
  { sym = "\\theta", sym_source = "\\theta_k", aliases = ["\\theta_k", "theta^(i)", "θ"], meaning = "polar angle between the photon wave vector k and the local outward surface normal n; mu = cos theta (Pot12 theta_k is a folded incidence parameter: it equals theta for outgoing rays and pi - theta for incident rays)", meaning_source = "incidence (or reflection) polar angle of the wave vector with respect to the surface normal (van Adelsberg+2005: theta^(i))", units = "rad" },
  { sym = "\\varphi_k", sym_source = "\\varphi_{k}", aliases = ["\\varphi_{k}", "phi", "φ"], meaning = "azimuthal angle of the photon wave vector about the surface normal, measured from the plane containing B and the normal", meaning_source = "azimuthal angle in the surface plane between the plane of incidence and the plane of the field and normal (paper: phi)", units = "rad" },
  { sym = "\\theta_{kB}^{(i)}", sym_source = "\\alpha_{i}", meaning = "angle between incident wave vector and magnetic field, cos = sin theta_Bn sin theta cos phi_k - cos theta_Bn cos theta, with theta the polar angle of the folded incidence parameter (Pot12 theta_k)", units = "rad" },
  { sym = "\\theta_{kB}^{(r)}", sym_source = "\\alpha_{r}", meaning = "angle between reflected (outgoing) wave vector and magnetic field, cos = sin theta_Bn sin theta cos phi_k + cos theta_Bn cos theta", units = "rad" },
  { sym = "\\theta_{kB}^{(min)}", sym_source = "α", aliases = ["α"], meaning = "min(theta_kB^(r), theta_kB^(i)); Pot12 writes the bare alpha for this angle", units = "rad" },
]
conflicts_with = ["const.notation-atomic", "gr.notation-geometry", "gr.notation-pechenick", "obs.notation-rxj1856-photometry", "obs.notation-rxj1856-spectral", "opacity.notation-modes-polarization", "opacity.notation-particles-plasma", "rt.notation-spw09", "surface.notation-geometry"]
adopted = false
conflict_notes = ["alpha: Bel02 emission angle keeps \\alpha. Renamed: Pech83 polar-cap radius -> \\theta_{cap}; CODATA/PLCH04 fine-structure -> \\alpha_f; PC03/PLCH04 cyclic polarisation index -> \\alpha_{pol}; Kaplan11 optical index -> \\alpha_{opt}; SPW09 B-k angle -> \\theta_{kB}; SPW09 albedo -> \\varpi_\\nu^j; GH83 pole-to-sight angle -> \\psi_{pole}; Pot12 incident/reflected k-B angles -> \\theta_{kB}^{(i)}, \\theta_{kB}^{(r)}, \\theta_{kB}^{(min)}.", "phi: Bel02 surface-element azimuth about the line of sight keeps \\phi. Pech83 orbit-plane azimuth -> \\phi_{orb}; SPW09/Pot12 photon azimuth about the normal -> \\varphi_k; GH83 rotation phase -> \\phi_{rot}.", "theta: RT ray angle to the surface normal keeps \\theta (mu = cos theta). Schwarzschild polar coordinate (Bel02, Pech83) -> \\theta_{Sch}; GH83 line-of-sight colatitude -> \\theta_{los}; Pot12 theta_k merged into \\theta.", "theta_B: Magnetic colatitude keeps \\theta_B. PC03/PLCH04 k-B angle -> \\theta_{kB}; SPW09/Pot12/Ho07 field-normal angle -> \\theta_{Bn}."]
source = "potekhin_2012_condensed_surface"
locator = "Sect. 2.1-2.2 (p. 2-4) and Fig. 1"
