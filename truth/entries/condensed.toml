[[entry]]
id = "rt.notation-cond-emissivity-fit"
kind = "notation"
domain = "rt"
name = "Notation: emissivities, reflectivities and fit functions"
statement = "Symbols for the emissivity, reflectivity and analytic-fit functions of Potekhin+2012 (some paper symbols renamed where they clash with other domains, e.g. paper R -> R_mean, paper L -> L_line, paper X -> X_L)."
symbols = [
  { sym = "J", meaning = "mean dimensionless emissivity J = 1 - R = (J_1 + J_2)/2", units = "1" },
  { sym = "J_{l}", sym_source = "J_{j}", aliases = ["J_{j}", "J_1"], meaning = "dimensionless emissivity of linear polarisation l = 1 (perpendicular), 2 (parallel to the plane of incidence), J_l = 1 - R_l; orientation fixed by the explicit vectors of Pot12 App. B, which contradict the paper prose at lines 215-216", units = "1" },
  { sym = "R_{mean}", sym_source = "R", meaning = "mean reflectivity (R_1 + R_2)/2 (paper: R)", units = "1" },
  { sym = "R_{l}", sym_source = "R_{j}", aliases = ["R_{j}"], meaning = "effective reflectivity of linear polarisation j", units = "1" },
  { sym = "r_{l'l}", sym_source = "r_{mj}", aliases = ["r_{mj}"], meaning = "complex reflected-field amplitude into polarisation m for incident polarisation j", units = "1" },
  { sym = "\\phi_{l'l}", sym_source = "\\phi_{mj}", aliases = ["\\phi_{mj}"], meaning = "phase of r_mj", units = "rad" },
  { sym = "R_{jj'}", sym_source = "R_{MM'}", aliases = ["R_{MM'}"], meaning = "reflection coefficient from incident mode M' into reflected mode M (M, M' = X, O), |r'_MM'|^2", units = "1" },
  { sym = "J_X", sym_source = "J_{X}", meaning = "normal-mode emissivity 1 - R_X (X-mode), with R_X = R_XX + R_XO", units = "1" },
  { sym = "J_O", sym_source = "J_{O}", meaning = "normal-mode emissivity 1 - R_O (O-mode), with R_O = R_OO + R_OX", units = "1" },
  { sym = "I_{E,l}", sym_source = "I_{E,j}", aliases = ["I_{E,j}"], meaning = "specific intensity per unit energy emitted in linear polarisation l (l = 1 perpendicular, 2 parallel to the plane of incidence); I_E = (1.602176634e-9 erg/keV) I_nu/h for per-keV units", units = "erg s^-1 cm^-2 keV^-1 sr^-1" },
  { sym = "I_E^{j}", sym_source = "I_E^{M}", aliases = ["I_E^{M}"], meaning = "specific intensity per unit energy of normal mode M = X, O in the atmosphere; I_E = (1.602176634e-9 erg/keV) I_nu/h for per-keV units", units = "erg s^-1 cm^-2 keV^-1 sr^-1" },
  { sym = "B_E", meaning = "Planck function per unit energy, B_E = (1.602176634e-9 erg/keV) B_nu/h for per-keV units", units = "erg s^-1 cm^-2 keV^-1 sr^-1" },
  { sym = "P_{lin}", meaning = "degree of linear polarisation of the emitted radiation", units = "1" },
  { sym = "J_A", meaning = "fit emissivity in Region I (low energies)", units = "1" },
  { sym = "J_B", meaning = "fit emissivity for E_ci < E <~ E~_C (power-law interpolation)", units = "1" },
  { sym = "J_C", meaning = "fit factor for the steep rise at E > E~_C", units = "1" },
  { sym = "J_0", meaning = "approximate zero-angle emissivity 1 - (R_- + R_+)/2 of eq. 10, neglecting finite electron relaxation", units = "1" },
  { sym = "A_{fit}", sym_source = "A(E)", aliases = ["A(E)"], meaning = "fit function A(E) of eq. 16", units = "1" },
  { sym = "L_{line}", meaning = "fit function describing the line near E_pe (paper: L)", units = "1" },
  { sym = "X_L", sym_source = "X", aliases = ["X"], meaning = "dimensionless line-profile variable (E - E_L)/(2 E_pe W_L)/(1 - cos theta_k) (paper: X)", units = "1" },
  { sym = "W_L", meaning = "line width parameter", units = "1" },
  { sym = "R_{L}", meaning = "line-strength function in the fit of linear polarisation l = 1", units = "1" },
  { sym = "J_{A1}", meaning = "fit term J_A of the linear-polarisation-1 emissivity J_1 = J_{l=1}", units = "1" },
  { sym = "J_{B1}", meaning = "fit term J_B of the linear-polarisation-1 emissivity J_1 = J_{l=1}", units = "1" },
  { sym = "a_1", meaning = "linear-polarisation-1 fit coefficient a_1 of eq. 25", units = "1" },
  { sym = "A_1", meaning = "linear-polarisation-1 fit coefficient A_1 of eq. 25", units = "1" },
  { sym = "p", meaning = "power-law exponent of J_B (fit of the mean emissivity)", units = "1" },
  { sym = "p_1", meaning = "power-law exponent of J_B1 (fit of linear polarisation 1)", units = "1" },
