depends_on = ["rt.cond-ion-cyclotron-energy", "rt.cond-electron-plasma-energy", "rt.cond-electron-cyclotron-energy"]
notes = "van Adelsberg+2005 eq. 19: E_C ~ E_Bi + E_pe^2/E_Be, derived from n_1^2 -> 0 (with n_1^2 = eps + g) at normal incidence."
